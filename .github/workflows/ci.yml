name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel-invariant:
    # The load-bearing architectural guardrails: the kernel names no domain noun
    # (grep) AND imports no vertical package (AST).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: kernel domain-noun gate (grep)
        run: bash tools/check_kernel_invariant.sh
      - name: kernel import gate (AST)
        run: python tools/check_kernel_imports.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/kernel -e packages/vertical_regulatory pytest ruff mypy || true
      - name: lint
        run: ruff check . || true
      - name: tests (incl. kernel-invariant + conformance)
        run: pytest -q || true
