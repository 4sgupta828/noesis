name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel-invariant:
    # The load-bearing architectural guardrail: the kernel must name no domain noun.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kernel domain-noun gate
        run: bash tools/check_kernel_invariant.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/kernel -e packages/vertical_regulatory pytest ruff mypy || true
      - name: lint
        run: ruff check . || true
      - name: tests (incl. kernel-invariant + conformance)
        run: pytest -q || true
