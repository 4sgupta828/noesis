<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noesis Ambient CDS — case library</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1a1f28; --muted:#5b6472; --line:#e4e7ec;
    --brand:#12603b; --brand-ink:#0b4429; --accent:#2559c9;
    --s-major:#b42318; --s-mod:#b25e09; --ok:#0b7a4b; --okbg:#eef7f1; --flag:#b42318; --flagbg:#fdeceb;
    --chip:#eef1f4; --gap:#fff8ec; --gapln:#8a5a00;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{background:var(--brand);color:#fff;padding:14px 16px}
  header .back{display:inline-block;color:#fff;opacity:.85;text-decoration:none;font-size:13px;font-weight:600;margin-bottom:6px}
  header .back:hover{opacity:1;text-decoration:underline}
  header .t{font-weight:700;font-size:18px}
  header .s{opacity:.85;font-size:12.5px}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  /* library board */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  #search{flex:1 1 220px;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;min-height:44px}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .fchip{appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted);min-height:36px}
  .fchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .count{font-size:12.5px;color:var(--muted)}
  .catgroup{margin:18px 0 6px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .case{text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--card);font:inherit}
  .case:hover{border-color:var(--brand)}
  .case .ct{font-weight:650;font-size:14.5px;margin-bottom:3px}
  .case .cm{font-size:12px;color:var(--muted)} .case .cd{font-size:12px;color:var(--accent);margin-top:6px}
  .case .tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;background:#fff3e8;color:#b25e09;margin-left:6px}
  /* analyzer / clinical document */
  .abar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .btnlink{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:6px 0;min-height:40px}
  .cpbtn{margin-left:auto;background:var(--brand);color:#fff;border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:42px} .cpbtn.done{background:var(--brand-ink)}
  .doc{max-width:760px;margin:0 auto}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .sec h3{margin:0 0 12px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:8px}
  .pname{font-size:20px;font-weight:700} .pmeta{font-size:13.5px;color:var(--muted);margin-top:3px}
  .kv{display:flex;gap:8px;font-size:14px;margin:3px 0} .kv .k{color:var(--muted);min-width:120px}
  .quote{background:#f1f4f8;border-radius:9px;padding:10px 12px;font-size:14px;margin-top:6px}
  .picture{font-size:15px;line-height:1.6}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .pill{font-size:12px;border-radius:999px;padding:4px 10px;border:1px solid var(--line)}
  .pill.have{background:var(--okbg);color:var(--ok);border-color:#cfe7d8} .pill.miss{background:var(--flagbg);color:var(--flag);border-color:#f4d3d0}
  .labs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .lab{font-size:12.5px;border-radius:6px;padding:3px 10px;background:#f1f4f8;font-family:ui-monospace,Menlo,monospace} .lab.flag{background:var(--flagbg);color:var(--flag)}
  .lead{font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  ul.clean{list-style:none;padding:0;margin:0} ul.clean li{padding:7px 0;border-bottom:1px solid #f0f2f5;font-size:14px} ul.clean li:last-child{border-bottom:0}
  .dx{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .dx .code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
  .chk{border-left:4px solid var(--line);padding:9px 12px;border-radius:0 8px 8px 0;margin-bottom:8px;background:#fafbfc;font-size:14px}
  .chk.safety{border-left-color:var(--s-major)} .chk.hold{border-left-color:var(--s-major);background:var(--flagbg)}
  .chk.confirm{border-left-color:var(--s-mod)} .chk.start{border-left-color:var(--ok)} .chk.warn{border-left-color:var(--s-mod);background:var(--gap)}
  .chk .ct{font-weight:650} .chk .why{color:var(--ink);margin-top:3px;font-size:13.5px} .chk .why b{color:var(--brand)}
  .chk .bs{font-size:11.5px;color:var(--muted);margin-top:5px}
  .strength{display:inline-block;font-size:10.5px;font-weight:800;color:var(--ok);background:var(--okbg);border-radius:5px;padding:1px 6px;margin-left:6px}
  .ok{color:var(--ok);font-size:14px}
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px} .tbl th,.tbl td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700}
  .med{display:grid;grid-template-columns:1fr auto;gap:6px;padding:8px 0;border-bottom:1px solid #f0f2f5;font-size:14px} .med:last-child{border-bottom:0}
  .med .mn{font-weight:600} .med .mw{color:var(--muted);font-size:13px} .med .md{font-size:12px;color:var(--brand);white-space:nowrap;font-weight:600}
  .note{font-size:12px;color:var(--muted);margin-top:8px;font-style:italic}
  .gapc{background:var(--gap);border:1px solid #f0e0c0;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:13.5px}
  .gapc b{color:var(--gapln)}
  .empty{color:var(--muted);font-size:14px} .foot{font-size:11.5px;color:var(--muted);margin:6px 0 24px;text-align:center}
  @media (max-width:560px){ .med{grid-template-columns:1fr} .kv{flex-direction:column;gap:0} .kv .k{min-width:0} }
</style>
</head>
<body>
<header>
  <a class="back" href="/app">← Noesis</a>
  <div class="t">Ambient CDS — Case Library</div>
  <div class="s">50 realistic encounters. Pick one to see the clinical read the CDS produces.</div>
</header>

<div class="wrap">
  <div id="libraryView">
    <div class="toolbar"><input id="search" placeholder="Search cases (condition, drug, age)…" oninput="renderBoard()"><span class="count" id="count"></span></div>
    <div class="filters" id="filters"></div>
    <div id="board"></div>
  </div>

  <div id="analyzerView" hidden>
    <div class="abar">
      <button class="btnlink" onclick="showLibrary()">← All cases</button>
      <button class="cpbtn" id="cpbtn" onclick="copyNote()">📋 Copy note</button>
    </div>
    <div class="doc">
      <section class="sec" id="secPatient"></section>
      <section class="sec" id="secEnc"></section>
      <section class="sec"><h3>Pre-visit — clinical picture &amp; data</h3><div id="secPicture"></div></section>
      <section class="sec"><h3>Working diagnosis &amp; current prescription</h3><div id="secDx"></div></section>
      <section class="sec"><h3>Prescription deep-check &amp; proposed refinements</h3><div id="secChecks"></div></section>
      <section class="sec" id="secPrecWrap" hidden><h3>Precedents — similar patients</h3><div id="secPrec"></div></section>
      <section class="sec"><h3>Post-visit — follow-up plan</h3><div id="secPost"></div></section>
      <div class="foot" id="disc"></div>
    </div>
  </div>
</div>

<script>
let LIB=[], ACTIVE_CAT="All";
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function cap(s){return (s||'').charAt(0).toUpperCase()+(s||'').slice(1);}

async function loadLibrary(){
  try{ LIB=(await (await fetch('/ambient/library')).json()).cases||[]; }catch(e){ LIB=[]; }
  const cats=["All",...Array.from(new Set(LIB.map(c=>c.category)))];
  document.getElementById('filters').innerHTML=cats.map(c=>`<button class="fchip ${c==='All'?'on':''}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join('');
  renderBoard();
}
function setCat(c){ ACTIVE_CAT=c; document.querySelectorAll('.fchip').forEach(b=>b.classList.toggle('on',b.textContent===c)); renderBoard(); }
function renderBoard(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  let cases=LIB.filter(c=>ACTIVE_CAT==='All'||c.category===ACTIVE_CAT);
  if(q) cases=cases.filter(c=>JSON.stringify(c).toLowerCase().includes(q));
  document.getElementById('count').textContent=`${cases.length} case${cases.length===1?'':'s'}`;
  const groups={}; cases.forEach(c=>{ (groups[c.category]=groups[c.category]||[]).push(c); });
  document.getElementById('board').innerHTML=Object.keys(groups).map(cat=>`
    <div class="catgroup">${esc(cat)}</div>
    <div class="grid">${groups[cat].map(c=>`
      <button class="case" onclick="openCase('${esc(c.id)}')">
        <div class="ct">${esc(c.title)}${c.mode==='IN'?'<span class="tag">India</span>':''}</div>
        <div class="cm">${esc(c.name||'')} · ${c.age}${esc((c.sex||'')[0]||'')} · ${esc(c.complexity||'')}</div>
        <div class="cd">${esc(c.demonstrates||'')}</div>
      </button>`).join('')}</div>`).join('') || '<div class="empty">No cases match.</div>';
}

async function openCase(id){
  const c=LIB.find(x=>x.id===id); if(!c) return;
  window._case=c;
  document.getElementById('libraryView').hidden=true;
  document.getElementById('analyzerView').hidden=false; window.scrollTo(0,0);
  // age/sex live at the case top level — fold them into the patient context the engine reads
  const body={transcript:c.transcript,
    patient:Object.assign({}, c.patient||{}, {age_years:c.age, sex:c.sex}),
    mode:c.mode||'US', recent_hospitalization:!!c.recent_hosp};
  const r=await fetch('/ambient/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  render(await r.json());
}
function showLibrary(){ document.getElementById('analyzerView').hidden=true; document.getElementById('libraryView').hidden=false; window.scrollTo(0,0); }

function render(res){
  const c=window._case||{}, p=c.patient||{};
  // 1. Patient
  document.getElementById('secPatient').innerHTML=
    `<div class="pname">${esc(c.name||'Patient')}</div>
     <div class="pmeta">${c.age} yrs · ${esc(cap(c.sex||''))} · ${esc(c.location||'')} · ${esc(c.mrn||'')}</div>`;
  // 2. Encounter
  document.getElementById('secEnc').innerHTML=
    `<h3>Encounter</h3>
     <div class="kv"><span class="k">Examining clinician</span><span>${esc(c.doctor||'—')}</span></div>
     <div class="kv"><span class="k">Date</span><span>${esc(c.date||'')} · ${c.mode==='IN'?'India':'US'}${c.recent_hosp?' · recently hospitalized':''}</span></div>
     <div class="lead">Reason / narrative</div><div class="quote">“${esc(c.transcript||'')}”</div>`;
  // 3. Pre — clinical picture & data
  const gd=res.gdmt;
  let pic=`<div class="picture">${esc(res.clinical_picture||'')}</div>`;
  if(gd) pic+=`<div class="lead">Heart-failure GDMT pillars — ${gd.n_have} of ${gd.n_total} present</div><div class="pills">`+
    gd.have.map(h=>`<span class="pill have">✓ ${esc(h)}</span>`).join('')+gd.missing.map(m=>`<span class="pill miss">✗ ${esc(m)}</span>`).join('')+`</div>`;
  const labs=res.labs||{}; const flag={potassium:v=>v>=5.0,egfr:v=>v<30,hr:v=>v<50};
  const lc=Object.entries(labs).map(([k,v])=>{let t,f=false; if(k==='bp'){t=`BP ${v.systolic}/${v.diastolic}`;f=v.systolic<90;} else {t=`${k.toUpperCase()} ${v.value}`;f=flag[k]?flag[k](v.value):false;} return `<span class="lab ${f?'flag':''}">${esc(t)}</span>`;});
  pic+= lc.length ? `<div class="lead">Test results / vitals</div><div class="labs">${lc.join('')}</div>` : '';
  document.getElementById('secPicture').innerHTML=pic;
  // 4. Working diagnosis & current prescription
  const pv=res.pre_visit;
  let dx=`<div class="lead">Working diagnoses</div><ul class="clean">`+
    (pv.conditions.length? pv.conditions.map(cd=>{const code=(res.post_visit.icd10||[]).find(x=>x.condition===cd.condition);
      return `<li class="dx"><span>${esc(cd.label)}</span><span class="code">${code?esc(code.code):''}</span></li>`;}).join('')
      : '<li class="empty">No chronic diagnosis detected</li>')+`</ul>`;
  const meds=res.encounter.medications;
  dx+=`<div class="lead">Current prescription (medications on record / heard)</div><ul class="clean">`+
    (meds.length? meds.map(m=>`<li>${esc(m.mention)} <span class="mw" style="color:var(--muted);font-size:13px">→ ${esc(m.molecules.join(' + '))}</span></li>`).join('')
      : '<li class="empty">None recorded</li>')+`</ul>`;
  document.getElementById('secDx').innerHTML=dx;
  // 5. Deep checks & refinements
  let ck='';
  const saf=res.encounter.safety_findings||[];
  ck+=`<div class="lead">Drug-safety checks</div>`;
  ck+= saf.length? saf.map(f=>`<div class="chk safety"><div class="ct">${esc(f.title)}</div><div class="why">${esc(f.detail)}${f.management?' — '+esc(f.management):''}</div><div class="bs">Basis — ${esc(f.basis.source)}: ${esc(f.basis.citation)}</div></div>`).join('')
    : '<div class="ok">✓ No drug-safety issues on the current medications</div>';
  const coh=(res.coherency||[]).filter(x=>!x.indication_present);
  ck+=`<div class="lead">Coherency with the clinical picture</div>`;
  ck+= coh.length? coh.map(x=>`<div class="chk warn"><div class="ct">${esc(x.med)}</div><div class="why">${esc(x.note)}</div></div>`).join('')
    : '<div class="ok">✓ Prescription is consistent with the documented problems</div>';
  const gaps=(res.priorities||[]).filter(x=>x.kind==='gap');
  ck+=`<div class="lead">Proposed refinements</div>`;
  ck+= gaps.length? gaps.map(g=>{const cn=g.caution, hold=cn&&cn.level==='hold';
    return `<div class="chk ${hold?'hold':(cn?'confirm':'start')}"><div class="ct">${esc(g.title)}${g.strength?`<span class="strength">${esc(g.strength)}</span>`:''} <span class="mw" style="color:var(--muted);font-size:12px">· ${esc(g.when)}</span></div>
      <div class="why"><b>Why:</b> ${esc(g.why)}</div>
      ${cn?`<div class="why" style="color:${hold?'var(--s-major)':'var(--s-mod)'}"><b>${hold?'⛔ Hold':'⚠ Confirm first'}:</b> ${esc(cn.reason)}</div>`:''}
      <div class="bs">${esc(g.basis.source)}${g.basis.citation?' · '+esc(g.basis.citation):''}</div></div>`;}).join('')
    : '<div class="ok">✓ No guideline gaps for the documented problems</div>';
  const cov=res.coverage.unverifiable||[];
  if(cov.length) ck+=`<div class="lead">Could not verify (not clearance)</div>`+cov.map(g=>`<div class="gapc"><b>${esc(g.molecule)}</b> — ${esc(g.why)}</div>`).join('');
  document.getElementById('secChecks').innerHTML=ck;
  // 6. Precedents
  const prec=res.precedents||{};
  if(prec.rows&&prec.rows.length){
    document.getElementById('secPrecWrap').hidden=false;
    document.getElementById('secPrec').innerHTML=
      `<div class="lead">Similar patients — ${esc(prec.cohort)}</div>
       <table class="tbl"><thead><tr><th>Patient</th><th>Prescription</th><th>Clinician</th></tr></thead><tbody>`+
       prec.rows.map(r=>`<tr><td>${esc(r.patient)}</td><td>${esc(r.prescription)}</td><td>${esc(r.doctor)}</td></tr>`).join('')+
       `</tbody></table><div class="note">${esc(prec.note)}</div>`;
  } else document.getElementById('secPrecWrap').hidden=true;
  // 7. Post — follow-up
  const M=res.medications||{start:[],hold:[],continue:[]};
  let post=`<div class="lead">New tests / procedures to follow up</div>`;
  post+= (res.follow_up&&res.follow_up.length)? `<ul class="clean">`+res.follow_up.map(t=>`<li>${esc(t)}</li>`).join('')+`</ul>` : '<div class="empty">None specific this visit</div>';
  post+=`<div class="lead">Medications — what, why, how long</div>`;
  const mrow=(m,tag)=>`<div class="med"><div><span class="mn">${tag} ${esc(m.med)}</span><div class="mw">${esc(m.why||'')}</div></div>${m.duration?`<div class="md">${esc(m.duration)}</div>`:''}</div>`;
  const allMeds=M.start.map(m=>mrow(m,'Start')).concat(M.hold.map(m=>mrow(m,'⛔ Hold'))).concat(M.continue.map(m=>mrow(m,'Continue')));
  post+= allMeds.length? allMeds.join('') : '<div class="empty">No medication changes</div>';
  post+=`<div class="lead">Physical therapy / non-drug</div>`;
  post+= (res.non_drug&&res.non_drug.length)? `<ul class="clean">`+res.non_drug.map(n=>`<li>${esc(n)}</li>`).join('')+`</ul>` : '<div class="empty">None indicated</div>';
  document.getElementById('secPost').innerHTML=post;

  document.getElementById('disc').textContent=res.disclaimer;
  window._note=buildNote(res,c);
  const cb=document.getElementById('cpbtn'); cb.textContent='📋 Copy note'; cb.classList.remove('done');
}

// clean PLAIN-TEXT note (no markdown symbols) assembled from the sections
function buildNote(res,c){
  const L=[]; const push=(s)=>L.push(s);
  push(`${c.name||'Patient'}  (${c.age} yrs, ${cap(c.sex||'')})  ${c.location||''}  ${c.mrn||''}`);
  push(`Seen by ${c.doctor||''} on ${c.date||''}`); push('');
  push('CLINICAL PICTURE'); push(res.clinical_picture||'');
  const labs=res.labs||{}; const ls=Object.entries(labs).map(([k,v])=>k==='bp'?`BP ${v.systolic}/${v.diastolic}`:`${k.toUpperCase()} ${v.value}`);
  if(ls.length) push('Data: '+ls.join(', '));
  push('');
  push('WORKING DIAGNOSES');
  (res.pre_visit.conditions||[]).forEach(cd=>{const code=(res.post_visit.icd10||[]).find(x=>x.condition===cd.condition); push(`  - ${cd.label}${code?'  ['+code.code+']':''}`);});
  push('');
  const saf=res.encounter.safety_findings||[];
  if(saf.length){ push('DRUG-SAFETY CHECKS'); saf.forEach(f=>push(`  - ${f.title} — ${f.management||f.detail}`)); push(''); }
  const gaps=(res.priorities||[]).filter(x=>x.kind==='gap');
  if(gaps.length){ push('PROPOSED REFINEMENTS'); gaps.forEach(g=>{const cn=g.caution; push(`  - ${g.title}${cn?(cn.level==='hold'?' — HOLD: '+cn.reason:' — CONFIRM: '+cn.reason):''}`);}); push(''); }
  const M=res.medications||{start:[],hold:[],continue:[]};
  push('MEDICATIONS');
  M.start.forEach(m=>push(`  - Start ${m.med} (${m.why}) — ${m.duration}`));
  M.hold.forEach(m=>push(`  - HOLD ${m.med} — ${m.why}`));
  M.continue.forEach(m=>push(`  - Continue ${m.med} ${m.why} — ${m.duration}`));
  push('');
  if((res.follow_up||[]).length){ push('FOLLOW-UP TESTS / PROCEDURES'); res.follow_up.forEach(t=>push(`  - ${t}`)); push(''); }
  if((res.non_drug||[]).length){ push('PHYSICAL THERAPY / NON-DRUG'); res.non_drug.forEach(n=>push(`  - ${n}`)); push(''); }
  push('— Advisory decision support (Noesis). Clinician confirms and signs.');
  return L.join('\n');
}
async function copyNote(){ const b=document.getElementById('cpbtn');
  try{ await navigator.clipboard.writeText(window._note||''); b.textContent='✓ Copied to clipboard'; b.classList.add('done'); }
  catch(e){ b.textContent='Copy failed — select the note manually'; } }

loadLibrary();
</script>
</body>
</html>
