<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noesis — Corpus Coverage</title>
<script>/* apply the app's saved theme before paint (no flash) — Coverage follows the main app's light/dark choice */
try{var t=localStorage.getItem("noesis-theme"); if(t==="dark"||t==="light") document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
  /* DEFAULT = CLINICAL LIGHT — mirrors the main app; dark is opt-in and follows the app's theme choice
     (shared localStorage key "noesis-theme") or the OS preference when no explicit choice was made. */
  :root{
    color-scheme:light;
    --bg:#EEF3F8; --panel:#FFFFFF; --panel2:#F4F8FC; --ink:#132430; --muted:#5A6B7B;
    --gold:#1568B5; --gold-rgb:21,104,181; --verified:#137A54; --gap:#B26A1E; --hair:#D2DEEA;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#060E1B; --panel:#0F1A2C; --panel2:#0C1524; --ink:#ECEBE3; --muted:#8B96A9;
    --gold:#D3B37C; --gold-rgb:211,179,124; --verified:#57B891; --gap:#D6975A; --hair:#22304A;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#060E1B; --panel:#0F1A2C; --panel2:#0C1524; --ink:#ECEBE3; --muted:#8B96A9;
    --gold:#D3B37C; --gold-rgb:211,179,124; --verified:#57B891; --gap:#D6975A; --hair:#22304A;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    font-size:15px;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 60% at 85% -10%, rgba(var(--gold-rgb),.06), transparent 60%);}
  .wrap{max-width:56rem;margin:0 auto;padding:1.5rem 1.15rem 5rem;}
  header{display:flex;align-items:center;gap:.8rem;padding:.1rem 0 1.2rem;border-bottom:1px solid var(--hair);margin-bottom:1.6rem;flex-wrap:wrap;}
  .logo{height:52px;width:auto;}
  h1{font-family:var(--serif);font-size:1.7rem;margin:.2rem 0 .2rem;letter-spacing:-.01em;}
  .back{margin-left:auto;font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);text-decoration:none;border:1px solid var(--hair);border-radius:8px;padding:.4rem .8rem;}
  .back:hover{color:var(--gold);border-color:var(--gold);}
  h2{font-family:var(--sans);font-size:.72rem;text-transform:uppercase;letter-spacing:.13em;color:var(--gold);
    margin:2rem 0 .8rem;padding-top:1.3rem;border-top:1px solid var(--hair);display:flex;align-items:center;gap:.5rem;}
  h2::before{content:"";width:15px;height:2px;background:var(--gold);border-radius:2px;}
  h2:first-of-type{border-top:none;padding-top:0;margin-top:.5rem;}
  .totals{display:flex;gap:1.5rem;flex-wrap:wrap;margin:.3rem 0 .5rem;}
  .stat{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:.9rem 1.15rem;}
  .stat .n{font-family:var(--serif);font-size:1.9rem;color:var(--ink);line-height:1;}
  .stat .l{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-top:.35rem;}
  table{border-collapse:collapse;width:100%;font-size:.9rem;}
  th{font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    font-weight:660;text-align:left;padding:.5rem .7rem;border-bottom:1.5px solid var(--gold);}
  td{padding:.55rem .7rem;border-bottom:1px solid var(--hair);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  .tw{overflow-x:auto;}
  .badge{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;
    border-radius:999px;padding:.1rem .5rem;border:1px solid var(--hair);color:var(--muted);}
  .b-live{color:var(--verified);border-color:var(--verified);}
  .b-partial{color:var(--gold);border-color:var(--gold);}
  .b-connector,.b-planned{color:var(--muted);}
  .num{font-family:var(--mono);color:var(--ink);}
  .zero{color:var(--muted);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:.5rem;}
  .cgroup{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:.8rem .9rem;}
  .cgroup h3{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 .5rem;}
  .cgroup .item{display:flex;align-items:center;gap:.5rem;padding:.18rem 0;font-size:.9rem;}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .d-deep{background:var(--verified);} .d-reference{background:var(--gold);}
  .d-medium{background:#6EA0E0;} .d-shallow{background:var(--gap);} .d-rem{background:var(--muted);opacity:.5;}
  .depth{font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-left:auto;text-transform:uppercase;}
  .muted{color:var(--muted);font-size:.85rem;}
  .note{font-size:.7rem;color:var(--muted);}
  @media (max-width:560px){ .logo{height:44px;} h1{font-size:1.4rem;} }

  /* ---- Corpus Explorer (admin-gated, read-only) ---- */
  #corpus-explorer .ce-controls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end;margin:.3rem 0 .8rem;}
  .ce-field{display:flex;flex-direction:column;gap:.25rem;}
  .ce-field label{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
  .ce-field input,.ce-field select{font-family:var(--sans);font-size:.85rem;color:var(--ink);background:var(--panel);
    border:1px solid var(--hair);border-radius:8px;padding:.42rem .55rem;min-width:8rem;}
  .ce-field input:focus,.ce-field select:focus{outline:none;border-color:var(--gold);}
  .ce-seg{display:inline-flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden;}
  .ce-seg button{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;
    background:var(--panel);color:var(--muted);border:none;padding:.44rem .75rem;cursor:pointer;}
  .ce-seg button.on{background:var(--gold);color:#fff;}
  .ce-btn{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;
    background:var(--gold);color:#fff;border:1px solid var(--gold);border-radius:8px;padding:.48rem .95rem;}
  .ce-btn:disabled{opacity:.5;cursor:not-allowed;}
  .ce-status{font-size:.82rem;color:var(--muted);margin:.2rem 0 .9rem;min-height:1.1em;}
  .ce-status.err{color:var(--gap);}
  .ce-block{background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:.75rem .9rem;margin-bottom:.7rem;}
  .ce-chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.5rem;align-items:center;}
  .ce-chip{font-family:var(--mono);font-size:.6rem;letter-spacing:.03em;border-radius:999px;padding:.14rem .5rem;
    border:1px solid var(--hair);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
  .ce-chip b{color:var(--ink);font-weight:660;}
  .ce-text{font-size:.9rem;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .ce-open{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;
    background:transparent;border:1px solid var(--hair);border-radius:999px;padding:.14rem .55rem;color:var(--gold);margin-left:auto;}
  .ce-open:hover{border-color:var(--gold);}
  .ce-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;
    padding:2.5rem 1rem;z-index:50;overflow-y:auto;}
  .ce-modal[hidden]{display:none;}
  .ce-dialog{background:var(--panel);border:1px solid var(--hair);border-radius:14px;max-width:52rem;width:100%;
    padding:1.2rem 1.3rem 1.6rem;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .ce-dhead{display:flex;align-items:flex-start;gap:.7rem;margin-bottom:.6rem;}
  .ce-dclose{margin-left:auto;flex:none;font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;
    cursor:pointer;background:transparent;border:1px solid var(--hair);border-radius:8px;padding:.32rem .7rem;color:var(--muted);}
  .ce-dclose:hover{color:var(--gold);border-color:var(--gold);}
  .ce-dblock{border-top:1px solid var(--hair);padding:.6rem 0;}
  .ce-dblock:last-child{padding-bottom:0;}
  .ce-dblock .bid{font-family:var(--mono);font-size:.58rem;color:var(--muted);margin-bottom:.2rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="/noesis-mark.png" alt="Noesis" />
    <h1>Corpus Coverage</h1>
    <a class="back" href="/">← Research</a>
  </header>
  <div id="out"><div class="muted">Loading coverage…</div></div>

  <!-- Corpus Explorer: admin-gated, read-only raw retrieval (no LLM, no answers). Hidden unless /config says enabled. -->
  <div id="corpus-explorer" hidden>
    <h2>Corpus Explorer</h2>
    <div class="note" style="margin-bottom:.9rem;">Read-only keyword / semantic search over ingested corpus blocks — raw evidence + provenance, no LLM and no answers. Admin only.</div>
    <div class="ce-controls">
      <div class="ce-field"><label>Admin password</label><input id="ce-pw" type="password" placeholder="admin password" autocomplete="off" /></div>
      <div class="ce-field"><label>Tenant</label><input id="ce-tenant" value="demo" /></div>
      <div class="ce-field" style="flex:1;min-width:14rem;"><label>Query</label><input id="ce-q" placeholder="keywords…" /></div>
      <div class="ce-field"><label>Mode</label>
        <div class="ce-seg" id="ce-mode"><button type="button" data-mode="keyword" class="on">Keyword</button><button type="button" data-mode="semantic">Semantic</button></div>
      </div>
      <div class="ce-field"><label>Limit</label><input id="ce-limit" type="number" value="20" min="1" max="100" style="min-width:5rem;" /></div>
    </div>
    <div class="ce-controls">
      <div class="ce-field"><label>source_key</label><input id="ce-f-source_key" placeholder="any" /></div>
      <div class="ce-field"><label>journal (ILIKE)</label><input id="ce-f-journal" placeholder="any" /></div>
      <div class="ce-field"><label>modality</label><select id="ce-f-modality"><option value="">any</option></select></div>
      <div class="ce-field"><label>source_country</label><select id="ce-f-source_country"><option value="">any</option></select></div>
      <div class="ce-field"><label>pub_type</label><select id="ce-f-pub_type"><option value="">any</option></select></div>
      <div class="ce-field"><label>content_type</label><select id="ce-f-content_type"><option value="">any</option></select></div>
      <div class="ce-field"><label>&nbsp;</label><button type="button" class="ce-btn" id="ce-search">Search</button></div>
    </div>
    <div class="ce-status" id="ce-status"></div>
    <div id="ce-results"></div>
  </div>
</div>

<!-- Corpus Explorer: single-document viewer (all blocks in order) -->
<div class="ce-modal" id="ce-modal" hidden>
  <div class="ce-dialog">
    <div class="ce-dhead">
      <div id="ce-dtitle" style="flex:1;min-width:0;"></div>
      <button type="button" class="ce-dclose" id="ce-dclose">✕ close</button>
    </div>
    <div id="ce-dbody"></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => { const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; };
const fmt = n => (n||0).toLocaleString();
// (Product settings moved to the ⚙ icon in the main app — this page is coverage only.)

async function load(){
  let d;
  try{ d = await (await fetch("/admin/coverage")).json(); }
  catch(e){ $("#out").innerHTML = `<div class="muted">Couldn't load coverage.</div>`; return; }
  const live = d.live||{}, plan = d.plan||{};
  const parts = [];

  // ◉ Pulse — what changed in the corpus (public /pulse/recent; absent when the flag is off)
  try{
    const pr = await fetch("/pulse/recent?limit=12");
    if(pr.ok){
      const evs = (await pr.json()).events||[];
      if(evs.length){
        parts.push(`<h2>◉ What changed recently</h2>` + evs.map(e=>{
          const what = e.relation === "retracted" ? "RETRACTED"
                     : e.relation === "superseded_by" ? "SUPERSEDED" : e.relation.toUpperCase();
          const subj = (e.subjects||[]).join("; ") || e.old_document_id || e.new_document_id || "";
          return `<div class="item"><span class="dot d-rem"></span>
            <b>${esc(what)}</b> · ${esc((e.created_at||"").slice(0,10))} — ${esc(subj).slice(0,140)}</div>`;
        }).join(""));
      }
    }
  }catch(e){}

  // totals
  parts.push(`<div class="totals">
    <div class="stat"><div class="n">${fmt(live.total_blocks)}</div><div class="l">Blocks indexed</div></div>
    <div class="stat"><div class="n">${fmt(live.total_docs)}</div><div class="l">Documents</div></div>
    <div class="stat"><div class="n">${(plan.covered||[]).length}</div><div class="l">Conditions covered</div></div>
    <div class="stat"><div class="n">${(plan.remaining||[]).length}</div><div class="l">Conditions remaining</div></div>
  </div>`);

  // sources: declared inventory + live counts
  const bs = live.by_source||{};
  parts.push(`<h2>Sources</h2><div class="tw"><table><thead><tr>
    <th>Source</th><th>Kind</th><th>Tier</th><th>Status</th><th>Blocks</th><th>Docs</th></tr></thead><tbody>` +
    (plan.sources||[]).map(s=>{
      const c = bs[s.key]||{}; const live_ = c.blocks||0;
      const st = s.status||"";
      return `<tr>
        <td>${esc(s.label)}${s.note?`<div class="note">${esc(s.note)}</div>`:""}</td>
        <td class="muted">${esc(s.kind||"")}</td>
        <td class="muted">${esc(s.tier||"")}</td>
        <td><span class="badge b-${esc(st)}">${esc(st)}</span></td>
        <td class="num ${live_?"":"zero"}">${live_?fmt(live_):"—"}</td>
        <td class="num ${c.docs?"":"zero"}">${c.docs?fmt(c.docs):"—"}</td></tr>`;
    }).join("") + `</tbody></table></div>`);

  // by content kind
  const bk = live.by_kind||{};
  if(Object.keys(bk).length){
    parts.push(`<h2>By content type</h2><div class="tw"><table><thead><tr><th>Kind</th><th>Blocks</th></tr></thead><tbody>` +
      Object.entries(bk).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${fmt(v)}</td></tr>`).join("") +
      `</tbody></table></div>`);
  }

  // by source country (evidence geography — drives country-scoped search)
  const CLABEL = {US:"United States", IN:"India", global:"Global / shared", "?":"Untagged"};
  const bc = live.by_country||{};
  if(Object.keys(bc).length){
    parts.push(`<h2>By country</h2><div class="tw"><table><thead><tr><th>Country</th><th>Blocks</th></tr></thead><tbody>` +
      Object.entries(bc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(CLABEL[k]||k)}</td><td class="num">${fmt(v)}</td></tr>`).join("") +
      `</tbody></table></div>`);
  }

  // covered conditions (grouped, with depth)
  parts.push(`<h2>Conditions covered</h2>` + groupGrid(plan.covered||[], true));
  // remaining
  parts.push(`<h2>Remaining to cover</h2>` + groupGrid(plan.remaining||[], false));

  // recent ingest runs (precise per-download record)
  const runs = live.runs||[];
  if(runs.length){
    parts.push(`<h2>Recent downloads</h2><div class="tw"><table><thead><tr>
      <th>Condition</th><th>Per source</th><th>Blocks</th><th>When</th></tr></thead><tbody>` +
      runs.map(r=>`<tr>
        <td>${esc(r.condition||"")}</td>
        <td class="muted">${Object.entries(r.by_source||{}).map(([k,v])=>esc(k)+" "+fmt(v)).join(" · ")||"—"}</td>
        <td class="num">${fmt(r.total_blocks)}</td>
        <td class="muted">${r.created_at?new Date(r.created_at).toLocaleString():""}</td></tr>`).join("") +
      `</tbody></table></div>`);
  } else {
    parts.push(`<h2>Recent downloads</h2><div class="muted">No per-download records yet — they appear here as new ingests run. (Existing corpus predates run tracking.)</div>`);
  }

  $("#out").innerHTML = parts.join("");
}

function groupGrid(items, withDepth){
  const groups = {};
  for(const it of items){ (groups[it.group||"Other"] ||= []).push(it); }
  return `<div class="grid">` + Object.entries(groups).map(([g,list])=>`
    <div class="cgroup"><h3>${esc(g)}</h3>` +
      list.map(it=>`<div class="item">
        <span class="dot ${withDepth?("d-"+(it.depth||"deep")):"d-rem"}"></span>${esc(it.name)}
        ${withDepth&&it.depth?`<span class="depth">${esc(it.depth)}</span>`:""}</div>`).join("") +
    `</div>`).join("") + `</div>`;
}
load();

// ================= Corpus Explorer (admin-gated, read-only) =================
// Password is held in JS only (never persisted) and sent as the x-admin-password
// header on every corpus call. 401 → bad password; 404 → not enabled / no corpus DSN.
const CE = { pw:"", lastResults:[] };
const CE_FACET_KEYS = ["modality","source_country","pub_type","content_type"];

function ceStatus(msg, isErr){
  const el = $("#ce-status");
  if(!el) return;
  el.textContent = msg || "";
  el.className = "ce-status" + (isErr ? " err" : "");
}

async function ceFetch(path, opts){
  opts = opts || {};
  const headers = Object.assign({"x-admin-password": CE.pw}, opts.headers || {});
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  if(r.status === 401){ const e = new Error("bad admin password"); e.code = 401; throw e; }
  if(r.status === 404){ const e = new Error("not enabled"); e.code = 404; throw e; }
  if(!r.ok){
    let detail = "";
    try{ detail = (await r.json()).detail || ""; }catch(_e){}
    const e = new Error(detail || ("request failed (" + r.status + ")")); e.code = r.status; throw e;
  }
  return r.json();
}

function ceHandleErr(e){
  if(e && e.code === 401){ ceStatus("bad admin password — check the password and try again", true); }
  else if(e && e.code === 404){
    ceStatus("Corpus Explorer is not enabled on this server.", true);
    const btn = $("#ce-search"); if(btn) btn.disabled = true;
  } else { ceStatus((e && e.message) || "request failed", true); }
}

function ceMode(){
  const on = document.querySelector("#ce-mode button.on");
  return on ? on.dataset.mode : "keyword";
}

function ceChip(label, val){
  if(val === undefined || val === null || val === "") return "";
  return `<span class="ce-chip"><b>${esc(label)}</b> ${esc(String(val))}</span>`;
}

async function ceLoadFacets(){
  const tenant = ($("#ce-tenant").value || "demo").trim();
  if(!CE.pw){ ceStatus("enter the admin password to load filters", true); return; }
  try{
    const d = await ceFetch("/admin/corpus/facets?tenant=" + encodeURIComponent(tenant));
    const f = d.facets || {};
    for(const key of CE_FACET_KEYS){
      const sel = $("#ce-f-" + key);
      if(!sel) continue;
      const prev = sel.value;
      sel.innerHTML = "";
      const any = document.createElement("option"); any.value = ""; any.textContent = "any"; sel.appendChild(any);
      for(const o of (f[key] || [])){
        const opt = document.createElement("option");
        opt.value = o.value == null ? "" : String(o.value);
        opt.textContent = (o.value == null ? "" : String(o.value)) + " (" + fmt(o.count) + ")";
        sel.appendChild(opt);
      }
      sel.value = prev; // keep prior choice if still present
    }
    ceStatus("Filters loaded for tenant “" + tenant + "”.");
  }catch(e){ ceHandleErr(e); }
}

async function ceSearch(){
  CE.pw = $("#ce-pw").value;
  if(!CE.pw){ ceStatus("enter the admin password first", true); return; }
  const tenant = ($("#ce-tenant").value || "demo").trim();
  const mode = ceMode();
  const query = $("#ce-q").value.trim();
  if(mode === "semantic" && !query){ ceStatus("semantic mode needs a query", true); return; }
  const limit = Math.max(1, Math.min(parseInt($("#ce-limit").value || "20", 10) || 20, 100));
  const filters = {
    source_key: $("#ce-f-source_key").value.trim(),
    journal: $("#ce-f-journal").value.trim(),
  };
  for(const key of CE_FACET_KEYS){ filters[key] = $("#ce-f-" + key).value; }
  for(const k of Object.keys(filters)){ if(!filters[k]) delete filters[k]; }
  ceStatus("searching…");
  $("#ce-results").innerHTML = "";
  try{
    const d = await ceFetch("/admin/corpus/search", {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({mode, query, tenant, limit, filters}),
    });
    ceRenderResults(d, query);
  }catch(e){ ceHandleErr(e); }
}

function ceRenderResults(d, query){
  const results = (d && d.results) || [];
  CE.lastResults = results;
  const n = (d && d.count) || 0;
  ceStatus(fmt(n) + " block" + (n === 1 ? "" : "s") + " · mode: " + (d.mode || ""));
  if(!results.length){
    $("#ce-results").innerHTML = `<div class="muted">No blocks matched. ` +
      (query ? `Try a broader query, or clear some filters.` : `Add a query or a filter to browse the newest blocks.`) + `</div>`;
    return;
  }
  $("#ce-results").innerHTML = results.map((r, i) => {
    const f = r.facets || {};
    const title = r.title || "";
    const tShort = title.length > 90 ? title.slice(0, 90) + "…" : title;
    const chips = [
      ceChip("source", r.source_key),
      title ? `<span class="ce-chip"><b>title</b> ${esc(tShort)}</span>` : "",
      ceChip("type", r.content_type),
      ceChip("journal", f.journal),
      ceChip("modality", f.modality),
      ceChip("country", f.source_country),
      ceChip("pub", f.pub_type),
    ].filter(Boolean).join("");
    return `<div class="ce-block">
      <div class="ce-chips">${chips}<button type="button" class="ce-open" data-idx="${i}">▸ open document</button></div>
      <div class="ce-text">${esc(r.text || "")}</div>
    </div>`;
  }).join("");
  document.querySelectorAll("#ce-results .ce-open").forEach(b => {
    b.addEventListener("click", () => { const r = CE.lastResults[+b.dataset.idx]; if(r) ceOpenDoc(r.document_id); });
  });
}

async function ceOpenDoc(docId){
  if(!docId) return;
  const tenant = ($("#ce-tenant").value || "demo").trim();
  const modal = $("#ce-modal");
  $("#ce-dtitle").innerHTML = `<div class="muted">Loading document…</div>`;
  $("#ce-dbody").innerHTML = "";
  modal.hidden = false;
  try{
    const d = await ceFetch("/admin/corpus/document?document_id=" + encodeURIComponent(docId) + "&tenant=" + encodeURIComponent(tenant));
    const f = d.facets || {};
    const chips = [
      ceChip("source", d.source_key),
      ceChip("type", d.content_type),
      ceChip("journal", f.journal),
      ceChip("modality", f.modality),
      ceChip("country", f.source_country),
      ceChip("pub", f.pub_type),
    ].filter(Boolean).join("");
    const nb = d.n_blocks || 0;
    $("#ce-dtitle").innerHTML =
      `<div style="font-family:var(--serif);font-size:1.15rem;line-height:1.3;">${esc(d.title || "(untitled)")}</div>` +
      `<div class="ce-chips" style="margin-top:.45rem;">${chips}</div>` +
      `<div class="note" style="margin-top:.3rem;">${fmt(nb)} block${nb === 1 ? "" : "s"}${nb >= 2000 ? " (capped at 2000 server-side)" : ""}</div>`;
    $("#ce-dbody").innerHTML = ((d.blocks) || []).map(b =>
      `<div class="ce-dblock"><div class="bid">block ${esc(String(b.block_id))}</div>` +
      `<div class="ce-text">${esc(b.text || "")}</div></div>`).join("");
  }catch(e){
    $("#ce-dtitle").innerHTML = `<div class="ce-status err">${esc((e && e.message) || "failed to load document")}</div>`;
  }
}

function ceCloseModal(){ const m = $("#ce-modal"); if(m) m.hidden = true; }

async function ceInit(){
  let cfg;
  try{ cfg = await (await fetch("/config")).json(); }
  catch(e){ return; }                                  // no /config → leave hidden
  if(!cfg || !cfg.corpus_explorer_enabled) return;     // flag off → leave hidden
  $("#corpus-explorer").hidden = false;

  document.querySelectorAll("#ce-mode button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("#ce-mode button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
  }));
  $("#ce-search").addEventListener("click", ceSearch);
  $("#ce-q").addEventListener("keydown", e => { if(e.key === "Enter") ceSearch(); });
  $("#ce-pw").addEventListener("change", () => { CE.pw = $("#ce-pw").value; if(CE.pw) ceLoadFacets(); });
  $("#ce-tenant").addEventListener("change", () => { if(CE.pw) ceLoadFacets(); });
  $("#ce-dclose").addEventListener("click", ceCloseModal);
  $("#ce-modal").addEventListener("click", e => { if(e.target === $("#ce-modal")) ceCloseModal(); });
  document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#ce-modal").hidden) ceCloseModal(); });
}
ceInit();
</script>
