<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noesis — Research</title>
<style>
  /* ---- tokens: an "evidence ledger" — warm paper, blue-ink, considered verified-green ---- */
  :root{
    --paper:#FCFBF8; --card:#FFFFFF; --ink:#16202E; --slate:#5B6773;
    --verified:#0B7A5B; --gap:#A65A0B; --hair:#E8E4DB; --rail:#0B7A5B;
    --hl-f:11,122,91; --hl-r:166,90,11; --hl-k:42,107,176;   /* fact / reasoning / context */
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#10151C;--card:#161C25;--ink:#EDEAE3;--slate:#8A96A3;
      --verified:#35B98F;--gap:#D08A3C;--hair:#263140;--rail:#35B98F;
      --hl-f:53,185,143;--hl-r:208,138,60;--hl-k:96,158,224;}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    line-height:1.5;font-size:16px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:44rem;margin:0 auto;padding:1.25rem 1.15rem 5rem;}

  /* ---- masthead ---- */
  header{display:flex;align-items:center;gap:.55rem;padding:.4rem 0 1.2rem;flex-wrap:wrap;
    border-bottom:1px solid var(--hair);margin-bottom:1.4rem;}
  .logo{height:30px;width:30px;border-radius:7px;object-fit:contain;flex:none;}
  .mark{font-weight:640;letter-spacing:-.02em;font-size:1.15rem;}
  .mark b{color:var(--verified)}
  .vertical{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--slate);border:1px solid var(--hair);
    border-radius:999px;padding:.12rem .5rem;}
  .tagline{margin-left:auto;font-size:.8rem;color:var(--slate);}

  /* ---- ask ---- */
  h1{font-size:1.55rem;line-height:1.2;letter-spacing:-.02em;font-weight:600;
    margin:.2rem 0 1rem;}
  form{display:flex;flex-direction:column;gap:.7rem;}
  .field{display:flex;gap:.5rem;background:var(--card);border:1px solid var(--hair);
    border-radius:12px;padding:.5rem .5rem .5rem .9rem;box-shadow:0 1px 0 rgba(0,0,0,.02);}
  textarea{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;
    resize:none;outline:none;padding:.35rem 0;min-height:2.6rem;max-height:9rem;}
  button.go{border:0;border-radius:9px;background:var(--ink);color:var(--paper);
    font:inherit;font-weight:560;padding:.55rem 1.05rem;cursor:pointer;align-self:flex-end;}
  button.go:disabled{opacity:.55;cursor:default;}
  button.go:focus-visible,.pill:focus-visible,textarea:focus-visible{outline:2px solid var(--verified);outline-offset:2px;}

  .sources{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;}
  .sources .lbl{font-size:.78rem;color:var(--slate);margin-right:.1rem;}
  .pill{font-family:var(--mono);font-size:.74rem;letter-spacing:.02em;cursor:pointer;
    border:1px solid var(--hair);background:var(--card);color:var(--slate);
    border-radius:999px;padding:.2rem .62rem;user-select:none;}
  .pill[aria-pressed="true"]{color:var(--paper);background:var(--verified);border-color:var(--verified);}

  /* ---- results ---- */
  #out{margin-top:2rem;}
  .status{font-size:.85rem;color:var(--slate);}
  .empty{margin-top:2.2rem;color:var(--slate);font-size:.95rem;
    border:1px dashed var(--hair);border-radius:12px;padding:1.3rem;text-align:center;}
  .empty .k{color:var(--ink);font-weight:560;}

  .summary{font-size:.82rem;color:var(--slate);display:flex;gap:.9rem;flex-wrap:wrap;
    padding-bottom:.5rem;border-bottom:1px solid var(--hair);margin-bottom:1.1rem;}
  .summary .ok{color:var(--verified);font-weight:600;}
  .summary .no{color:var(--gap);font-weight:600;}

  /* synthesized answer (grounded in findings) */
  .answer{font-size:1.08rem;line-height:1.62;letter-spacing:-.01em;
    white-space:pre-wrap;margin:.2rem 0 1.4rem;}
  .answer .ref{color:var(--verified);font-weight:640;cursor:pointer;
    font-size:.72em;padding:0 .05em;}
  /* structured answer — a clinical brief (journal-grade type & rhythm) */
  .answer.md{white-space:normal;font-size:1rem;}
  /* section headers: tracked small-caps eyebrow, accent tick, hairline separation */
  .answer.md .mdh{font-family:var(--sans);font-size:.7rem;font-weight:680;
    text-transform:uppercase;letter-spacing:.13em;color:var(--verified);
    margin:1.9rem 0 .7rem;padding-top:1.4rem;border-top:1px solid var(--hair);
    display:flex;align-items:center;gap:.55rem;}
  .answer.md .mdh::before{content:"";width:15px;height:2px;border-radius:2px;
    background:var(--verified);flex:none;}
  .answer.md .mdh:first-child{margin-top:0;padding-top:0;border-top:none;}
  /* lead: first paragraph after the opening section reads like a journal abstract lead */
  .answer.md .mdh:first-child + .mdp{font-family:var(--serif);font-size:1.3rem;
    line-height:1.5;letter-spacing:-.011em;color:var(--ink);margin:.1rem 0 .5rem;}
  .answer.md .mdp{margin:.55rem 0;line-height:1.7;color:var(--ink);}
  /* refined bullets: accent dot, no default list glyph */
  .answer.md .mdl{margin:.55rem 0 .85rem;padding:0;list-style:none;}
  .answer.md .mdl li{position:relative;padding-left:1.2rem;margin:.42rem 0;line-height:1.62;}
  .answer.md .mdl li::before{content:"";position:absolute;left:.05rem;top:.62em;
    width:6px;height:6px;border-radius:50%;background:var(--verified);}
  .answer.md strong{font-weight:660;color:var(--ink);}
  /* journal-style table: hairline rules, small-caps header, no boxy borders */
  .answer.md .mdt{border-collapse:collapse;width:100%;margin:.75rem 0 1.05rem;font-size:.93rem;}
  .answer.md .mdt th{font-family:var(--sans);font-size:.67rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--slate);font-weight:660;text-align:left;
    padding:.5rem .75rem;border-bottom:1.5px solid var(--ink);}
  .answer.md .mdt td{padding:.6rem .75rem;border-bottom:1px solid var(--hair);
    vertical-align:top;line-height:1.55;}
  .answer.md .mdt tbody tr:last-child td{border-bottom:none;}
  .answer.md .ref{color:var(--verified);font-weight:640;cursor:pointer;font-size:.68em;
    padding:0 .06em;vertical-align:super;}
  /* typed highlights: background highlight (highlighter-style, clinical tint) */
  .answer.md mark.hl{color:inherit;border-radius:3px;padding:.04em .18em;
    box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  .answer.md .hl-f{background:rgba(var(--hl-f),.22);}
  .answer.md .hl-r{background:rgba(var(--hl-r),.22);}
  .answer.md .hl-k{background:rgba(var(--hl-k),.22);}
  /* legend */
  .hllegend{display:flex;flex-wrap:wrap;gap:.9rem;margin:-.4rem 0 1.3rem;
    font-size:.72rem;color:var(--slate);}
  .hllegend span{display:inline-flex;align-items:center;gap:.35rem;}
  .hllegend i{width:.72rem;height:.72rem;border-radius:3px;display:inline-block;}
  .hllegend .lf{background:rgba(var(--hl-f),.9);} .hllegend .lr{background:rgba(var(--hl-r),.9);}
  .hllegend .lk{background:rgba(var(--hl-k),.9);}
  .evhead{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
    color:var(--slate);margin:.2rem 0 .8rem;border-top:1px solid var(--hair);padding-top:1rem;}
  .fnum{display:inline-flex;align-items:center;justify-content:center;min-width:1.3rem;
    height:1.3rem;border-radius:6px;background:var(--verified);color:var(--paper);
    font-family:var(--mono);font-size:.72rem;font-weight:640;margin-right:.5rem;}
  .claim.flash{outline:2px solid var(--verified);outline-offset:2px;}

  /* answer-video add-on (separate; only when video_enabled) */
  .vid{margin:.2rem 0 1.4rem;padding:.9rem 1rem;border:1px dashed var(--hair);
    border-radius:12px;background:var(--card);}
  .vid .vbtn{font-family:var(--mono);font-size:.8rem;font-weight:600;cursor:pointer;
    border:1px solid var(--verified);color:var(--verified);background:transparent;
    border-radius:8px;padding:.5rem .85rem;}
  .vid .vbtn:hover{background:var(--verified);color:var(--paper);}
  .vid .vbtn:disabled{opacity:.55;cursor:default;}
  .vid .vhint{font-size:.74rem;color:var(--slate);margin-top:.5rem;}
  .vid video{width:100%;max-width:640px;border-radius:10px;margin-top:.7rem;display:block;}

  /* signature: the claim → evidence rail */
  .claim{background:var(--card);border:1px solid var(--hair);border-radius:12px;scroll-margin-top:1rem;
    padding:1rem 1.05rem;margin-bottom:.85rem;
    animation:rise .38s cubic-bezier(.2,.7,.2,1) both;}
  .claim .txt{font-weight:520;letter-spacing:-.01em;}
  .rail{margin-top:.7rem;border-left:2.5px solid var(--rail);padding:.15rem 0 .15rem .8rem;}
  .rail q{font-family:var(--serif);font-size:1.02rem;color:var(--ink);quotes:"\201C" "\201D";}
  .meta{display:flex;align-items:center;gap:.55rem;margin-top:.45rem;flex-wrap:wrap;}
  .verified{display:inline-flex;align-items:center;gap:.3rem;color:var(--verified);
    font-size:.72rem;font-weight:640;text-transform:uppercase;letter-spacing:.06em;}
  .src{font-family:var(--mono);font-size:.72rem;color:var(--slate);}
  a.srclink{text-decoration:none;color:var(--verified);border-bottom:1px dotted var(--verified);}
  a.srclink:hover{opacity:.8;}
  a.srclink:focus-visible{outline:2px solid var(--verified);outline-offset:2px;}

  .gaps{margin-top:.4rem 0 1.1rem;border:1px solid var(--hair);border-left:3px solid var(--gap);
    border-radius:10px;padding:.7rem .9rem;background:var(--card);}
  .gaps h4{margin:0 0 .3rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gap);}
  .gaps li{font-size:.9rem;color:var(--ink);margin-left:1rem;}

  /* history */
  .histbtn{margin-left:auto;font-family:var(--mono);font-size:.72rem;cursor:pointer;
    background:transparent;border:1px solid var(--hair);border-radius:7px;
    padding:.32rem .6rem;color:var(--slate);}
  .histbtn:hover{color:var(--ink);border-color:var(--slate);}
  .history{border:1px solid var(--hair);border-radius:12px;background:var(--card);
    padding:.4rem;margin-bottom:1.2rem;max-height:min(46vh,420px);overflow-y:auto;}
  .history .hrow{display:flex;gap:.6rem;align-items:baseline;padding:.5rem .6rem;
    border-radius:8px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;}
  .history .hrow:hover{background:var(--paper);}
  .history .hq{flex:1;color:var(--ink);font-size:.9rem;line-height:1.35;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history .hmeta{font-family:var(--mono);font-size:.68rem;color:var(--slate);white-space:nowrap;}
  .history .hg{color:var(--verified);}
  .history .hempty{padding:.7rem;color:var(--slate);font-size:.85rem;}

  /* answer tables scroll horizontally on narrow screens (never break the page) */
  .answer.md .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.75rem 0 1.05rem;}
  .answer.md .tw .mdt{margin:0;}

  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.claim{animation:none}}

  /* mobile: keep it minimal + legible on a phone */
  @media (max-width:560px){
    .wrap{padding:1rem .9rem 4rem;}
    .tagline{display:none;}                 /* free up the masthead row */
    h1{font-size:1.28rem;}
    .answer.md .mdh:first-child + .mdp{font-size:1.12rem;}
    .field{flex-wrap:wrap;}
    textarea{min-width:0;}
    button.go{align-self:stretch;width:100%;}
    .hllegend{gap:.6rem;}
    .answer.md video,.vid video{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="/noesis-logo.png" alt="" />
    <span class="mark">No<b>e</b>sis</span>
    <span class="vertical" id="vertical">…</span>
    <span class="tagline">Every claim, pinned to its source.</span>
    <button type="button" class="histbtn" id="histbtn" aria-expanded="false">Recent ▾</button>
  </header>

  <section class="history" id="history" hidden></section>

  <h1 id="heading">What does the evidence show?</h1>
  <form id="ask">
    <div class="field">
      <textarea id="q" rows="1" placeholder="e.g. What treatments are being studied for type 2 diabetes?"
                aria-label="Research question"></textarea>
      <button class="go" id="go" type="submit">Research</button>
    </div>
    <div class="sources" id="sources"><span class="lbl">Sources</span></div>
  </form>

  <section id="out" aria-live="polite">
    <div class="empty">Ask a question. Noesis answers only with claims it can
      <span class="k">verify against a source</span> — and tells you when a source falls short.</div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const out = $("#out"), go = $("#go"), q = $("#q");
let SOURCES = [];
let VIDEO_ENABLED = false;
let STRUCTURED = false;     // render the answer as markdown sections (server-authoritative)
let LAST = null;            // {question, answer} for the answer-video add-on
let CURRENT_Q = "";        // the question of the answer currently rendered

const label = k => k === "web" ? "Web" : k === "workspace" ? "Workspace" : "Corpus";

async function loadConfig(){
  try{
    const c = await (await fetch("/config")).json();
    $("#vertical").textContent = c.vertical || "vertical";
    SOURCES = c.sources || [];
    VIDEO_ENABLED = !!c.video_enabled;
    STRUCTURED = !!c.structured_answers;
    // vertical-supplied console copy (heading + placeholder) — keeps the shell domain-neutral
    const con = c.console || {};
    if(con.heading) $("#heading").textContent = con.heading;
    if(con.placeholder) q.setAttribute("placeholder", con.placeholder);
    const box = $("#sources");
    for(const k of SOURCES){
      const b = document.createElement("button");
      b.type="button"; b.className="pill"; b.dataset.key=k;
      b.setAttribute("aria-pressed","true"); b.textContent = label(k);
      b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")==="true"?"false":"true");
      box.appendChild(b);
    }
  }catch(e){ $("#vertical").textContent = "offline"; }
}

const chosen = () => [...document.querySelectorAll('.pill[aria-pressed="true"]')].map(b=>b.dataset.key);

function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML;}

// Inline: bold, clickable [n] refs, and typed highlight marks. Operates on
// ALREADY-ESCAPED text (XSS-safe) — the [[F]]/[[R]]/[[K]] markers survive esc()
// (literal brackets) and never collide with [n] refs (F/R/K aren't digits).
function mdInline(s){
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
       .replace(/\[(\d+)\]/g,'<sup class="ref" data-n="$1">[$1]</sup>');
  s = s.replace(/\[\[F\]\]([\s\S]*?)\[\[\/F\]\]/g,'<mark class="hl hl-f">$1</mark>')
       .replace(/\[\[R\]\]([\s\S]*?)\[\[\/R\]\]/g,'<mark class="hl hl-r">$1</mark>')
       .replace(/\[\[K\]\]([\s\S]*?)\[\[\/K\]\]/g,'<mark class="hl hl-k">$1</mark>');
  return s;
}
// Minimal, self-contained, XSS-safe markdown → HTML. We esc() the whole source FIRST,
// so any HTML in the model output is neutralized before we add known-safe tags. Handles
// headings (##/###), bullet lists, simple tables, bold, and [n] refs. No external lib.
function mdToHtml(raw){
  const lines = esc(raw).split(/\r?\n/);
  const cells = r => r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
  const out = []; let i = 0;
  while(i < lines.length){
    const line = lines[i];
    if(/^\s*$/.test(line)){ i++; continue; }
    // table: header row + |---| separator + body rows
    if(/^\s*\|.*\|\s*$/.test(line) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const head = cells(line); i += 2; const rows = [];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      out.push('<div class="tw"><table class="mdt"><thead><tr>'+head.map(c=>`<th>${mdInline(c)}</th>`).join("")+
        '</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${mdInline(c)}</td>`).join("")+'</tr>').join("")+
        '</tbody></table></div>');
      continue;
    }
    const hm = line.match(/^(#{1,4})\s+(.*)$/);
    if(hm){ const lvl = Math.min(6, hm[1].length+2); out.push(`<h${lvl} class="mdh">${mdInline(hm[2])}</h${lvl}>`); i++; continue; }
    if(/^\s*[-*]\s+/.test(line)){
      const items = [];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ items.push(mdInline(lines[i].replace(/^\s*[-*]\s+/,""))); i++; }
      out.push('<ul class="mdl">'+items.map(x=>`<li>${x}</li>`).join("")+'</ul>');
      continue;
    }
    const para = [line]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s|^\s*[-*]\s|^\s*\|/.test(lines[i])){ para.push(lines[i]); i++; }
    out.push(`<p class="mdp">${mdInline(para.join(" "))}</p>`);
  }
  return out.join("");
}

function render(data){
  const parts = [];
  const n = data.claims.length;
  parts.push(`<div class="summary">
    <span>${n ? `<span class="ok">${n} verified claim${n>1?"s":""}</span>` : `<span class="no">no verified claims</span>`}</span>
    ${data.rejected ? `<span>${data.rejected} rejected (ungrounded)</span>`:""}
    ${data.grounded ? "" : `<span class="no">answer not fully grounded</span>`}
  </div>`);
  if(data.coverage_gaps && data.coverage_gaps.length){
    parts.push(`<div class="gaps"><h4>Coverage gaps</h4><ul>` +
      data.coverage_gaps.map(g=>`<li>${esc(g)}</li>`).join("") + `</ul></div>`);
  }
  const ss = data.source_stats || {};
  const skeys = Object.keys(ss);
  if(skeys.length){
    const chips = skeys.map(k=>{
      const s = ss[k]; const helped = s.cited>0;
      return `<span class="pill" style="cursor:default;${helped?'color:var(--paper);background:var(--verified);border-color:var(--verified)':''}">${esc(k)} · ${s.cited}/${s.retrieved} cited</span>`;
    }).join(" ");
    parts.push(`<div class="summary" style="border:none;padding-top:.2rem"><span>Sources used:</span>${chips}</div>`);
  }
  // synthesized answer (grounded in the findings) — the hero; [n] refs → findings.
  // Server-authoritative: render markdown sections when structured_answers is on,
  // else the flat-prose path (byte-identical to pre-flag).
  if(data.answer){
    const html = STRUCTURED
      ? mdToHtml(data.answer)
      : esc(data.answer).replace(/\[(\d+)\]/g, '<sup class="ref" data-n="$1">[$1]</sup>');
    parts.push(`<div class="answer${STRUCTURED?" md":""}">${html}</div>`);
    if(STRUCTURED && /<mark class="hl/.test(html)){
      parts.push(`<div class="hllegend">
        <span><i class="lf"></i>Load-bearing fact</span>
        <span><i class="lr"></i>Critical reasoning</span>
        <span><i class="lk"></i>Key context</span></div>`);
    }
    // answer-video add-on. A saved session may already have a video → show it inline;
    // otherwise offer to generate one (only when enabled AND the answer is grounded).
    LAST = {question:(data.question||CURRENT_Q), answer:data.answer,
            session_id:(data.session_id||data.id||null)};
    if(data.video_filename){
      parts.push(`<div class="vid">
        <div class="vhint">🎬 ${esc(data.video_title||"Guidance video")}${data.video_duration?" · "+Math.round(data.video_duration)+"s":""}</div>
        <video controls preload="metadata" src="/video/file/${encodeURIComponent(data.video_filename)}"></video>
      </div>`);
    } else if(VIDEO_ENABLED && data.grounded){
      parts.push(`<div class="vid" id="vid">
        <button type="button" class="vbtn" id="vgo">▶ Generate guidance video</button>
        <div class="vhint">A ~60-second narrated explainer of this answer, spoken as an experienced physician. Takes ~2 minutes.</div>
      </div>`);
    }
    parts.push(`<h4 class="evhead">Evidence — ${n} verified finding${n===1?"":"s"}</h4>`);
  }
  data.claims.forEach((c,idx)=>{
    const label = esc(c.source) + (c.title ? " · " + esc(c.title) : "");
    const src = c.url
      ? `<a class="src srclink" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer" title="Open source in a new tab">${label} ↗</a>`
      : (c.source ? `<span class="src">${label}</span>` : "");
    parts.push(`<article class="claim" id="f${idx+1}">
      <div class="txt"><span class="fnum">${idx+1}</span>${esc(c.text)}</div>
      <div class="rail"><q>${esc(c.quote)}</q>
        <div class="meta"><span class="verified">✓ Verified in source</span>${src}</div>
      </div>
    </article>`);
  });
  if(!n && !(data.coverage_gaps||[]).length){
    const atoms = data.atoms_gathered || 0;
    if(atoms > 0){
      const summ = Object.entries(ss).map(([k,v])=>`${v.retrieved} from ${esc(k)}`).join(", ");
      parts.push(`<div class="empty"><span class="k">No span-verified answer.</span> Retrieved
        ${atoms} relevant passage${atoms>1?"s":""}${summ?" ("+summ+")":""}, but the agent couldn't
        ground a direct answer — often because the question asks for a ranking or recommendation
        the sources don't establish. Try asking about a specific drug, trial, condition, or side effect.</div>`);
    } else {
      parts.push(`<div class="empty">No grounded answer for that question with the chosen sources.</div>`);
    }
  }
  out.innerHTML = parts.join("");
  // clicking a [n] reference scrolls to and highlights its finding
  out.querySelectorAll(".ref").forEach(r=>r.addEventListener("click",()=>{
    const el = document.getElementById("f"+r.dataset.n);
    if(el){ el.scrollIntoView({behavior:"smooth",block:"center"});
      el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1200); }
  }));
  const vgo = document.getElementById("vgo");
  if(vgo) vgo.addEventListener("click", generateVideo);
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function generateVideo(){
  if(!LAST) return;
  const panel = document.getElementById("vid");
  const btn = document.getElementById("vgo");
  const hint = panel.querySelector(".vhint");
  btn.disabled = true; btn.textContent = "Generating…";
  hint.textContent = "Storyboarding, narrating, and assembling the video… (~2 min)";
  try{
    const r = await fetch("/video/generate",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify(LAST)});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || `HTTP ${r.status}`);
    const {job_id} = await r.json();
    for(let i=0;i<120;i++){                 // poll up to ~4 min
      await sleep(2000);
      const s = await (await fetch("/video/status/"+job_id)).json();
      if(s.status==="done"){
        hint.textContent = (s.title||"Guidance video")+" · "+Math.round(s.duration_sec)+"s";
        const v = document.createElement("video");
        v.controls = true; v.src = "/video/file/"+encodeURIComponent(s.filename);
        panel.appendChild(v); btn.remove(); return;
      }
      if(s.status==="error") throw new Error(s.error||"generation failed");
    }
    throw new Error("timed out waiting for the video");
  }catch(e){
    btn.disabled = false; btn.textContent = "▶ Generate guidance video";
    hint.textContent = "Couldn't generate the video: "+(e.message||e);
  }
}

function renderEvidence(data, note){
  const rows = (data.evidence||[]).map(e=>`<article class="claim">
    <div class="rail"><q>${esc(e.text)}</q>
      <div class="meta"><span class="src">${esc(e.source)}${e.title?" · "+esc(e.title):""}</span></div>
    </div></article>`).join("");
  out.innerHTML = `<div class="gaps"><h4>Retrieved evidence</h4><ul><li>${esc(note)}</li></ul></div>` +
    (rows || `<div class="empty">No matching evidence for that query.</div>`);
}

$("#ask").addEventListener("submit", async e=>{
  e.preventDefault();
  const question = q.value.trim();
  if(!question) return;
  CURRENT_Q = question;
  const body = JSON.stringify({question, tenant_id:"demo", sources: chosen()});
  go.disabled = true; go.textContent = "Researching…";
  out.innerHTML = `<div class="status">Searching sources and verifying evidence…</div>`;
  try{
    const resp = await fetch("/research",{method:"POST",headers:{"content-type":"application/json"},body});
    if(resp.ok){ render(await resp.json()); if(!$("#history").hidden) loadHistory(); return; }
    // model unavailable (no credits / replay) → fall back to evidence retrieval
    const detail = (await resp.json().catch(()=>({}))).detail || `HTTP ${resp.status}`;
    if(resp.status===503 || resp.status===502){
      out.innerHTML = `<div class="status">Answer model unavailable — retrieving evidence…</div>`;
      const s = await fetch("/search",{method:"POST",headers:{"content-type":"application/json"},body});
      if(s.ok){ renderEvidence(await s.json(),
        "Answer synthesis is unavailable ("+detail.replace(/\.$/,'')+"). Showing ranked evidence from your sources."); return; }
    }
    out.innerHTML = `<div class="empty">${esc(detail)}</div>`;
  }catch(err){
    out.innerHTML = `<div class="empty">Couldn't reach the research service. Is the server running?</div>`;
  }finally{
    go.disabled = false; go.textContent = "Research";
  }
});

q.addEventListener("input", ()=>{ q.style.height="auto"; q.style.height=Math.min(q.scrollHeight,144)+"px"; });

// ---- history (saved Q&A) ----
async function loadHistory(){
  const panel = $("#history");
  try{
    const {sessions} = await (await fetch("/sessions?tenant_id=demo&limit=50")).json();
    if(!sessions || !sessions.length){ panel.innerHTML = `<div class="hempty">No saved questions yet.</div>`; return; }
    panel.innerHTML = sessions.map(s=>`
      <button class="hrow" data-id="${esc(s.id)}">
        <span class="hq">${esc(s.question)}</span>
        <span class="hmeta">${s.has_video?"🎬 ":""}${s.grounded?'<span class="hg">✓</span> ':""}${new Date(s.created_at).toLocaleDateString()}</span>
      </button>`).join("");
    panel.querySelectorAll(".hrow").forEach(b=>b.addEventListener("click",()=>loadSession(b.dataset.id)));
  }catch(e){ panel.innerHTML = `<div class="hempty">Couldn't load history.</div>`; }
}
async function loadSession(id){
  out.innerHTML = `<div class="status">Loading…</div>`;
  try{
    const row = await (await fetch("/sessions/"+encodeURIComponent(id))).json();
    CURRENT_Q = row.question; q.value = row.question;
    render(row);                      // saved row matches render()'s expected shape
    $("#history").hidden = true; $("#histbtn").setAttribute("aria-expanded","false");
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){ out.innerHTML = `<div class="empty">Couldn't load that session.</div>`; }
}
$("#histbtn").addEventListener("click",()=>{
  const p = $("#history");
  if(p.hidden){ p.hidden = false; $("#histbtn").setAttribute("aria-expanded","true"); loadHistory(); }
  else { p.hidden = true; $("#histbtn").setAttribute("aria-expanded","false"); }
});

loadConfig();
