<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noesis — Research</title>
<style>
  /* ---- Noesis identity: deep navy canvas, gold brand accent, green = verified ---- */
  :root{
    --bg:#060E1B; --panel:#0F1A2C; --panel2:#0C1524; --ink:#ECEBE3; --muted:#8B96A9;
    --gold:#D3B37C; --gold-strong:#E7CB93; --verified:#57B891; --gap:#D6975A;
    --hair:#22304A; --hair-soft:rgba(255,255,255,.06);
    --hl-f:87,184,145; --hl-r:211,179,124; --hl-k:110,160,224;   /* fact / reasoning / context */
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;font-size:15px}   /* slightly smaller, more professional scale */
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.55;font-size:1rem;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 60% at 85% -10%, rgba(211,179,124,.06), transparent 60%);
    background-attachment:fixed;}
  .wrap{max-width:44rem;margin:0 auto;padding:1.5rem 1.15rem 5rem;}

  /* ---- masthead ---- */
  header{display:flex;align-items:center;gap:.8rem;padding:.1rem 0 1.3rem;flex-wrap:wrap;
    border-bottom:1px solid var(--hair);margin-bottom:1.9rem;}
  .logo{height:64px;width:auto;object-fit:contain;flex:none;}
  .vertical{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;
    letter-spacing:.14em;color:var(--gold);border:1px solid var(--hair);
    border-radius:999px;padding:.16rem .6rem;background:rgba(211,179,124,.06);}
  .histbtn{margin-left:auto;font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;
    cursor:pointer;background:transparent;border:1px solid var(--hair);border-radius:8px;
    padding:.34rem .7rem;color:var(--muted);text-transform:uppercase;}
  .histbtn:hover{color:var(--ink);border-color:var(--muted);}
  .newbtn{color:var(--gold);border-color:rgba(211,179,124,.5);}
  .newbtn:hover{color:#1A1206;background:var(--gold);border-color:var(--gold);}

  /* ---- hero + intake ---- */
  h1{font-family:var(--serif);font-size:2rem;line-height:1.14;letter-spacing:-.015em;
    font-weight:600;color:var(--ink);margin:.2rem 0 1.15rem;}
  form{display:flex;flex-direction:column;gap:.9rem;}
  .field{display:flex;align-items:flex-end;gap:.7rem;background:var(--panel);
    border:1px solid var(--hair);border-radius:16px;padding:.95rem 1rem 1rem 1.2rem;
    box-shadow:0 8px 30px -18px rgba(0,0,0,.6);transition:border-color .15s, box-shadow .15s;}
  .field:focus-within{border-color:rgba(211,179,124,.55);
    box-shadow:0 8px 30px -16px rgba(0,0,0,.7), 0 0 0 3px rgba(211,179,124,.14);}
  textarea{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.06rem;
    line-height:1.5;resize:none;outline:none;padding:.15rem 0;min-height:2.6rem;max-height:20rem;overflow-y:auto;}
  textarea::placeholder{color:var(--muted);}
  button.go{flex:none;width:44px;height:44px;border:0;border-radius:50%;cursor:pointer;
    background:var(--gold);color:#1A1206;display:grid;place-items:center;
    transition:transform .12s, background .15s;}
  button.go:hover{background:var(--gold-strong);transform:translateY(-1px);}
  button.go:disabled{opacity:.6;cursor:default;transform:none;}
  button.go svg{width:20px;height:20px;display:block;}
  button.go.loading svg{display:none;}
  button.go.loading::after{content:"";width:17px;height:17px;border-radius:50%;
    border:2px solid rgba(26,18,6,.35);border-top-color:#1A1206;animation:spin .7s linear infinite;}
  button.go:focus-visible,.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .sources{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;padding-left:.15rem;}
  .sources .lbl{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;
    letter-spacing:.1em;color:var(--muted);margin-right:.15rem;}
  .pill{font-family:var(--mono);font-size:.72rem;letter-spacing:.02em;cursor:pointer;
    border:1px solid var(--hair);background:transparent;color:var(--muted);
    border-radius:999px;padding:.22rem .7rem;user-select:none;transition:.12s;}
  .pill[aria-pressed="true"]{color:#1A1206;background:var(--gold);border-color:var(--gold);}

  /* image/PDF/DICOM attachments (vision) */
  button.attach{flex:none;width:44px;height:44px;border-radius:50%;cursor:pointer;background:transparent;
    border:1px solid var(--hair);color:var(--muted);display:grid;place-items:center;transition:.12s;}
  button.attach:hover{border-color:var(--gold);color:var(--gold);}
  button.attach svg{width:20px;height:20px;}
  .attns{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding-left:.15rem;}
  .attns .chip{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--mono);font-size:.72rem;
    color:var(--ink);background:var(--panel);border:1px solid var(--hair);border-radius:9px;padding:.3rem .55rem;}
  .attns .chip .x{cursor:pointer;color:var(--muted);border:none;background:none;font-size:1rem;line-height:1;padding:0;}
  .attns .chip .x:hover{color:var(--gap);}
  .attns .consent{display:flex;align-items:flex-start;gap:.5rem;font-size:.74rem;color:var(--muted);
    width:100%;line-height:1.4;margin-top:.1rem;}
  .attns .consent input{accent-color:var(--gold);margin-top:.15rem;flex:none;}

  /* identity gate (name + email at landing) */
  .idmodal[hidden]{display:none;}
  .idmodal{position:fixed;inset:0;z-index:70;background:rgba(4,10,20,.82);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:1.2rem;}
  .idcard{background:var(--panel);border:1px solid var(--hair);border-radius:16px;padding:1.7rem 1.5rem;
    max-width:25rem;width:100%;box-shadow:0 24px 70px -34px #000;}
  .idcard img{height:54px;display:block;margin:0 auto .9rem;}
  .idcard h2{font-family:var(--serif);font-size:1.35rem;text-align:center;margin:0 0 .3rem;}
  .idcard p{color:var(--muted);font-size:.84rem;text-align:center;margin:0 0 1.2rem;line-height:1.5;}
  .idcard input{width:100%;background:var(--panel2);border:1px solid var(--hair);border-radius:10px;
    color:var(--ink);font:inherit;font-size:.94rem;padding:.62rem .8rem;margin-bottom:.6rem;outline:none;}
  .idcard input:focus{border-color:rgba(211,179,124,.55);box-shadow:0 0 0 2px rgba(211,179,124,.12);}
  .idcard .idgo{width:100%;background:var(--gold);color:#1A1206;border:none;border-radius:11px;font:inherit;
    font-weight:600;padding:.7rem;cursor:pointer;margin-top:.35rem;}
  .idcard .idgo:hover{background:var(--gold-strong);}
  .idcard .iderr{color:var(--gap);font-size:.75rem;min-height:1rem;margin-top:.35rem;text-align:center;}

  /* camera capture modal */
  .cammodal[hidden]{display:none;}
  .cammodal{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;}
  .cammodal video{flex:1;width:100%;object-fit:contain;background:#000;min-height:0;}
  .cammodal .camctrls{display:flex;align-items:center;justify-content:space-between;
    padding:1.1rem 1.4rem calc(1.1rem + env(safe-area-inset-bottom));gap:1rem;background:#000;}
  .cammodal .cambtn{font-family:var(--mono);font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;
    background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:.5rem .9rem;cursor:pointer;}
  .cammodal .camshot{width:66px;height:66px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.4);cursor:pointer;flex:none;}
  .cammodal .camshot:active{transform:scale(.94);}

  /* labeled visual observation (context, not a diagnosis) */
  .vobs{border:1px solid var(--hair);border-left:3px solid var(--gold);border-radius:12px;
    background:var(--panel2);padding:.85rem 1.05rem;margin:.1rem 0 1.4rem;}
  .vobs .vobs-h{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;
    color:var(--gold);margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem;}
  .vobs .vobs-b{font-size:.94rem;color:var(--ink);line-height:1.6;}
  .vobs .vobs-note{font-size:.72rem;color:var(--muted);margin-top:.45rem;}

  /* uploaded attachments strip (session shows what was uploaded) */
  .attstrip{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.1rem 0 1.3rem;}
  .attstrip .attlbl{font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);}
  .athumb{height:54px;width:54px;object-fit:cover;border-radius:8px;border:1px solid var(--hair);
    cursor:pointer;overflow:hidden;font-size:0;background:var(--panel);}
  .adoc{display:inline-flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.72rem;color:var(--ink);
    background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:.32rem .55rem;overflow-wrap:anywhere;}
  /* session delete */
  .sessions .qhrow{display:flex;align-items:flex-start;gap:1rem;}
  .sessions .sdel{margin-left:auto;flex:none;font-family:var(--mono);font-size:.64rem;text-transform:uppercase;
    letter-spacing:.04em;cursor:pointer;background:transparent;border:1px solid var(--hair);border-radius:8px;
    padding:.35rem .6rem;color:var(--muted);}
  .sessions .sdel:hover{color:var(--gap);border-color:rgba(214,151,90,.6);}

  /* ---- results ---- */
  #out{margin-top:2.4rem;}
  .status{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:.6rem;}
  .status::before{content:"";width:14px;height:14px;border-radius:50%;
    border:2px solid var(--hair);border-top-color:var(--gold);animation:spin .7s linear infinite;flex:none;}
  .empty{margin-top:1rem;color:var(--muted);font-size:.95rem;
    border:1px solid var(--hair);border-radius:14px;padding:1.3rem;background:var(--panel2);}
  .empty .k{color:var(--ink);font-weight:560;}

  /* mission — the resting state */
  .motto{display:flex;align-items:flex-start;justify-content:center;gap:1.4rem;flex-wrap:wrap;
    margin-top:3.5rem;font-family:var(--mono);font-size:.82rem;letter-spacing:.32em;
    text-transform:uppercase;color:var(--gold);opacity:.9;}
  .mstep{display:flex;flex-direction:column;align-items:center;gap:.7rem;}
  .motto b{font-weight:600;color:var(--ink);letter-spacing:.32em;}
  .micon{width:30px;height:30px;color:var(--gold);opacity:.85;}
  .motto i{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.7;flex:none;margin-top:.35rem;}

  .summary{font-size:.82rem;color:var(--muted);display:flex;gap:.9rem;flex-wrap:wrap;
    padding-bottom:.6rem;border-bottom:1px solid var(--hair);margin-bottom:1.2rem;}
  .summary .ok{color:var(--verified);font-weight:600;}
  .summary .no{color:var(--gap);font-weight:600;}

  /* synthesized answer */
  .answer{font-size:.96rem;line-height:1.62;letter-spacing:-.005em;white-space:pre-wrap;margin:.2rem 0 1.4rem;}
  .answer .ref{color:var(--gold);font-weight:640;cursor:pointer;font-size:.72em;padding:0 .05em;}
  /* structured answer — a clinical brief */
  .answer.md{white-space:normal;font-size:.92rem;}
  .answer.md .mdh{font-family:var(--sans);font-size:.7rem;font-weight:680;text-transform:uppercase;
    letter-spacing:.14em;color:var(--gold);margin:1.9rem 0 .7rem;padding-top:1.4rem;
    border-top:1px solid var(--hair);display:flex;align-items:center;gap:.55rem;}
  .answer.md .mdh::before{content:"";width:15px;height:2px;border-radius:2px;background:var(--gold);flex:none;}
  .answer.md .mdh:first-child{margin-top:0;padding-top:0;border-top:none;}
  .answer.md .mdh:first-child + .mdp{font-family:var(--serif);font-size:1.14rem;line-height:1.5;
    letter-spacing:-.011em;color:var(--ink);margin:.1rem 0 .5rem;}
  .answer.md .mdp{margin:.55rem 0;line-height:1.72;color:var(--ink);}
  .answer.md .mdl{margin:.55rem 0 .85rem;padding:0;list-style:none;}
  .answer.md .mdl li{position:relative;padding-left:1.2rem;margin:.42rem 0;line-height:1.64;}
  .answer.md .mdl li::before{content:"";position:absolute;left:.05rem;top:.62em;width:6px;height:6px;
    border-radius:50%;background:var(--gold);}
  .answer.md strong{font-weight:660;color:var(--ink);}
  .answer.md .mdt{border-collapse:collapse;width:100%;margin:.75rem 0 1.05rem;font-size:.93rem;}
  .answer.md .mdt th{font-family:var(--sans);font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);font-weight:660;text-align:left;padding:.5rem .75rem;border-bottom:1.5px solid var(--gold);}
  .answer.md .mdt td{padding:.6rem .75rem;border-bottom:1px solid var(--hair);vertical-align:top;line-height:1.55;}
  .answer.md .mdt tbody tr:last-child td{border-bottom:none;}
  .answer.md .ref{color:var(--gold);font-weight:640;cursor:pointer;font-size:.68em;padding:0 .06em;vertical-align:super;}
  .answer.md mark.hl{color:inherit;border-radius:3px;padding:.04em .18em;
    box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  .answer.md .hl-f{background:rgba(var(--hl-f),.24);}
  .answer.md .hl-r{background:rgba(var(--hl-r),.26);}
  .answer.md .hl-k{background:rgba(var(--hl-k),.26);}
  .hllegend{display:flex;flex-wrap:wrap;gap:.9rem;margin:-.4rem 0 1.3rem;font-size:.72rem;color:var(--muted);}
  .hllegend span{display:inline-flex;align-items:center;gap:.35rem;}
  .hllegend i{width:.72rem;height:.72rem;border-radius:3px;display:inline-block;}
  .hllegend .lf{background:rgba(var(--hl-f),.95);} .hllegend .lr{background:rgba(var(--hl-r),.95);}
  .hllegend .lk{background:rgba(var(--hl-k),.95);}
  /* evidence dossier — collapsed by default; summary is the disclosure control */
  .evblock{margin:1.8rem 0 0;border-top:1px solid var(--hair);}
  .evblock>summary{list-style:none;cursor:pointer;}
  .evblock>summary::-webkit-details-marker{display:none;}
  .evhead{font-family:var(--sans);font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);
    font-weight:680;margin:0;padding:1.3rem 0 .2rem;display:flex;align-items:center;gap:.55rem;}
  .evhead::before{content:"";width:15px;height:2px;border-radius:2px;background:var(--gold);}
  .evhead::after{content:"▸";margin-left:auto;font-size:.7rem;color:var(--muted);transition:transform .18s;}
  .evblock[open]>summary .evhead::after{transform:rotate(90deg);}
  .evblock>summary:hover .evhead{color:#E7CE9A;}
  .evbody{padding-top:1rem;}
  .fnum{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:1.4rem;height:1.4rem;
    border-radius:8px;background:var(--gold);color:#1A1206;font-family:var(--mono);font-size:.72rem;
    font-weight:700;margin-top:.05rem;}
  .claim.flash{outline:2px solid var(--gold);outline-offset:2px;}

  /* answer-video add-on */
  .vid{margin:.2rem 0 1.4rem;padding:.95rem 1.05rem;border:1px solid var(--hair);border-radius:14px;background:var(--panel2);}
  .vid .vbtn{font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.03em;cursor:pointer;
    border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:9px;padding:.55rem .9rem;}
  .vid .vbtn:hover{background:var(--gold);color:#1A1206;}
  .vid .vbtn:disabled{opacity:.55;cursor:default;}
  .vid .vhint{font-size:.76rem;color:var(--muted);margin-top:.55rem;}
  .vid video{width:100%;max-width:640px;border-radius:12px;margin-top:.75rem;display:block;}

  /* plain-language (layman) explanation */
  .plain{margin:.2rem 0 1.4rem;padding:.95rem 1.1rem;border:1px solid var(--hair);border-left:3px solid var(--verified);
    border-radius:14px;background:var(--panel2);}
  .plain .vbtn{font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.03em;cursor:pointer;
    border:1px solid var(--verified);color:var(--verified);background:transparent;border-radius:9px;padding:.55rem .9rem;}
  .plain .vbtn:hover{background:var(--verified);color:#0A1F16;}
  .plain .vbtn:disabled{opacity:.55;cursor:default;}
  .plain .plain-hint{font-size:.76rem;color:var(--muted);margin-top:.55rem;}
  .plain .plain-h{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;
    color:var(--verified);margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem;}
  /* collapsible variant: .plain-d is a <details>, .plain-h its <summary> */
  details.plain-d>summary.plain-h{list-style:none;cursor:pointer;margin-bottom:0;}
  details.plain-d>summary.plain-h::-webkit-details-marker{display:none;}
  details.plain-d>summary.plain-h::after{content:"▸";margin-left:auto;font-size:.7rem;color:var(--muted);transition:transform .18s;}
  details.plain-d[open]>summary.plain-h::after{transform:rotate(90deg);}
  details.plain-d[open]>summary.plain-h{margin-bottom:.7rem;}
  details.plain-d>summary.plain-h:hover{color:#7FD3AE;}
  .plain .plain-b{font-size:.98rem;line-height:1.66;color:var(--ink);}
  /* markdown inside the plain-language body — tighter than the hero answer */
  .plain .plain-b.md .mdp{margin:.55rem 0;} .plain .plain-b.md .mdp:first-child{margin-top:0;}
  .plain .plain-b.md .mdl{margin:.5rem 0 .5rem 1.1rem;} .plain .plain-b.md .mdh{font-size:.82rem;margin:.7rem 0 .35rem;}
  .plain .plain-b.md strong{color:var(--ink);font-weight:640;}

  /* self-healing corpus — fill-the-gaps panel */
  .gapfix{margin:1.4rem 0 .4rem;padding:1rem 1.15rem;border:1px solid var(--hair);border-left:3px solid var(--gold);
    border-radius:14px;background:var(--panel2);}
  .gapfix.soft{border-left-color:var(--hair);background:transparent;opacity:.86;}
  .gapfix.soft .gapfix-h{color:var(--muted);}
  .gapfix .vbtn{font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.03em;cursor:pointer;
    border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:9px;padding:.55rem .9rem;margin-top:.2rem;}
  .gapfix .vbtn:hover{background:var(--gold);color:#1A1206;} .gapfix .vbtn:disabled{opacity:.55;cursor:default;}
  .gapfix-h{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:.4rem;}
  .gapfix-hint{font-size:.8rem;color:var(--muted);margin-bottom:.7rem;line-height:1.5;}
  .gapfix-sum{font-size:.92rem;color:var(--ink);margin:.1rem 0 .8rem;line-height:1.55;}
  .gaplbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:.3rem 0 .55rem;}
  .gaplbl2{margin-top:1.1rem;border-top:1px solid var(--hair);padding-top:.9rem;}
  .gapjobs{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.9rem;}
  .gapjob{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .7rem;border:1px solid var(--hair);
    border-radius:10px;background:var(--panel);cursor:pointer;transition:border-color .15s;}
  .gapjob:hover{border-color:rgba(211,179,124,.4);}
  .gapjob input{margin-top:.25rem;flex:none;accent-color:var(--gold);width:1rem;height:1rem;}
  .gapj-body{display:flex;flex-direction:column;gap:.25rem;min-width:0;}
  .gapj-top{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;}
  .gapj-top b{font-family:var(--mono);font-size:.72rem;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;}
  .gapj-q{font-size:.9rem;color:var(--ink);line-height:1.4;}
  .gapj-meta{display:flex;gap:.5rem;flex-wrap:wrap;font-size:.7rem;color:var(--muted);}
  .gapj-kind,.gapj-qual,.gapj-lim{background:var(--panel2);border:1px solid var(--hair);border-radius:6px;padding:.08rem .4rem;}
  .gapj-why{font-size:.78rem;color:var(--muted);line-height:1.45;}
  .gapstatus{display:block;font-size:.8rem;color:var(--muted);margin-top:.6rem;line-height:1.5;}
  .gapstatus a{color:var(--gold);}
  .gapprog{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:.4rem;}
  .gaprecs{margin:.2rem 0 0;padding-left:1.1rem;font-size:.86rem;color:var(--ink);line-height:1.5;}
  .gaprecs li{margin-bottom:.4rem;} .gapr-why{display:block;font-size:.76rem;color:var(--muted);}

  /* conversation thread */
  .threadbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:0 0 1.1rem;padding-bottom:.7rem;border-bottom:1px solid var(--hair);}
  .threadlbl{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
  .turn{margin:0 0 1.6rem;}
  .turn + .turn{padding-top:1.6rem;border-top:1px solid var(--hair);}
  .turn-q{display:flex;gap:.6rem;align-items:flex-start;margin:0 0 1rem;}
  .turn-qmark{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:1.7rem;height:1.7rem;
    border-radius:8px;background:var(--gold);color:#1A1206;font-family:var(--mono);font-size:.68rem;font-weight:700;margin-top:.1rem;}
  .turn-qtext{font-family:var(--serif,Georgia,serif);font-size:1.18rem;line-height:1.4;color:var(--ink);font-weight:500;letter-spacing:-.01em;}
  .turnstatus{margin-top:1.2rem;}
  /* suggested follow-ups */
  .suggest{margin:.6rem 0 .4rem;padding:1rem 1.15rem;border:1px solid var(--hair);border-radius:14px;background:var(--panel2);}
  .suggest-h{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:.7rem;}
  .suggest-loading{font-size:.82rem;color:var(--muted);}
  .suggest-chips{display:flex;flex-direction:column;gap:.5rem;}
  .chip-q{text-align:left;font-family:inherit;font-size:.92rem;line-height:1.4;color:var(--ink);cursor:pointer;
    background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:.6rem .8rem;transition:border-color .15s,color .15s;}
  .chip-q::before{content:"→ ";color:var(--gold);font-weight:700;}
  .chip-q:hover{border-color:rgba(211,179,124,.45);color:#fff;}

  /* live agent trace (streaming) */
  .agenttrace{display:flex;flex-direction:column;gap:.45rem;padding:.4rem 0 .2rem;}
  .tstep{font-family:var(--mono);font-size:.82rem;color:var(--muted);line-height:1.5;opacity:.9;
    display:flex;align-items:baseline;gap:.4rem;flex-wrap:wrap;transition:color .2s;}
  .tstep b{color:var(--ink);font-weight:640;}
  .tstep .tq{color:var(--ink);font-family:var(--sans);}
  .tstep .tvar{font-size:.72rem;color:var(--muted);opacity:.75;border:1px solid var(--hair);border-radius:6px;padding:.02rem .38rem;}
  .tstep.tlive{color:var(--gold);}
  .tstep.tlive::after{content:"";width:.7rem;height:.7rem;border-radius:50%;align-self:center;
    border:2px solid rgba(211,179,124,.3);border-top-color:var(--gold);animation:spin .7s linear infinite;}
  @media (prefers-reduced-motion:reduce){.tstep.tlive::after{animation:none;}}

  /* grounding header band */
  .ansmeta{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:0 0 1.3rem;padding-bottom:.9rem;
    border-bottom:1px solid var(--hair);}
  .gpill{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    border-radius:999px;padding:.24rem .7rem;border:1px solid;}
  .gpill.on{color:var(--verified);border-color:rgba(87,184,145,.5);background:rgba(87,184,145,.09);}
  .gpill.off{color:var(--gap);border-color:rgba(214,151,90,.5);background:rgba(214,151,90,.08);}
  .mstat{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.02em;}
  .mstat b{color:var(--ink);font-weight:640;}
  .mstat.dim{opacity:.75;}
  .metabtns{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;}
  .copybtn{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;
    cursor:pointer;background:transparent;border:1px solid var(--hair);border-radius:8px;padding:.3rem .6rem;color:var(--muted);white-space:nowrap;}
  .copybtn:hover{color:var(--gold);border-color:rgba(211,179,124,.6);}

  /* signature: the evidence dossier entry */
  .claim{position:relative;background:var(--panel);border:1px solid var(--hair);border-radius:14px;
    scroll-margin-top:1rem;padding:1.1rem 1.2rem 1rem;margin-bottom:.85rem;overflow:hidden;
    animation:rise .38s cubic-bezier(.2,.7,.2,1) both;transition:border-color .15s;}
  .claim::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:.55;}
  .claim:hover{border-color:rgba(211,179,124,.35);}
  .chead{display:flex;gap:.7rem;align-items:flex-start;}
  .ctext{font-weight:540;letter-spacing:-.005em;line-height:1.5;color:var(--ink);}
  .cquote{margin:.75rem 0 .85rem 0;padding:0;font-family:var(--serif);font-size:1rem;line-height:1.55;
    color:var(--muted);position:relative;padding-left:.9rem;border-left:2px solid var(--hair);}
  .cquote::before{content:"\201C";color:var(--gold);}.cquote::after{content:"\201D";color:var(--gold);}
  .cfoot{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding-top:.7rem;border-top:1px solid var(--hair);}
  .verified{display:inline-flex;align-items:center;gap:.32rem;color:var(--verified);font-size:.66rem;
    font-weight:700;text-transform:uppercase;letter-spacing:.09em;}
  .src{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-left:auto;
    overflow-wrap:anywhere;min-width:0;}
  a.srclink{text-decoration:none;color:var(--verified);border-bottom:1px dotted var(--verified);}
  a.srclink:hover{opacity:.8;}
  a.srclink:focus-visible{outline:2px solid var(--verified);outline-offset:2px;}

  .gaps{margin:.4rem 0 1.2rem;border:1px solid var(--hair);border-left:3px solid var(--gap);
    border-radius:12px;padding:.8rem 1rem;background:var(--panel2);}
  .gaps h4{margin:0 0 .3rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--gap);}
  .gaps li{font-size:.9rem;color:var(--ink);margin-left:1rem;}

  /* past-sessions — full-page master/detail panel */
  .sessions[hidden]{display:none;}   /* author display:flex would otherwise beat the UA [hidden] rule */
  .sessions{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;}
  .sessions .shead{display:flex;align-items:center;gap:.9rem;padding:.85rem 1.2rem;
    border-bottom:1px solid var(--hair);flex:none;flex-wrap:wrap;}
  .sessions .sback{font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;
    cursor:pointer;background:transparent;border:1px solid var(--hair);border-radius:8px;
    padding:.4rem .75rem;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem;}
  .sessions .sback:hover{border-color:var(--gold);color:var(--gold);}
  .sessions .stitle{font-family:var(--serif);font-size:1.1rem;color:var(--ink);}
  .sessions .ssearch{margin-left:auto;background:var(--panel2);border:1px solid var(--hair);border-radius:9px;
    color:var(--ink);font:inherit;font-size:.82rem;padding:.42rem .7rem;min-width:min(280px,55vw);outline:none;}
  .sessions .ssearch:focus{border-color:rgba(211,179,124,.5);box-shadow:0 0 0 2px rgba(211,179,124,.12);}
  .sessions .ssearch::placeholder{color:var(--muted);}
  .sessions .sbody{flex:1;display:flex;min-height:0;}
  /* LEFT list — differentiated surface; width resizable via the drag handle */
  .sessions .slist{width:34%;max-width:60%;min-width:220px;overflow-y:auto;padding:.6rem;
    background:var(--panel2);border-right:1px solid var(--hair);flex:none;}
  /* draggable divider */
  .sessions .sdrag{flex:none;width:8px;cursor:col-resize;background:transparent;position:relative;}
  .sessions .sdrag::before{content:"";position:absolute;inset:0 3px;border-radius:2px;background:var(--hair);}
  .sessions .sdrag:hover::before,.sessions .sdrag.drag::before{background:var(--gold);}
  /* RIGHT detail — base surface */
  .sessions .sdetail{flex:1;min-width:0;overflow-y:auto;padding:1.5rem 1.9rem;background:var(--bg);}
  .sessions .sdetail .summary:first-child{margin-top:0;}
  .sessions .sqhead{border-bottom:1px solid var(--hair);padding-bottom:.9rem;margin-bottom:1.2rem;}
  .sessions .sqhead .qq{font-family:var(--serif);font-size:1.3rem;line-height:1.35;color:var(--ink);letter-spacing:-.01em;}
  .sessions .sqhead .qm{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:.5rem;display:flex;gap:.7rem;flex-wrap:wrap;}
  .sessions .sqhead .qm b{color:var(--gold);font-weight:600;}
  .sessions .srow{display:block;width:100%;text-align:left;border:none;background:transparent;cursor:pointer;
    border-radius:9px;padding:.7rem .75rem;margin-bottom:.2rem;border-left:2px solid transparent;}
  .sessions .srow:hover{background:var(--panel);}
  .sessions .srow[aria-current="true"]{background:var(--panel);border-left-color:var(--gold);}
  .sessions .srow .sq{color:var(--ink);font-size:.86rem;line-height:1.45;}   /* full text, no truncation */
  .sessions .srow .sm{font-family:var(--mono);font-size:.62rem;letter-spacing:.02em;color:var(--muted);
    margin-top:.4rem;display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;}
  .sessions .srow .sg{color:var(--verified);} .sessions .srow .swho{color:var(--gold);}
  .sessions .splaceholder{color:var(--muted);font-size:.9rem;margin-top:2.5rem;text-align:center;}
  .sessions .sempty{color:var(--muted);padding:1rem;font-size:.85rem;}
  @media (max-width:640px){
    .sessions .shead{padding:.75rem .9rem;}
    .sessions .ssearch{margin-left:0;order:3;width:100%;min-width:0;}
    .sessions .sbody{flex-direction:column;}
    .sessions .slist{width:auto !important;max-width:none;min-width:0;max-height:38vh;
      border-right:none;border-bottom:1px solid var(--hair);}
    .sessions .sdrag{display:none;}
    .sessions .sdetail{padding:1.1rem 1rem;}
    .sessions .sqhead .qq{font-size:1.12rem;}
  }

  .answer.md .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.75rem 0 1.05rem;}
  .answer.md .tw .mdt{margin:0;}

  /* briefing videos — Netflix-style catalogue */
  .videos[hidden]{display:none;}
  .videos{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
    background-image:radial-gradient(120% 60% at 85% -10%, rgba(211,179,124,.06), transparent 60%);}
  .videos .vhd{display:flex;align-items:center;gap:.9rem;padding:.85rem 1.2rem;border-bottom:1px solid var(--hair);flex:none;}
  .videos .sback{font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
    background:transparent;border:1px solid var(--hair);border-radius:8px;padding:.4rem .75rem;color:var(--ink);}
  .videos .sback:hover{border-color:var(--gold);color:var(--gold);}
  .videos .stitle{font-family:var(--serif);font-size:1.1rem;color:var(--ink);}
  .vgrid{flex:1;overflow-y:auto;padding:1.4rem;display:grid;gap:1.1rem;
    grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));align-content:start;}
  .vcard{background:var(--panel);border:1px solid var(--hair);border-radius:13px;overflow:hidden;cursor:pointer;
    transition:transform .16s, border-color .16s, box-shadow .16s;}
  .vcard:hover{transform:translateY(-3px);border-color:rgba(211,179,124,.45);box-shadow:0 16px 40px -22px #000;}
  .vposter{position:relative;aspect-ratio:16/9;background:#000;}
  .vposter video{width:100%;height:100%;object-fit:cover;display:block;}
  .vposter .vplay{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;color:#fff;
    background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.35));opacity:.9;transition:opacity .15s;}
  .vcard:hover .vplay{opacity:1;}
  .vposter .vdur{position:absolute;right:.5rem;bottom:.5rem;background:rgba(0,0,0,.72);color:#fff;
    font-family:var(--mono);font-size:.62rem;padding:.12rem .42rem;border-radius:5px;}
  .vcinfo{padding:.7rem .8rem .85rem;}
  .vctitle{font-weight:560;font-size:.9rem;line-height:1.32;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .vcmeta{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-top:.5rem;display:flex;gap:.55rem;flex-wrap:wrap;}
  .vcmeta .vcwho{color:var(--gold);}
  .vempty{color:var(--muted);padding:2.5rem 1rem;text-align:center;grid-column:1/-1;}
  /* playback lightbox */
  .vlight[hidden]{display:none;}
  .vlight{position:fixed;inset:0;z-index:65;background:rgba(3,8,16,.9);-webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);display:grid;place-items:center;padding:1.2rem;}
  .vlbox{width:min(880px,96vw);}
  .vlhead{display:flex;align-items:center;gap:.7rem;margin-bottom:.7rem;flex-wrap:wrap;}
  .vltitle{font-family:var(--serif);font-size:1.1rem;color:var(--ink);flex:1;min-width:0;}
  .vlopen{cursor:pointer;background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:8px;
    font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.04em;padding:.4rem .7rem;}
  .vlopen:hover{background:var(--gold);color:#1A1206;}
  .vlclose{cursor:pointer;background:transparent;border:1px solid var(--hair);border-radius:8px;color:var(--ink);
    font-family:var(--mono);font-size:.68rem;padding:.4rem .7rem;}
  .vlbox video{width:100%;border-radius:12px;background:#000;display:block;max-height:74vh;}

  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.claim{animation:none}.status::before,button.go.loading::after{animation:none}}

  /* mobile: minimal + legible on a phone */
  @media (max-width:560px){
    .wrap{padding:1.15rem .9rem 4rem;}
    h1{font-size:1.55rem;}
    .logo{height:50px;}
    .answer.md .mdh:first-child + .mdp{font-size:1.06rem;}
    .motto{gap:.8rem;letter-spacing:.2em;font-size:.74rem;}
    .motto b{letter-spacing:.2em;}
    .answer.md video,.vid video{width:100%;}
    /* elevated answer — keep it comfortable on a phone */
    .ansmeta{gap:.5rem;}
    .claim{padding:.9rem 1rem .85rem;}
    .cquote{font-size:.94rem;}
    .cfoot{gap:.5rem;} .src{margin-left:0;}
    .answer.md .mdt{font-size:.82rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="/noesis-mark.png" alt="Noesis" />
    <button type="button" class="histbtn newbtn" id="newbtn" style="margin-left:auto;">＋ New chat</button>
    <a class="histbtn" href="/admin" style="margin-left:0;text-decoration:none;">Coverage</a>
    <button type="button" class="histbtn" id="vidbtn" style="margin-left:0;">Videos</button>
    <button type="button" class="histbtn" id="histbtn" style="margin-left:0;">Past Sessions</button>
  </header>

  <h1 id="heading">What does the evidence show?</h1>
  <form id="ask">
    <div class="field">
      <textarea id="q" rows="1" placeholder="e.g. What treatments are being studied for type 2 diabetes?"
                aria-label="Research question"></textarea>
      <button class="attach" id="camera" type="button" hidden aria-label="Take a photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <button class="attach" id="attach" type="button" hidden aria-label="Attach image, PDF, or DICOM">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24 4.24l-9.2 9.19a1 1 0 0 1-1.41-1.41l8.49-8.49"/>
        </svg>
      </button>
      <button class="go" id="go" type="submit" aria-label="Research">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
    <input type="file" id="file" accept="image/*,.pdf,application/pdf,.dcm,application/dicom" multiple hidden />
    <div class="attns" id="attns" hidden></div>
    <div class="sources" id="sources"><span class="lbl">Sources</span></div>
  </form>

  <section id="out" aria-live="polite">
    <div class="motto">
      <div class="mstep"><b>Discover</b>
        <svg class="micon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
      <i></i>
      <div class="mstep"><b>Understand</b>
        <svg class="micon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.8 1 1.6 1 2.5h6c0-.9.3-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg></div>
      <i></i>
      <div class="mstep"><b>Act</b>
        <svg class="micon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="0.7" fill="currentColor"/></svg></div>
    </div>
  </section>
</div>

<!-- Past Sessions: full-page master/detail (questions left, answer right) -->
<section class="sessions" id="sessions" hidden aria-label="Past sessions">
  <div class="shead">
    <button type="button" class="sback" id="sback">← Back</button>
    <span class="stitle">Past Sessions</span>
    <input type="search" class="ssearch" id="ssearch" placeholder="Search questions or people…" aria-label="Search sessions" />
  </div>
  <div class="sbody" id="sbody">
    <div class="slist" id="slist"></div>
    <div class="sdrag" id="sdrag" role="separator" aria-label="Resize panels"></div>
    <div class="sdetail" id="sdetail"><div class="splaceholder">Select a question to view its answer.</div></div>
  </div>
</section>

<!-- briefing videos catalogue (Netflix-style) across all sessions -->
<section class="videos" id="videos" hidden aria-label="Briefing videos">
  <div class="vhd">
    <button type="button" class="sback" id="vback">← Back</button>
    <span class="stitle">Briefing Videos</span>
  </div>
  <div class="vgrid" id="vgrid"></div>
</section>
<div class="vlight" id="vlight" hidden aria-label="Video player">
  <div class="vlbox">
    <div class="vlhead">
      <span class="vltitle" id="vltitle"></span>
      <button type="button" class="vlopen" id="vlopen">Open session</button>
      <button type="button" class="vlclose" id="vlclose">Close ✕</button>
    </div>
    <video id="vlvideo" controls playsinline></video>
  </div>
</div>

<!-- identity gate: capture name + email at landing, stored against each session -->
<div class="idmodal" id="idmodal" hidden>
  <div class="idcard">
    <img src="/noesis-mark.png" alt="Noesis" />
    <h2>Welcome to Noesis</h2>
    <p>Tell us who you are, so your questions are saved to your name.</p>
    <input id="idname" type="text" placeholder="Full name" autocomplete="name" />
    <input id="idemail" type="email" placeholder="Email" autocomplete="email" />
    <div class="iderr" id="iderr"></div>
    <button type="button" class="idgo" id="idgo">Continue</button>
  </div>
</div>

<!-- camera capture (mobile + laptop webcam) -->
<div class="cammodal" id="cammodal" hidden aria-label="Camera">
  <video id="camvideo" autoplay playsinline muted></video>
  <div class="camctrls">
    <button type="button" class="cambtn" id="camcancel">Cancel</button>
    <button type="button" class="camshot" id="camshot" aria-label="Capture photo"></button>
    <button type="button" class="cambtn" id="camflip">Flip</button>
  </div>
</div>
<canvas id="camcanvas" hidden></canvas>

<script>
const $ = s => document.querySelector(s);
const out = $("#out"), go = $("#go"), q = $("#q");
let SOURCES = [];
let VIDEO_ENABLED = false;
let STRUCTURED = false;     // render the answer as markdown sections (server-authoritative)
let VISION_ENABLED = false; // image/PDF/DICOM upload → visual-context research
let LAYMAN_ENABLED = false; // on-demand plain-language re-explanation
let GAP_ENABLED = false;    // self-healing: suggest + queue sources to fill evidence gaps
let CONV_ENABLED = false;   // multi-turn conversation (follow-ups carry context)
let SUGGEST_ENABLED = false;// suggested follow-up questions after each answer
let STREAM_ENABLED = false; // live agent trace via SSE (/research/stream)
let THREAD = {session_id:null, turns:[]};   // the active conversation
let BASE_PLACEHOLDER = "";                   // vertical console placeholder (restored on New)
let EXAMPLES = [];                            // vertical example questions → random intake prompt
let ATTACHMENTS = [];       // [{name, media_type, data(base64)}]
let USER = null;            // {name, email} captured at landing, saved per session
let LAST = null;            // {question, answer} for the answer-video add-on
let CURRENT_Q = "";        // the question of the answer currently rendered

const label = k => k === "web" ? "Web" : k === "workspace" ? "Workspace" : "Corpus";

// A random real example question for the intake prompt (or the plain placeholder if none).
function pickPlaceholder(){
  return EXAMPLES.length ? EXAMPLES[Math.floor(Math.random()*EXAMPLES.length)] : BASE_PLACEHOLDER;
}

async function loadConfig(){
  try{
    const c = await (await fetch("/config")).json();
    SOURCES = c.sources || [];
    VIDEO_ENABLED = !!c.video_enabled;
    STRUCTURED = !!c.structured_answers;
    LAYMAN_ENABLED = !!c.layman_enabled;
    GAP_ENABLED = !!c.gap_healing_enabled;
    CONV_ENABLED = !!c.conversation_enabled;
    SUGGEST_ENABLED = !!c.suggest_enabled;
    STREAM_ENABLED = !!c.stream_enabled;
    VISION_ENABLED = !!c.vision_enabled;
    if(VISION_ENABLED){
      $("#attach").hidden = false;
      if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) $("#camera").hidden = false;
    }
    // vertical-supplied console copy (heading + placeholder) — keeps the shell domain-neutral
    const con = c.console || {};
    if(con.heading) $("#heading").textContent = con.heading;
    // seed the intake prompt with a RANDOM real question from the vertical's picker (falls back
    // to the plain placeholder). Refreshed on each New chat for variety.
    EXAMPLES = Array.isArray(con.examples) ? con.examples : [];
    BASE_PLACEHOLDER = con.placeholder || "Ask a research question…";
    q.setAttribute("placeholder", pickPlaceholder());
    const box = $("#sources");
    for(const k of SOURCES){
      const b = document.createElement("button");
      b.type="button"; b.className="pill"; b.dataset.key=k;
      // all sources on by default (web = Exa, restricted to trusted medical domains, runs in
      // parallel so latency is bounded). Toggle web off for max speed on pure-corpus questions.
      b.setAttribute("aria-pressed","true"); b.textContent = label(k);
      b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")==="true"?"false":"true");
      box.appendChild(b);
    }
  }catch(e){ /* config unavailable — shell still works */ }
}

const chosen = () => [...document.querySelectorAll('.pill[aria-pressed="true"]')].map(b=>b.dataset.key);

function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML;}

// Inline: bold, clickable [n] refs, and typed highlight marks. Operates on
// ALREADY-ESCAPED text (XSS-safe) — the [[F]]/[[R]]/[[K]] markers survive esc()
// (literal brackets) and never collide with [n] refs (F/R/K aren't digits).
function mdInline(s){
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
       .replace(/\[(\d+)\]/g,'<sup class="ref" data-n="$1">[$1]</sup>');
  s = s.replace(/\[\[F\]\]([\s\S]*?)\[\[\/F\]\]/g,'<mark class="hl hl-f">$1</mark>')
       .replace(/\[\[R\]\]([\s\S]*?)\[\[\/R\]\]/g,'<mark class="hl hl-r">$1</mark>')
       .replace(/\[\[K\]\]([\s\S]*?)\[\[\/K\]\]/g,'<mark class="hl hl-k">$1</mark>');
  return s;
}
// Minimal, self-contained, XSS-safe markdown → HTML. We esc() the whole source FIRST,
// so any HTML in the model output is neutralized before we add known-safe tags. Handles
// headings (##/###), bullet lists, simple tables, bold, and [n] refs. No external lib.
function mdToHtml(raw){
  const lines = esc(raw).split(/\r?\n/);
  const cells = r => r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
  const out = []; let i = 0;
  while(i < lines.length){
    const line = lines[i];
    if(/^\s*$/.test(line)){ i++; continue; }
    // table: header row + |---| separator + body rows
    if(/^\s*\|.*\|\s*$/.test(line) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const head = cells(line); i += 2; const rows = [];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      out.push('<div class="tw"><table class="mdt"><thead><tr>'+head.map(c=>`<th>${mdInline(c)}</th>`).join("")+
        '</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${mdInline(c)}</td>`).join("")+'</tr>').join("")+
        '</tbody></table></div>');
      continue;
    }
    const hm = line.match(/^(#{1,4})\s+(.*)$/);
    if(hm){ const lvl = Math.min(6, hm[1].length+2); out.push(`<h${lvl} class="mdh">${mdInline(hm[2])}</h${lvl}>`); i++; continue; }
    if(/^\s*[-*]\s+/.test(line)){
      const items = [];
      while(i<lines.length && /^\s*[-*]\s+/.test(lines[i])){ items.push(mdInline(lines[i].replace(/^\s*[-*]\s+/,""))); i++; }
      out.push('<ul class="mdl">'+items.map(x=>`<li>${x}</li>`).join("")+'</ul>');
      continue;
    }
    const para = [line]; i++;
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s|^\s*[-*]\s|^\s*\|/.test(lines[i])){ para.push(lines[i]); i++; }
    out.push(`<p class="mdp">${mdInline(para.join(" "))}</p>`);
  }
  return out.join("");
}

function render(data, target, opts){
  target = target || out;
  opts = opts || {};
  if(data._pending){   // conversation: the question shows immediately while it runs
    target.innerHTML = STREAM_ENABLED
      ? `<div class="agenttrace"><div class="tstep tlive">Starting…</div></div>`
      : `<div class="status">Searching sources and verifying evidence…</div>`;
    return;
  }
  const parts = [];
  const n = data.claims.length;
  const sid = data.session_id || data.id || null;   // saved session → shareable permalink
  const showLink = sid && !opts.noLink;             // thread turns suppress per-turn link (one per thread)
  parts.push(`<div class="ansmeta">
    <span class="gpill ${data.grounded?"on":"off"}">${data.grounded?"✓ Grounded":"◦ Not fully grounded"}</span>
    <span class="mstat"><b>${n}</b> verified finding${n===1?"":"s"}</span>
    ${data.rejected ? `<span class="mstat dim">${data.rejected} rejected</span>`:""}
    <span class="metabtns">
      ${showLink?`<button type="button" class="copybtn" id="linkbtn">🔗 Copy link</button>`:""}
      ${(data.answer||n)?`<button type="button" class="copybtn" id="copybtn">⧉ Copy</button>`:""}
    </span>
  </div>`);
  if(data.coverage_gaps && data.coverage_gaps.length){
    parts.push(`<div class="gaps"><h4>Coverage gaps</h4><ul>` +
      data.coverage_gaps.map(g=>`<li>${esc(g)}</li>`).join("") + `</ul></div>`);
  }
  const ss = data.source_stats || {};
  const skeys = Object.keys(ss);
  if(skeys.length){
    const chips = skeys.map(k=>{
      const s = ss[k]; const helped = s.cited>0;
      return `<span class="pill" style="cursor:default;${helped?'color:#1A1206;background:var(--verified);border-color:var(--verified)':''}">${esc(k)} · ${s.cited}/${s.retrieved} cited</span>`;
    }).join(" ");
    parts.push(`<div class="summary" style="border:none;padding-top:.2rem"><span>Sources used:</span>${chips}</div>`);
  }
  // labeled AI visual observation (context, NOT a diagnosis, NOT part of the evidence)
  if(data.visual_observation){
    parts.push(`<div class="vobs">
      <div class="vobs-h">◐ AI visual observation · not a diagnosis</div>
      <div class="vobs-b">${esc(data.visual_observation)}</div>
      <div class="vobs-note">Automated image description used only to guide the evidence search — it is not a clinical finding and is not part of the verified evidence below.</div>
    </div>`);
  }
  if(data.attachment_notes && data.attachment_notes.length){
    parts.push(`<div class="vobs-note" style="margin:-.9rem 0 1.2rem">${data.attachment_notes.map(esc).join(" · ")}</div>`);
  }
  // what the user uploaded with this question (shown when reopening a saved session)
  if(data.attachments && data.attachments.length){
    const items = data.attachments.map(a=> (a.kind==="image" && a.thumb)
      ? `<img class="athumb" src="${esc(a.thumb)}" alt="${esc(a.name)}" title="${esc(a.name)}" />`
      : `<span class="adoc">📄 ${esc(a.name)}</span>`).join("");
    parts.push(`<div class="attstrip"><span class="attlbl">Uploaded</span>${items}</div>`);
  }
  // synthesized answer (grounded in the findings) — the hero; [n] refs → findings.
  if(data.answer){
    const html = STRUCTURED
      ? mdToHtml(data.answer)
      : esc(data.answer).replace(/\[(\d+)\]/g, '<sup class="ref" data-n="$1">[$1]</sup>');
    parts.push(`<div class="answer${STRUCTURED?" md":""}">${html}</div>`);
    if(STRUCTURED && /<mark class="hl/.test(html)){
      parts.push(`<div class="hllegend">
        <span><i class="lf"></i>Load-bearing fact</span>
        <span><i class="lr"></i>Critical reasoning</span>
        <span><i class="lk"></i>Key context</span></div>`);
    }
    // answer-video add-on. A saved session may already have a video → show it inline;
    // otherwise offer to generate one (only when enabled AND the answer is grounded).
    LAST = {question:(data.question||CURRENT_Q), answer:data.answer,
            session_id:(data.session_id||data.id||null)};
    if(data.video_filename){
      parts.push(`<div class="vid" id="vid">
        <div class="vhint" id="vhint">🎬 ${esc(data.video_title||"Briefing video")}${data.video_duration?" · "+Math.round(data.video_duration)+"s":""}</div>
        <video controls preload="metadata" src="/video/file/${encodeURIComponent(data.video_filename)}"
          onerror="this.insertAdjacentHTML('afterend','<div class=&quot;vhint&quot;>This video is no longer available.</div>');this.remove();"></video>
        ${VIDEO_ENABLED?`<button type="button" class="vbtn" id="vgo" style="margin-top:.75rem">↻ Regenerate briefing video</button>`:""}
      </div>`);
    } else if(VIDEO_ENABLED && data.grounded){
      parts.push(`<div class="vid" id="vid">
        <button type="button" class="vbtn" id="vgo">▶ Generate briefing video</button>
        <div class="vhint" id="vhint">A ~60-second clinical evidence briefing on this answer — for clinicians and researchers, not patients. Takes ~2 minutes.</div>
      </div>`);
    }
    // plain-language explanation — saved copy if present, else an on-demand button
    if(data.layman_answer){
      parts.push(`<details class="plain plain-d"><summary class="plain-h">◍ In plain language</summary>
        <div class="plain-b md">${mdToHtml(data.layman_answer)}</div></details>`);
    } else if(LAYMAN_ENABLED && data.grounded){
      parts.push(`<div class="plain" id="plain">
        <button type="button" class="vbtn" id="plaingo">◍ Explain in plain language</button>
        <div class="plain-hint">The same answer, re-explained for a patient — plain words, same essence, no new claims.</div>
      </div>`);
    }
  }
  // Evidence dossier — collapsed by default; a [n] ref click or the summary opens it.
  if(n){
    const cards = data.claims.map((c,idx)=>{
      const label = esc(c.source) + (c.title ? " · " + esc(c.title) : "");
      const src = c.url
        ? `<a class="src srclink" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer" title="Open source in a new tab">${label} ↗</a>`
        : (c.source ? `<span class="src">${label}</span>` : "");
      return `<article class="claim" id="f${idx+1}">
        <div class="chead"><span class="fnum">${idx+1}</span><div class="ctext">${esc(c.text)}</div></div>
        <blockquote class="cquote">${esc(c.quote)}</blockquote>
        <div class="cfoot"><span class="verified">✓ Verified in source</span>${src}</div>
      </article>`;
    }).join("");
    parts.push(`<details class="evblock" id="evblock">
      <summary><h4 class="evhead">Evidence — ${n} verified finding${n===1?"":"s"}</h4></summary>
      <div class="evbody">${cards}</div>
    </details>`);
  }
  if(!n && !(data.coverage_gaps||[]).length){
    const atoms = data.atoms_gathered || 0;
    if(atoms > 0){
      const summ = Object.entries(ss).map(([k,v])=>`${v.retrieved} from ${esc(k)}`).join(", ");
      parts.push(`<div class="empty"><span class="k">No span-verified answer.</span> Retrieved
        ${atoms} relevant passage${atoms>1?"s":""}${summ?" ("+summ+")":""}, but the agent couldn't
        ground a direct answer — often because the question asks for a ranking or recommendation
        the sources don't establish. Try asking about a specific drug, trial, condition, or side effect.</div>`);
    } else {
      parts.push(`<div class="empty">${data._note?esc(data._note):"No grounded answer for that question with the chosen sources."}</div>`);
    }
  }
  // Self-healing corpus — ALWAYS offer to find + queue sources when enabled (a grounded answer
  // can still admit "no direct evidence" — the HPB case — so we never hide the affordance). Copy
  // adapts: prominent when under-evidenced, softer when the answer already looks solid.
  if(GAP_ENABLED){
    const weak = !data.grounded || (data.coverage_gaps||[]).length || n < 2;
    parts.push(gapPanelMarkup(weak));
  }
  target.innerHTML = parts.join("");
  // clicking a [n] reference scrolls to and highlights its finding (within this pane)
  target.querySelectorAll(".ref").forEach(r=>r.addEventListener("click",()=>{
    const ev = target.querySelector("#evblock"); if(ev) ev.open = true;   // reveal the dossier
    const el = target.querySelector("#f"+r.dataset.n);
    if(el){ requestAnimationFrame(()=>{ el.scrollIntoView({behavior:"smooth",block:"center"});
      el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1200); }); }
  }));
  const vgo = target.querySelector("#vgo");
  if(vgo) vgo.addEventListener("click", ()=>generateVideo(target));
  const cb = target.querySelector("#copybtn");
  if(cb) cb.addEventListener("click", ()=>copyAnswer(data, cb));
  const lb = target.querySelector("#linkbtn");
  if(lb && showLink){ if(target===out) setShareHash(sid); lb.addEventListener("click", ()=>copyLink(sid, lb)); }
  const pg = target.querySelector("#plaingo");
  if(pg) pg.addEventListener("click", ()=>generatePlain(target));
  const gg = target.querySelector("#gapgo");
  if(gg) gg.addEventListener("click", ()=>generateGapPlan(target, data));
}

// Reusable "Fill the evidence gaps" panel — used by render() AND by the no-answer / error /
// timeout paths, so the self-healing affordance is ALWAYS available when evidence is missing.
function gapPanelMarkup(weak){
  // weak = under-evidenced (not grounded / stated gaps / thin / no direct evidence). When the
  // answer looks solid we still OFFER gap-fill (an answer can always be strengthened), but with
  // softer copy so we never wrongly imply a good answer is inadequate.
  const hint = weak
    ? "This question is under-evidenced — the answer may not directly address it. Find high-quality sources to add to the corpus so it's answerable next time; the corpus heals itself."
    : "Want deeper or more authoritative evidence behind this answer? Suggest high-quality sources to add to the corpus.";
  return `<div class="gapfix${weak?"":" soft"}" id="gapfix">
    <div class="gapfix-h">◈ ${weak?"Fill the evidence gaps":"Strengthen the evidence"}</div>
    <div class="gapfix-hint">${hint}</div>
    <button type="button" class="vbtn" id="gapgo">◈ Suggest sources to add</button>
  </div>`;
}
function wireGap(root, data){
  const gg = root.querySelector("#gapgo");
  if(gg) gg.addEventListener("click", ()=>generateGapPlan(root, data));
}

// Self-healing: ask the backend which sources would fill this question's gaps, render them
// with checkboxes, and let the user queue the selected ones for download + processing.
async function generateGapPlan(root, data){
  const panel = root.querySelector("#gapfix");
  const btn = root.querySelector("#gapgo");
  const hint = panel.querySelector(".gapfix-hint");
  btn.disabled = true; btn.textContent = "Finding sources…";
  try{
    const r = await fetch("/corpus/gap-plan",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({question:(data.question||CURRENT_Q), answer:(data.answer||""),
        coverage_gaps:(data.coverage_gaps||[])})});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || `HTTP ${r.status}`);
    const plan = await r.json();
    const jobs = plan.jobs||[];
    if(!jobs.length && !(plan.recommendations||[]).length){
      hint.textContent = "No additional sources would help — "+(plan.summary||"the gap isn't fillable by more data.");
      btn.remove(); return;
    }
    const rows = jobs.map((j,i)=>`<label class="gapjob">
        <input type="checkbox" class="gapjchk" data-i="${i}" checked>
        <span class="gapj-body">
          <span class="gapj-top"><b>${esc(j.connector)}</b><span class="gapj-q">${esc(j.query)}</span></span>
          <span class="gapj-meta">${j.kind?`<span class="gapj-kind">${esc(j.kind)}</span>`:""}${j.quality?`<span class="gapj-qual">${esc(j.quality)}</span>`:""}<span class="gapj-lim">${j.limit} items</span></span>
          ${j.rationale?`<span class="gapj-why">${esc(j.rationale)}</span>`:""}
        </span></label>`).join("");
    const recs = (plan.recommendations||[]).map(rc=>`<li><b>${esc(rc.source)}</b>${rc.what?" — "+esc(rc.what):""}${rc.why?`<span class="gapr-why">${esc(rc.why)}</span>`:""}</li>`).join("");
    panel.innerHTML = `<div class="gapfix-h">◈ Fill the evidence gaps</div>
      ${plan.summary?`<div class="gapfix-sum">${esc(plan.summary)}</div>`:""}
      <div class="gaplbl">Queueable now — high-quality sources to fetch into the corpus:</div>
      <div class="gapjobs">${rows||'<div class="gapfix-hint">No auto-fetchable sources for this gap.</div>'}</div>
      ${jobs.length?`<button type="button" class="vbtn" id="gapqueue">⇩ Queue for download & process</button>
        <span class="gapstatus" id="gapstatus"></span>`:""}
      ${recs?`<div class="gaplbl gaplbl2">Gold-standard sources to add later (need access — not auto-fetchable):</div>
        <ul class="gaprecs">${recs}</ul>`:""}`;
    // stash jobs for the queue action
    panel._jobs = jobs; panel._q = (data.question||CURRENT_Q);
    const qb = panel.querySelector("#gapqueue");
    if(qb) qb.addEventListener("click", ()=>queueGapJobs(panel));
  }catch(e){
    btn.disabled=false; btn.textContent="◈ Suggest sources to add";
    if(hint) hint.textContent = "Couldn't suggest sources: "+(e.message||e);
  }
}

async function queueGapJobs(panel){
  const chosen = [...panel.querySelectorAll(".gapjchk")].filter(c=>c.checked).map(c=>panel._jobs[+c.dataset.i]);
  const status = panel.querySelector("#gapstatus");
  const qb = panel.querySelector("#gapqueue");
  if(!chosen.length){ status.textContent = "Select at least one source."; return; }
  qb.disabled = true; qb.textContent = "Queuing…";
  try{
    const r = await fetch("/corpus/queue",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({question:panel._q, jobs:chosen})});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || `HTTP ${r.status}`);
    const res = await r.json();
    qb.textContent = `✓ Queued ${res.queued}`;
    const ids = res.ids || [];
    status.innerHTML = `Queued ${res.queued} source${res.queued===1?"":"s"} — downloading &amp; indexing in the background. <a href="#" id="gapref">Refresh</a>
      <div class="gapprog" id="gapprog">Starting…</div>`;
    status.querySelector("#gapref").addEventListener("click", e=>{e.preventDefault(); showGapProgress(status, ids);});
    trackGapProgress(status, ids);          // auto-refresh THIS batch's progress until it settles
  }catch(e){
    qb.disabled=false; qb.textContent="⇩ Queue for download & process";
    status.textContent = "Couldn't queue: "+(e.message||e);
  }
}

// Progress for JUST the batch the user queued (by job id) — not the queue's all-time totals.
async function showGapProgress(status, ids){
  const el = status.querySelector("#gapprog"); if(!el) return null;
  try{
    const s = await (await fetch("/corpus/queue?limit=200")).json();
    const idset = new Set(ids), mine = (s.jobs||[]).filter(j=>idset.has(j.id));
    const by = st => mine.filter(j=>j.status===st).length;
    const done=by("done"), failed=by("failed"), running=by("running"), pending=by("pending");
    const blocks = mine.reduce((a,j)=>a+(j.blocks_added||0),0);
    const total = ids.length || mine.length;
    el.textContent = `${done}/${total} indexed`
      + (running?` · ${running} downloading`:"") + (pending?` · ${pending} queued`:"")
      + (failed?` · ${failed} failed`:"") + ` · +${blocks.toLocaleString()} blocks added`;
    return {done, failed, total};
  }catch(e){ return null; }
}
async function trackGapProgress(status, ids){   // gap-fill jobs are small + quick; poll until settled
  for(let i=0;i<30;i++){
    const p = await showGapProgress(status, ids);
    if(p && (p.done + p.failed) >= p.total) return;
    await sleep(4000);
  }
}

async function generatePlain(root){
  if(!LAST) return;
  const panel = root.querySelector("#plain");
  const btn = root.querySelector("#plaingo");
  const hint = panel.querySelector(".plain-hint");
  btn.disabled = true; btn.textContent = "Explaining…";
  try{
    const r = await fetch("/explain",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify(LAST)});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || `HTTP ${r.status}`);
    const {explanation} = await r.json();
    if(!explanation) throw new Error("no explanation produced");
    // just requested → render formatted and OPEN; reopening the saved session shows it collapsed.
    panel.outerHTML = `<details class="plain plain-d" open><summary class="plain-h">◍ In plain language</summary>
      <div class="plain-b md">${mdToHtml(explanation)}</div></details>`;
  }catch(e){
    btn.disabled = false; btn.textContent = "◍ Explain in plain language";
    if(hint) hint.textContent = "Couldn't generate: "+(e.message||e);
  }
}

// Build clean Markdown of the answer + its evidence (verbatim quotes + sources).
function answerMarkdown(data){
  const strip = s => (s||"").replace(/\[\[\/?[FRK]\]\]/g, "");   // drop highlight markers
  const out = [];
  const q = data.question || CURRENT_Q;
  if(q) out.push("# " + q, "");
  if(data.answer) out.push(strip(data.answer), "");
  const claims = data.claims || [];
  if(claims.length){
    out.push("## Evidence", "");
    claims.forEach((c,i)=>{
      out.push(`${i+1}. ${c.text}`);
      out.push(`   > "${c.quote}"`);
      const bits = [c.source, c.title].filter(Boolean).join(" · ");
      out.push(`   — ${bits}${c.url?` (${c.url})`:""}`, "");
    });
  }
  out.push("_Generated by Noesis — every claim verified against a source._");
  return out.join("\n");
}
async function copyAnswer(data, btn){
  const md = answerMarkdown(data);
  const done = () => { const t = btn.textContent; btn.textContent = "✓ Copied"; setTimeout(()=>btn.textContent = t, 1500); };
  try{ await navigator.clipboard.writeText(md); done(); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = md;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(_){ } ta.remove();
  }
}

// ---- shareable session permalinks (#s/<id>) ----
const shareUrl = id => location.origin + location.pathname + "#s/" + encodeURIComponent(id);
function setShareHash(id){ try{ history.replaceState(null, "", "#s/"+encodeURIComponent(id)); }catch(e){} }
async function copyLink(id, btn){
  const url = shareUrl(id);
  const done = () => { const t = btn.textContent; btn.textContent = "✓ Link copied"; setTimeout(()=>btn.textContent = t, 1500); };
  try{ await navigator.clipboard.writeText(url); done(); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = url;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(_){ } ta.remove();
  }
}
// Open a shared session as a permalink: render its answer (or whole conversation thread).
async function loadSharedSession(id){
  out.innerHTML = `<div class="status">Loading shared answer…</div>`;
  try{
    const r = await fetch("/sessions/"+encodeURIComponent(id));
    if(!r.ok) throw new Error("not found");
    const row = await r.json();
    CURRENT_Q = row.question;
    const thread = row.thread || [];
    if(CONV_ENABLED && thread.length){          // resume the shared conversation (continuable)
      THREAD = {session_id:id, turns:thread.slice()};
      q.value=""; q.style.height="auto"; q.setAttribute("placeholder","Ask a follow-up…");
      renderThread(); loadSuggestions();
    } else {
      q.value = row.question; autoGrow();
      render(row, out);
    }
    window.scrollTo({top:0});
  }catch(e){
    out.innerHTML = `<div class="empty">That shared answer is no longer available.</div>`;
  }
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function generateVideo(root){
  if(!LAST) return;
  root = root || document;
  const panel = root.querySelector("#vid");
  const btn = root.querySelector("#vgo");
  const hint = panel.querySelector("#vhint") || panel.querySelector(".vhint");
  const prevLabel = btn.textContent;
  btn.disabled = true; btn.textContent = "Generating…";
  hint.textContent = "Storyboarding, narrating, and assembling the briefing… (~2 min)";
  try{
    const r = await fetch("/video/generate",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify(LAST)});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || `HTTP ${r.status}`);
    const {job_id} = await r.json();
    for(let i=0;i<120;i++){                 // poll up to ~4 min
      await sleep(2000);
      const s = await (await fetch("/video/status/"+job_id)).json();
      if(s.status==="done"){
        hint.textContent = "🎬 "+(s.title||"Briefing video")+" · "+Math.round(s.duration_sec)+"s";
        panel.querySelectorAll("video").forEach(v=>v.remove());     // replace any existing
        const v = document.createElement("video");
        v.controls = true; v.preload = "metadata"; v.src = "/video/file/"+encodeURIComponent(s.filename);
        btn.insertAdjacentElement("beforebegin", v);                // video sits just above the button
        btn.disabled = false; btn.textContent = "↻ Regenerate briefing video";
        return;
      }
      if(s.status==="error") throw new Error(s.error||"generation failed");
    }
    throw new Error("timed out waiting for the video");
  }catch(e){
    btn.disabled = false; btn.textContent = prevLabel.includes("Regenerate") ? "↻ Regenerate briefing video" : "▶ Generate briefing video";
    hint.textContent = "Couldn't generate the video: "+(e.message||e);
  }
}

// ---- live agent trace (SSE) ----
function traceLine(ev){
  if(ev.type==="step")      return `<div class="tstep">▸ Step ${ev.step}</div>`;
  if(ev.type==="search")    return `<div class="tstep">🔎 Searching <span class="tq">${esc(ev.query||"")}</span>${(ev.variants&&ev.variants.length)?` <span class="tvar">+${ev.variants.length} reformulations</span>`:""}</div>`;
  if(ev.type==="found")     return `<div class="tstep">📥 Found <b>${ev.total}</b> passage${ev.total===1?"":"s"}${(ev.sources&&ev.sources.length)?` <span class="tvar">${ev.sources.map(esc).join(" · ")}</span>`:""}</div>`;
  if(ev.type==="verifying") return `<div class="tstep">🔬 Verifying evidence…</div>`;
  if(ev.type==="verified")  return `<div class="tstep">✓ Verified <b>${ev.verified}</b> finding${ev.verified===1?"":"s"}${ev.rejected?` <span class="tvar">${ev.rejected} rejected</span>`:""}</div>`;
  if(ev.type==="composing") return `<div class="tstep">✍️ Composing answer from <b>${ev.findings}</b> finding${ev.findings===1?"":"s"}…</div>`;
  return "";
}
function pushTrace(tc, ev){
  if(!tc) return;
  const html = traceLine(ev); if(!html) return;
  tc.querySelectorAll(".tlive").forEach(e=>e.classList.remove("tlive"));
  tc.insertAdjacentHTML("beforeend", html);
  tc.lastElementChild.classList.add("tlive");
  tc.lastElementChild.scrollIntoView({behavior:"smooth", block:"nearest"});
}
// Stream /research/stream, calling onEvent(ev) for each progress event; returns the final result.
async function streamResearch(payload, onEvent, signal){
  const resp = await fetch("/research/stream",{method:"POST",
    headers:{"content-type":"application/json"}, body:JSON.stringify(payload), signal});
  if(!resp.ok || !resp.body) throw new Error("HTTP "+resp.status);
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = "";
  while(true){
    const {value, done} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf("\n\n")) >= 0){
      const frame = buf.slice(0, i); buf = buf.slice(i+2);
      const dl = frame.split("\n").find(l=>l.startsWith("data:"));
      if(!dl) continue;                         // ": ping" keepalive / comment
      const ev = JSON.parse(dl.slice(5).trim());
      if(ev.type==="final") return ev.result;
      if(ev.type==="error") throw new Error(ev.detail || "stream error");
      onEvent(ev);
    }
  }
  throw new Error("stream ended without a final answer");
}

// The one path for asking. In CONVERSATION mode it appends a turn to the running thread (carrying
// prior turns as context + the thread id); otherwise it renders a single answer (unchanged).
async function askQuestion(question){
  if(ATTACHMENTS.length && !($("#consent")||{}).checked){
    const c = $("#consent"); if(c){ c.focus(); c.parentElement.style.color = "var(--gap)"; }
    return;
  }
  CURRENT_Q = question;
  const conv = CONV_ENABLED;
  const payload = {question, tenant_id:"demo", sources: chosen()};
  if(ATTACHMENTS.length) payload.attachments = ATTACHMENTS.slice();
  if(USER){ payload.user_name = USER.name; payload.user_email = USER.email; }
  if(conv){
    if(THREAD.turns.length) payload.history = threadHistoryPayload();
    if(THREAD.session_id) payload.session_id = THREAD.session_id;
  }
  const body = JSON.stringify(payload);
  go.disabled = true; go.classList.add("loading");
  const sg = out.querySelector("#suggest"); if(sg) sg.remove();
  if(conv){
    // Show the question IMMEDIATELY as a pending turn — it never vanishes during the wait.
    q.value = ""; q.style.height = "auto";
    THREAD.turns.push({question, _pending:true});
    renderThread();
  } else {
    out.innerHTML = STREAM_ENABLED
      ? `<div class="agenttrace"><div class="tstep tlive">Starting…</div></div>`
      : `<div class="status">Searching sources and verifying evidence…</div>`;
  }
  // finishTurn REPLACES the pending turn with the real (or error) result.
  const finishTurn = (data) => { THREAD.session_id = data.session_id || THREAD.session_id;
    THREAD.turns[THREAD.turns.length-1] = data; renderThread(); loadSuggestions(); };
  const errTurn = (note) => ({question, answer:"", grounded:false, claims:[],
    coverage_gaps:[], source_stats:{}, _note:note});
  const traceEl = () => conv ? out.querySelector(".turn:last-child .agenttrace") : out.querySelector(".agenttrace");
  const ctrl = new AbortController();
  // streaming keeps the connection alive with progress → a generous safety cap; else the hard 120s.
  const timer = setTimeout(()=>ctrl.abort(), STREAM_ENABLED ? 300000 : 120000);
  const evidenceFallback = async (note) => {             // single-mode: ranked evidence + gap-fill
    try{
      const s = await fetch("/search",{method:"POST",headers:{"content-type":"application/json"},body});
      if(s.ok){ renderEvidence(await s.json(), note); appendGapFallback(question); return true; }
    }catch(_){}
    return false;
  };
  try{
    if(STREAM_ENABLED){                                   // live agent trace → final answer
      const data = await streamResearch(payload, ev=>pushTrace(traceEl(), ev), ctrl.signal);
      clearTimeout(timer); ATTACHMENTS=[]; renderAttachments();
      if(conv) finishTurn(data); else render(data);
      return;
    }
    const resp = await fetch("/research",{method:"POST",headers:{"content-type":"application/json"},body,signal:ctrl.signal});
    clearTimeout(timer);
    if(resp.ok){ const data = await resp.json(); ATTACHMENTS=[]; renderAttachments();
      if(conv) finishTurn(data); else render(data); return; }
    const detail = (await resp.json().catch(()=>({}))).detail || `HTTP ${resp.status}`;
    if(conv){ finishTurn(errTurn(detail)); return; }
    if(resp.status===503 || resp.status===502){
      out.innerHTML = `<div class="status">Answer model unavailable — retrieving evidence…</div>`;
      if(await evidenceFallback("Answer synthesis is unavailable ("+detail.replace(/\.$/,'')+"). Showing ranked evidence — and you can queue more sources below.")) return;
    }
    out.innerHTML = `<div class="empty">${esc(detail)}</div>`;
    appendGapFallback(question);
  }catch(err){
    clearTimeout(timer);
    const timedOut = err && err.name === "AbortError";
    if(conv){ finishTurn(errTurn(timedOut
        ? "The full answer timed out — try a narrower follow-up, or fill the gaps below."
        : "Couldn't reach the research service.")); return; }
    if(await evidenceFallback(timedOut
        ? "The full answer timed out for this question. Showing ranked evidence — and you can queue high-quality sources below to fill the gap."
        : "Showing ranked evidence from your sources.")) return;
    out.innerHTML = `<div class="empty">${timedOut?"No evidence in the corpus answers this question yet.":"Couldn't reach the research service. Is the server running?"}</div>`;
    appendGapFallback(question);
  }finally{
    go.disabled = false; go.classList.remove("loading");
    if(conv) q.setAttribute("placeholder", "Ask a follow-up…");
  }
}
// Append the reusable fill-the-gaps panel to the main view (degraded/no-evidence paths).
function appendGapFallback(question){
  if(!GAP_ENABLED) return;
  out.insertAdjacentHTML("beforeend", gapPanelMarkup(true));   // fallback = under-evidenced
  wireGap(out, {question, answer:"", coverage_gaps:[]});
}

function renderThread(){
  out.innerHTML = "";
  if(THREAD.session_id){                          // one shareable link + reset, per thread
    const bar = document.createElement("div"); bar.className = "threadbar";
    bar.innerHTML = `<span class="threadlbl">Conversation · ${THREAD.turns.length} turn${THREAD.turns.length===1?"":"s"}</span>

    qh.innerHTML = `<span class="turn-qmark">Q${i+1}</span><div class="turn-qtext">${esc(t.question||"")}</div>`;
    block.appendChild(qh);

async function loadSuggestions(){
  if(!SUGGEST_ENABLED || !THREAD.turns.length) return;
  const last = THREAD.turns[THREAD.turns.length-1];
  const holder = document.createElement("div"); holder.className = "suggest"; holder.id = "suggest";
  holder.innerHTML = `<div class="suggest-h">◇ Go deeper</div><div class="suggest-loading">Finding good next questions…</div>`;
  out.appendChild(holder);
  try{
    const r = await fetch("/suggest",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({question:last.question, answer:last.answer||"", history:threadHistoryPayload()})});
    if(!r.ok) throw new Error();
    const {suggestions} = await r.json();
    if(!suggestions || !suggestions.length){ holder.remove(); return; }
    holder.innerHTML = `<div class="suggest-h">◇ Go deeper</div><div class="suggest-chips">` +
      suggestions.map(s=>`<button type="button" class="chip-q">${esc(s)}</button>`).join("") + `</div>`;
    holder.querySelectorAll(".chip-q").forEach(b=>b.addEventListener("click",()=>askQuestion(b.textContent.trim())));
  }catch(e){ holder.remove(); }
}

  const name = $("#idname").value.trim(), email = $("#idemail").value.trim();
  if(name.length < 2){ $("#iderr").textContent = "Please enter your name."; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $("#iderr").textContent = "Please enter a valid email."; return; }
  USER = {name, email}; localStorage.setItem("noesis_user", JSON.stringify(USER));
  $("#idmodal").hidden = true;
});
$("#idmodal").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#idgo").click(); });

initIdentity();
function routeHash(){    // #s/<id> → open a shared answer/thread; #sessions → the panel
  const m = location.hash.match(/^#s\/(.+)$/);
  if(m){ loadSharedSession(decodeURIComponent(m[1])); }
  else if(location.hash === "#sessions"){ openSessions(); }
}
// route only AFTER config loads, so CONV_ENABLED is known (shared threads render as conversations)
loadConfig().then(routeHash);
// pasted link / back-forward within the tab (our own writes use replaceState → no event)
window.addEventListener("hashchange", ()=>{
  const m = location.hash.match(/^#s\/(.+)$/);
  if(m) loadSharedSession(decodeURIComponent(m[1]));
});
</script>
</body>
</html>
