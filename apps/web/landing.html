<title>Noesis — a specialist panel for the case in front of you</title>
<meta name="description" content="Noesis convenes specialist lenses over guidelines, trials, drug labels and adverse-event reports, and shows what each discipline finds — with the verbatim source behind every line, and the gaps named." />
<meta property="og:title" content="Noesis" />
<meta property="og:description" content="A specialist panel over the evidence — what each discipline finds, where they disagree, and what nobody has established." />
<meta property="og:type" content="website" />

<!-- ═══════════════════════════════════════════════════════════════════════════════════════════
     PRODUCT LANDING — the public front door. "/" is this page; the platform itself is "/app".
     ───────────────────────────────────────────────────────────────────────────────────────────
     Split the way the codebase is split: the MECHANICS at the bottom carry no domain vocabulary,
     and every medical word lives in the SITE object in the block marked CONFIG.

     DESIGN NOTE — the page has exactly one memorable element: the BOARD in the hero, which
     convenes several specialist lenses on one case, gives each its own finding and evidence tier,
     and ends on what is NOT established. That is the product's whole thesis (a panel, grounded,
     honest about its gaps), so it gets the screen and everything else stays quiet. Deliberately
     avoided: a feature-card grid, oversized step numerals, tick-circle lists, an all-caps label
     above every heading, and an arrow glued to every button.

     PALETTE — token VALUES are copied verbatim from index.html so a reader moving between / and
     /app sees one continuous product: gold/blue accent, green = verified, amber = gap.
     ═══════════════════════════════════════════════════════════════════════════════════════════ -->

<script>
/* Theme is shared with the platform shell under the same "noesis-theme" key, with the same three
   values and the SAME default (clinical light for a first-time visitor). Applied here in <head> so
   the page paints in the right theme instead of flashing. Keep in sync with index.html. */
(function(){
  try{
    var saved = localStorage.getItem("noesis-theme");
    if(saved === "dark" || saved === "editorial") document.documentElement.setAttribute("data-theme", saved);
  }catch(e){}
})();
/* MIGRATION — the shell used to live at "/". Existing share links (#s/…, #p/…, #share/…) and deep
   links land here with a dangling hash; send them on to /app so no shared answer 404s socially. */
(function(){
  try{
    var h = location.hash || "";
    if(/^#(s|p|share)\//.test(h) || /^#(panel|voices|triage|cases)\b/.test(h)){
      location.replace("/app" + h);
    }
  }catch(e){}
})();
</script>

<style>

    transition:background .15s ease;}

  .themebtn{min-height:40px;padding:.3rem .6rem;border-radius:6px;cursor:pointer;

  .cite{display:inline-block;margin-top:.3rem;font-family:var(--mono);font-size:.65rem;

    border:1px solid var(--hair-soft);}
  .cite.top{color:var(--verified);background:var(--verified-bg);border-color:transparent;}
  .cite.weak{color:var(--gap);background:var(--gap-bg);border-color:transparent;}
  .boardGap{padding:.72rem 1.05rem;border-top:1px solid var(--hair);background:var(--gap-bg);
    font-size:.85rem;color:var(--ink);}
  .boardGap b{color:var(--gap);font-weight:600;}
  .boardFoot{padding:.5rem 1.05rem .65rem;border-top:1px solid var(--hair);
    font-size:.72rem;color:var(--muted);background:var(--panel2);}

    .shapeRow,.srcRow{grid-template-columns:1fr;gap:.45rem;}

    .roles .role:nth-child(2){border-top:1px solid var(--hair);}
    .roles .role:nth-child(odd){border-right:0;}
    .vsRow{grid-template-columns:minmax(0,1fr) 4.4rem 4.4rem;}

    .footin .sp{margin-left:0;}
  }
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *{transition:none!important} }
</style>

      { h: "Describe it the way you'd say it out loud", p: "A patient, a situation, or a bare factual question. No syntax, no filters, no structured form. Dictation works if your hands are busy." },
      { h: "Noesis asks only what would change the evidence", p: "Age, comorbidities, current drugs — but only when that detail would actually change what gets retrieved or how safety is handled. It does not interrogate you for a tidy record." },

  roster: {

    lede: "Each specialist is a different reading of the same corpus — its own system prompt and, more importantly, its own retrieval focus, so it genuinely surfaces different evidence rather than rewording the same passage. Triage picks the ones this case needs and names why.",
    coreLabel: "Always on — the methodology backbone",
    core: ["Clinical Pharmacology", "Evidence-Based Medicine", "Primary Care / Internal Medicine"],
    specLabel: "Convened when the case calls for them",
    specialties: [
      "Pediatrics","Obstetrics & Gynecology","Cardiology","Psychiatry / Mental Health","Dermatology",
      "Orthopedics / Musculoskeletal","Gastroenterology","Endocrinology","Infectious Disease","Nephrology",
      "Pulmonology","Neurology","Oncology","Rheumatology","Hematology","Urology","Ophthalmology",
      "Otolaryngology (ENT)","Allergy & Immunology","Geriatrics","Emergency & Critical Care","General Surgery",
      "Palliative Care","Radiology / Imaging","Clinical Nutrition","Pain Medicine & Anesthesiology",
      "Rehabilitation Medicine (PM&R)","Sleep Medicine","Medical Toxicology","Clinical Genetics",
      "Transplant Medicine","Addiction Medicine","Obesity & Lifestyle Medicine","Oral Health / Dental Medicine",
      "Vascular Medicine & Surgery","Neurosurgery","Sports Medicine","Preventive & Travel Medicine",
      "Integrative & Complementary Medicine","Acupuncture & Acupressure","Ayurveda",
    ],
  },

  shape: {
    title: "It reads like a note, not a chat reply.",
    lede: "One fixed structure, every time — and a section appears only when the retrieved evidence actually supports it. Nothing is written to fill a heading.",
    rows: [
      { n: "Bottom line", w: "One or two sentences that answer the question, each carrying its citation." },
      { n: "Efficacy", w: "What the evidence shows about outcomes — as a table when the findings genuinely compare." },
      { n: "Safety", w: "Reported adverse effects and risks, short-term separated from long-term where the evidence does." },
      { n: "Population", w: "Which patients the evidence actually covers — and which it explicitly does not." },
      { n: "Evidence quality", w: "What it relied on, placed on the pyramid: guideline and systematic review above trial, above observational, above case report." },
      { n: "Not addressed", w: "What you asked that the evidence does not cover. Stated as a gap, never filled with an inference.", last: true },
    ],
  },

  sources: {
    title: "Read against the record, not the open web.",
    note: "Everything downloadable is held and indexed here, so retrieval is ours to rank and tier. The live web is used only for what genuinely changes by the hour. Papers that have been retracted are detected from the publisher's own declaration and excluded from grounding.",
    rows: [
      { name: "Practice guidelines", sub: "controlling for practice", feeds: ["Global guideline set", "India guideline set"] },
      { name: "Primary literature", sub: "systematic reviews, trials, cohorts", feeds: ["Europe PMC"] },
      { name: "Trial registry", sub: "designed-to-test vs found, kept apart", feeds: ["ClinicalTrials.gov"] },
      { name: "Drug labels", sub: "dosing, interactions, contraindications", feeds: ["DailyMed", "openFDA"] },
      { name: "Drug nomenclature", sub: "brand, generic and ingredient resolution", feeds: ["RxNorm"] },
      { name: "Public health", sub: "surveillance and population guidance", feeds: ["CDC"] },
      { name: "Post-market signal", sub: "reported, not proven — labeled as signal", signal: true, feeds: ["FAERS"] },
    ],
  },

  roles: {
    title: "What it changes, by who's holding the case.",
    items: [
      { b: "The attending", s: "The multi-system case gets read by every relevant discipline at once, instead of waiting on three curbside consults that may not come back today." },
      { b: "The resident", s: "The structure of a good clinical question, learned by watching it get built — and an answer whose evidence tier is stated, not assumed." },
      { b: "The pharmacist", s: "Interaction and dose-adjustment evidence pulled from the labels themselves, with the verbatim sentence attached for the note." },
      { b: "The nurse, NP or PA", s: "A plain restatement of what the evidence does and doesn't establish, in language that survives being repeated to a family." },
      { b: "The MDT or tumor board", s: "A grounded pre-read before the meeting, so the discussion starts at the disagreement rather than at the literature search." },
      { b: "Anyone on call at 3am", s: "The specialist you would have paged, available now — and honest when the literature can't answer the question you actually have." },
    ],
  },

  compare: {
    title: "Built to be checked.",
    us: "Noesis", them: "General AI chat",
    rows: [
      { q: "Every sentence carries a verbatim quote from a source document", us: true, them: false },
      { q: "Several specialist lenses read the same case independently", us: true, them: false },
      { q: "Evidence tier stated — guideline, trial, cohort, case report", us: true, them: false },
      { q: "Retracted papers detected and excluded from grounding", us: true, them: false },
      { q: "Names what the evidence does not establish", us: true, them: false },
      { q: "Answers instantly, on any topic", us: true, them: true },
    ],
  },

  guards: {
    title: "The discipline underneath.",
    facts: [
      "<b>No claim without a quote.</b> Every factual sentence is span-checked against the source text it cites. A sentence that cannot bind to a verbatim quote does not make it into the answer.",
      "<b>Designed-to-test is not found.</b> A trial registration describes intent; results describe what happened. The two are read and labeled separately.",
      "<b>Reported is not proven.</b> Adverse-event reports are a signal, shown as a signal — never promoted to established fact.",
      "<b>Retractions are enforced, not noted.</b> Publisher-declared retractions are detected structurally and those passages are removed from the grounding pool.",
      "<b>A gap is a finding.</b> Where the evidence isn't there you get a stated gap, not a confident guess.",
    ],
    disclaim: "<b>Noesis is research support for clinicians, not a diagnostic device and not medical advice.</b> It retrieves, appraises and cites published evidence. It does not diagnose a patient, interpret findings, or recommend treatment for an individual — the clinical judgment stays with the clinician, and every line is traceable to the document it came from precisely so that judgment can be exercised.",
  },

  about: {
    title: "Why we built this.",
    pull: "The evidence that answers the question usually exists. It's in a guideline, a label and a review that nobody has time to read at once.",
    facts: [
      "<b>Primary sources only.</b> No answer is assembled from a summary of a summary.",
      "<b>The pyramid is respected.</b> A guideline and a systematic review outrank a single trial, and the answer says which it relied on.",
      "<b>Explicit about the unknown.</b> A gap is reported as a gap. That is the most clinically useful thing a research tool can say.",
    ],
    more: { label: "About us and who builds it", href: "/about" },

/* ═══ MECHANICS — domain-free. ═══ */
(function(){
  const el = (id) => document.getElementById(id);
  const h  = (s) => (s == null ? "" : String(s));
  const B  = SITE.brand;

  el("brandmark").innerHTML =
    `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
       <symbol id="brand-mark" viewBox="${h(B.markViewBox)}">${B.markSvg}</symbol></svg>`;

  el("topbar").innerHTML = `
    <a href="/" aria-label="${h(B.name)} home" style="display:flex;text-decoration:none">
      <svg class="logo" viewBox="${h(B.markViewBox)}" role="img" aria-label="${h(B.name)}"><use href="#brand-mark"/></svg></a>
    <nav class="nav">${(B.nav||[]).map(n=>`<a href="${h(n.href)}">${h(n.label)}</a>`).join("")}</nav>
    <span class="topcta" id="topcta"><a class="btn" href="${h(B.appHref)}">${h(B.appLabel)}</a></span>
    <button type="button" class="themebtn" id="themebtn" aria-label="Switch colour theme">Light</button>`;

  const boardBody = (c) => `
    <div class="convened">
      <div class="convHead">${h(SITE.board.convenedLabel)}</div>
      <div class="chips">${c.convened.map(s=>`<span class="chip">${h(s)}</span>`).join("")}</div>
    </div>
    <div class="findings">
      ${c.rows.map(r=>`<div class="find">
        <div class="findWho">${h(r.who)}</div>
        <div class="findWhat">${h(r.what)}<br><span class="cite ${h(r.k)}">${h(r.c)}</span></div>
      </div>`).join("")}
    </div>
    <div class="boardGap"><b>${h(SITE.board.gapLabel)}</b> ${h(c.gap)}</div>
    <div class="boardFoot">${h(SITE.board.foot)}</div>`;

  const heroHtml = () => {
    const H = SITE.hero, D = SITE.board;
    return `<section class="hero"><div class="wrap"><div class="heroGrid">
      <div>
        <h1>${h(H.title).replace(/\n/g,"<br>")}</h1>
        <p class="lede">${h(H.lede)}</p>
        <div class="heroActs">
          <a class="btn" href="${h(B.appHref)}">${h(B.askLabel)}</a>
          ${H.secondary ? `<a class="btn quiet" href="${h(H.secondary.href)}">${h(H.secondary.label)}</a>` : ""}
        </div>
      </div>
      <div class="board" id="board">
        <div class="boardTabs" role="tablist" aria-label="Example cases">
          ${D.cases.map((c,i)=>`<button class="btab" role="tab" aria-selected="${i===0}" data-i="${i}">${h(c.tab)}</button>`).join("")}
        </div>
        <div>
          <div class="boardQ">${h(D.cases[0].q)}</div>
          <div id="boardBody">${boardBody(D.cases[0])}</div>
        </div>
      </div>
    </div></div></section>`;
  };

  const guidedHtml = () => { const G = SITE.guided; if(!G) return "";
    return `<section id="guided"><div class="wrap"><h2>${h(G.title)}</h2>
      <p class="lede" style="margin-bottom:1.5rem">${h(G.lede)}</p>
      <div class="flow">${G.steps.map(s=>`<div class="fcell"><h3>${h(s.h)}</h3><p>${h(s.p)}</p></div>`).join("")}</div>
      ${G.note?`<p class="note" style="margin-top:1rem">${h(G.note)}</p>`:""}
    </div></section>`; };

  const rosterHtml = () => { const R = SITE.roster; if(!R) return "";
    return `<section><div class="wrap"><h2>${h(R.title)}</h2>
      <p class="lede" style="margin-bottom:1.5rem">${h(R.lede)}</p>
      <div class="roster">
        <p class="rosterHead">${h(R.coreLabel)}</p>
        <div class="chips">${R.core.map(s=>`<span class="chip core">${h(s)}</span>`).join("")}</div>
        <p class="rosterHead">${h(R.specLabel)}</p>
        <div class="chips">${R.specialties.map(s=>`<span class="chip spec">${h(s)}</span>`).join("")}</div>
      </div>
    </div></section>`; };

  const shapeHtml = () => { const S = SITE.shape; if(!S) return "";
    return `<section><div class="wrap"><h2>${h(S.title)}</h2>
      <p class="lede" style="margin-bottom:1.5rem">${h(S.lede)}</p>
      <div class="shape">${S.rows.map(r=>`<div class="shapeRow${r.last?" last":""}">
        <div class="shapeName">${h(r.n)}</div><div class="shapeWhat">${h(r.w)}</div></div>`).join("")}</div>
    </div></section>`; };

  const sourcesHtml = () => { const S = SITE.sources; if(!S) return "";
    return `<section id="sources"><div class="wrap"><h2>${h(S.title)}</h2>
      <div class="srcTable">${S.rows.map(r=>`
        <div class="srcRow${r.signal?" sig":""}">
          <div class="srcName">${h(r.name)}<small>${h(r.sub)}</small></div>
          <div class="feeds">${r.feeds.map(f=>`<span class="feed">${h(f)}</span>`).join("")}</div>
        </div>`).join("")}</div>
      ${S.note?`<p class="note" style="margin-top:1rem">${h(S.note)}</p>`:""}
    </div></section>`; };

  const rolesHtml = () => { const R = SITE.roles; if(!R) return "";
    return `<section><div class="wrap"><h2>${h(R.title)}</h2>
      <div class="roles">${R.items.map(i=>`<div class="role"><b>${h(i.b)}</b><span>${h(i.s)}</span></div>`).join("")}</div>
    </div></section>`; };

  const compareHtml = () => { const C = SITE.compare; if(!C) return "";
    const mark = (v) => v ? `<span class="yes">Yes</span>` : `<span class="no">No</span>`;
    return `<section><div class="wrap"><h2>${h(C.title)}</h2>
      <div class="vs">
        <div class="vsRow head"><div class="vsQ"></div><div class="c">${h(C.us)}</div><div class="c">${h(C.them)}</div></div>
        ${C.rows.map(r=>`<div class="vsRow"><div class="vsQ">${h(r.q)}</div>
          <div class="c">${mark(r.us)}</div><div class="c">${mark(r.them)}</div></div>`).join("")}
      </div>
    </div></section>`; };

  const guardsHtml = () => { const G = SITE.guards; if(!G) return "";
    return `<section><div class="wrap"><h2>${h(G.title)}</h2>
      <ul class="facts" style="max-width:44rem">${G.facts.map(f=>`<li>${f}</li>`).join("")}</ul>
      ${G.disclaim?`<p class="disclaim" style="margin-top:1.4rem">${G.disclaim}</p>`:""}
    </div></section>`; };

  const aboutHtml = () => { const A = SITE.about; if(!A) return "";
    return `<section id="about"><div class="wrap"><h2>${h(A.title)}</h2>
      <div class="aboutGrid">
        <p class="pull">${h(A.pull)}</p>
        <div><ul class="facts">${A.facts.map(f=>`<li>${f}</li>`).join("")}</ul>
        ${A.more?`<p style="margin:.5rem 0 0"><a class="moreLink" href="${h(A.more.href)}">${h(A.more.label)}</a></p>`:""}</div>
      </div></div></section>`; };

  const closeHtml = () => { const C = SITE.close; if(!C) return "";
    return `<section class="close"><div class="wrap">
      <h2>${h(C.title)}</h2><p class="lede">${h(C.lede)}</p>
      <div class="heroActs"><a class="btn" href="${h(B.appHref)}">${h(B.appLabel)}</a></div>
    </div></section>`; };

  el("main").innerHTML = heroHtml() + guidedHtml() + rosterHtml() + shapeHtml()
                       + sourcesHtml() + rolesHtml() + compareHtml() + guardsHtml()
                       + aboutHtml() + closeHtml();

  el("foot").innerHTML = `
    <span>&copy; <span id="yr"></span> ${h(B.name)}</span>
    <span class="sp"><a href="${h(B.appHref)}">Platform</a></span>
    <span><a href="/about">About</a></span>
    ${B.contact?`<span><a href="mailto:${h(B.contact)}">Contact</a></span>`:""}`;
  el("yr").textContent = new Date().getFullYear();

  const tabs = [...document.querySelectorAll(".btab")];
  const showCase = (i) => {
    const c = SITE.board.cases[i];
    document.querySelector(".boardQ").textContent = c.q;
    el("boardBody").innerHTML = boardBody(c);
    tabs.forEach((t,n) => t.setAttribute("aria-selected", String(n === i)));
  };
  tabs.forEach(t => {
    t.addEventListener("click", () => showCase(Number(t.dataset.i)));
    t.addEventListener("keydown", (e) => {
      const i = Number(t.dataset.i);
      if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
        e.preventDefault();
        const n = (i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
        tabs[n].focus(); showCase(n);
      }
    });
  });

  const sentinel = document.querySelector(".hero");
  const topcta = el("topcta");
  if(sentinel && "IntersectionObserver" in window){
    new IntersectionObserver(([e]) => topcta.classList.toggle("on", !e.isIntersecting),
      {rootMargin: "-70px 0px 0px 0px"}).observe(sentinel);
  } else { topcta.classList.add("on"); }

  /* Same cycle, order, key and labels as the platform shell: light -> dark -> editorial. */
  const ORDER = ["light","dark","editorial"];
  const NAMES = {light:"☀ Light", dark:"\u{1F319} Dark", editorial:"❡ Editorial"};
  const btn = el("themebtn");
  const current = () => document.documentElement.getAttribute("data-theme") || "light";
  const apply = (t) => {
    if(t === "light") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    try{ localStorage.setItem("noesis-theme", t); }catch(e){}
    btn.textContent = NAMES[t] || NAMES.light;
    btn.title = "Theme: " + (NAMES[t] || NAMES.light).slice(2) + " — click to switch";
  };
  apply(current());
  btn.addEventListener("click", () => apply(ORDER[(ORDER.indexOf(current()) + 1) % ORDER.length]));
})();
</script>
</body>
</html>
