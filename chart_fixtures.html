<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>chart fixtures</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"><style>
  /* ---- Noesis identity: deep navy canvas, gold brand accent, green = verified ---- */
  /* DEFAULT = CLINICAL LIGHT — the look familiar from clinical/EHR apps: cool-white surfaces, a
     trustworthy medical-blue accent, dark-slate text. Dark is opt-in via the bottom-left toggle. */
  :root{
    color-scheme:light;
    --bg:#EEF3F8; --panel:#FFFFFF; --panel2:#F4F8FC; --ink:#132430; --muted:#5A6B7B;
    --gold:#1568B5; --gold-strong:#0F5497; --gold-rgb:21,104,181; --verified:#137A54; --gap:#B26A1E;
    --on-accent:#FFFFFF; --on-accent-rgb:255,255,255;   /* white text on the blue accent */
    --hair:#D2DEEA; --hair-soft:rgba(19,36,48,.06);
    --hl-f:17,122,84; --hl-r:176,120,40; --hl-k:37,99,175;   /* darker tints stay legible on white */
    /* chart series colors — theme-tuned, validated (lightness band, chroma, CVD ΔE, contrast vs
       --panel2) so series stay tellable-apart in every theme; series 2-3 also carry a hatch texture */
    --chart1:#1568B5; --chart2:#137A54; --chart3:#A4581B;
    /* Add-Visuals node tones: soft tinted fill + saturated stroke, contrast-tuned on --panel2 */
    --vz0f:#E4EEFB; --vz0s:#2563C9; --vz1f:#DCF2E9; --vz1s:#12855C; --vz2f:#FBEAD6; --vz2s:#B4671A;
    --vz3f:#ECE5FB; --vz3s:#6D3FCF; --vz4f:#FBE3ED; --vz4s:#C42A6E; --vz5f:#DBF0F4; --vz5s:#0E7C93;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  /* DARK theme — the original branded look; opt-in. */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#060E1B; --panel:#0F1A2C; --panel2:#0C1524; --ink:#ECEBE3; --muted:#8B96A9;
    --gold:#D3B37C; --gold-strong:#E7CB93; --gold-rgb:211,179,124; --verified:#57B891; --gap:#D6975A;
    --on-accent:#1A1206; --on-accent-rgb:26,18,6;
    --hair:#22304A; --hair-soft:rgba(255,255,255,.06);
    --hl-f:87,184,145; --hl-r:211,179,124; --hl-k:110,160,224;
    --chart1:#BA852B; --chart2:#2E9268; --chart3:#B5622F;
    --vz0f:#12233E; --vz0s:#5F9BEE; --vz1f:#0F2A22; --vz1s:#4FC49A; --vz2f:#2E2114; --vz2s:#DB9B4F;
    --vz3f:#211A38; --vz3s:#AB8DF0; --vz4f:#301525; --vz4s:#ED6BA7; --vz5f:#0C2A30; --vz5s:#4FBAD0;
  }
  /* EDITORIAL theme — opt-in. Noesis's identity set on paper: warm parchment stock, umber ink,
     the brand gold deepened to an ink-gold that holds on paper, evidence-green kept. Serif
     display for headings (the existing --serif stack), mono eyebrows unchanged. Inspired by
     an editorial-record aesthetic — restraint over decoration — not a copy of any one look. */
  :root[data-theme="editorial"]{
    color-scheme:light;
    --bg:#F6F3EA; --panel:#FDFBF5; --panel2:#F0ECE0; --ink:#221D12; --muted:#6E6550;
    --gold:#8A6A1F; --gold-strong:#6E5314; --gold-rgb:138,106,31; --verified:#2E6B4F; --gap:#A05C24;
    --on-accent:#FDF8EA; --on-accent-rgb:253,248,234;
    --hair:#DCD4C0; --hair-soft:rgba(34,29,18,.06);
    --hl-f:46,107,79; --hl-r:138,106,31; --hl-k:63,94,150;
    --chart1:#9A6E0E; --chart2:#1F7A52; --chart3:#A85C1E;
    --vz0f:#E4EEFB; --vz0s:#2563C9; --vz1f:#DCF2E9; --vz1s:#12855C; --vz2f:#FBEAD6; --vz2s:#B4671A;
    --vz3f:#ECE5FB; --vz3s:#6D3FCF; --vz4f:#FBE3ED; --vz4s:#C42A6E; --vz5f:#DBF0F4; --vz5s:#0E7C93;
  }
  /* Editorial legibility for CLINICAL notation: Charter-first serif (screen-designed, LINING
     figures — Iowan/Palatino's old-style digits jar in doses and citation markers), lining +
     tabular numerals everywhere, and sub/superscripts (the [n] citation sups, chemical
     notation) set in the mono face so they stay crisp at small sizes. */
  :root[data-theme="editorial"]{
    --serif:"Charter","Bitstream Charter",Cambria,"Iowan Old Style",Georgia,serif;
  }
  :root[data-theme="editorial"] body{background-image:none;font-variant-numeric:lining-nums;}
  :root[data-theme="editorial"] h1, :root[data-theme="editorial"] h2,
  :root[data-theme="editorial"] h3{font-family:var(--serif);letter-spacing:-.012em;font-weight:600;
    font-variant-numeric:lining-nums;}
  :root[data-theme="editorial"] #heading{font-weight:500;letter-spacing:-.018em;}
  :root[data-theme="editorial"] sup, :root[data-theme="editorial"] sub{
    font-family:var(--mono);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em;}
  :root[data-theme="editorial"] .answer table, :root[data-theme="editorial"] .answer td,
  :root[data-theme="editorial"] .answer th{font-variant-numeric:tabular-nums lining-nums;}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;font-size:15px}   /* slightly smaller, more professional scale */
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    line-height:1.55;font-size:1rem;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 60% at 85% -10%, rgba(var(--gold-rgb),.06), transparent 60%);
    background-attachment:fixed;}
  .wrap{max-width:44rem;margin:0 auto;padding:1.5rem 1.15rem 5rem;}

  /* ---- masthead ---- */
  header{display:flex;align-items:center;gap:.8rem;padding:.1rem 0 1.3rem;flex-wrap:wrap;
    border-bottom:1px solid var(--hair);margin-bottom:1.9rem;}
  .logo{height:64px;width:auto;object-fit:contain;flex:none;}
  .vertical{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;
    letter-spacing:.14em;color:var(--gold);border:1px solid var(--hair);
    border-radius:999px;padding:.16rem .6rem;background:rgba(var(--gold-rgb),.06);}
  .histbtn{margin-left:auto;font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;
    cursor:pointer;background:transparent;border:1px solid var(--hair);border-radius:8px;
    padding:.34rem .7rem;color:var(--muted);text-transform:uppercase;}
  .histbtn:hover{color:var(--ink);border-color:var(--muted);}
  .newbtn{color:var(--gold);border-color:rgba(var(--gold-rgb),.5);}
  .newbtn:hover{color:var(--on-accent);background:var(--gold);border-color:var(--gold);}

  /* ---- hero + intake ---- */
  h1{font-family:var(--serif);font-size:2rem;line-height:1.14;letter-spacing:-.015em;
    font-weight:600;color:var(--ink);margin:.2rem 0 1.15rem;}
  form{display:flex;flex-direction:column;gap:.9rem;}
  .field{display:flex;align-items:flex-end;gap:.7rem;background:var(--panel);
    border:1px solid var(--hair);border-radius:16px;padding:.95rem 1rem 1rem 1.2rem;
    box-shadow:0 8px 30px -18px rgba(0,0,0,.6);transition:border-color .15s, box-shadow .15s;}
  .field:focus-within{border-color:rgba(var(--gold-rgb),.55);
    box-shadow:0 8px 30px -16px rgba(0,0,0,.7), 0 0 0 3px rgba(var(--gold-rgb),.14);}
  textarea{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.06rem;
    line-height:1.5;resize:none;outline:none;padding:.15rem 0;min-height:3.5rem;max-height:20rem;overflow-y:auto;}
  textarea::placeholder,input::placeholder{color:var(--muted);opacity:.62;}
  button.go{flex:none;width:44px;height:44px;border:0;border-radius:50%;cursor:pointer;
    background:var(--gold);color:var(--on-accent);display:grid;place-items:center;
    transition:transform .12s, background .15s;}
  button.go:hover{background:var(--gold-strong);transform:translateY(-1px);}
  button.go:disabled{opacity:.6;cursor:default;transform:none;}
  button.go svg{width:20px;height:20px;display:block;}
  button.go.loading svg{display:none;}
  button.go.loading::after{content:"";width:17px;height:17px;border-radius:50%;
    border:2px solid rgba(var(--on-accent-rgb),.35);border-top-color:var(--on-accent);animation:spin .7s linear infinite;}
  button.go:focus-visible,.pill:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  button.go.stopmode{cursor:pointer;}   /* while running, the Go button is a Stop button */
  .stopbtn{font-family:var(--mono);font-size:.7rem;color:var(--muted);background:transparent;
    border:1px solid var(--hair);border-radius:999px;padding:.28rem .72rem;cursor:pointer;
    margin-top:.75rem;transition:.12s;display:inline-flex;align-items:center;gap:.35rem;}
  .stopbtn:hover{border-color:var(--gap);color:var(--gap);}

  .sources{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;padding-left:.15rem;}
  .sources .lbl{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;
    letter-spacing:.1em;color:var(--muted);margin-right:.15rem;}
  .pill{font-family:var(--mono);font-size:.72rem;letter-spacing:.02em;cursor:pointer;
    border:1px solid var(--hair);background:transparent;color:var(--muted);
    border-radius:999px;padding:.22rem .7rem;user-select:none;transition:.12s;}
  .pill[aria-pressed="true"]{color:var(--on-accent);background:var(--gold);border-color:var(--gold);}

  /* effort dial — a labeled snap slider (Standard→Deeper→Deepest); scales how hard the agent
     works on a hard question. Distinct from the source pills so it's never read as a source key. */
  /* centered so Effort + Integrative sit on the same vertical axis as the mode bar above the box */
  .ctlbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.45rem 1.15rem;margin-top:.55rem;}
  .ctlbar[hidden]{display:none;}
  .ctlbar .effort,.ctlbar .audsel{margin:0;}
  .effort{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:.55rem 0 0;}
  .effort .lbl{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
  .effort .estep{display:inline-flex;align-items:center;gap:.55rem;}
  .effort .ebtn{width:1.6rem;height:1.6rem;border-radius:50%;border:1px solid var(--hair);background:var(--panel2);
    color:var(--ink);font-size:1rem;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    padding:0;transition:border-color .12s,color .12s;}
  .effort .ebtn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
  .effort .ebtn:disabled{opacity:.4;cursor:default;}
  .effort .ebtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .effort .eval{font-family:var(--mono);font-size:.72rem;color:var(--gold);white-space:nowrap;min-width:7rem;text-align:center;}
  .effort .ehint{flex-basis:100%;font-family:var(--mono);font-size:.63rem;color:var(--muted);opacity:.85;}
  .effort[data-tier="1"] .eval{color:var(--muted);}
  /* effort on a saved turn: a small gold badge + a retry-deeper affordance */
  .efbadge{display:inline-block;font-family:var(--mono);font-size:.64rem;letter-spacing:.03em;color:var(--gold);
    border:1px solid var(--gold);border-radius:999px;padding:.05rem .5rem;vertical-align:middle;margin-left:.4rem;}
  .retrydeep{font-family:var(--mono);font-size:.68rem;color:var(--gold);background:transparent;border:1px solid var(--gold);
    border-radius:999px;padding:.22rem .7rem;cursor:pointer;transition:.12s;margin-top:.9rem;}
  .retrydeep:hover{background:var(--gold);color:var(--on-accent);}
  .retrydeep[disabled]{opacity:.5;cursor:default;}
  .retrydeep-top{margin:0 0 1rem;}   /* at the TOP, above the answer */
  /* Diagnostics box — collapsed provenance/observability meta at the bottom of an answer */
  /* diagnostics — a SOFT left-highlighted box (lower-priority meta: muted accent, no fill) matching
     the other bottom boxes; collapsed, summary = header + hint. */
  .diagbox{margin:0;border:1px solid var(--hair);border-left:3px solid var(--hair);border-radius:12px;
    background:transparent;overflow:hidden;}
  .diagbox>summary{list-style:none;cursor:pointer;padding:.75rem 1rem;transition:background .15s;}
  .diagbox>summary::-webkit-details-marker{display:none;}
  .diagbox>summary:hover{background:var(--hair-soft);}
  .diaghead{display:flex;align-items:center;font-family:var(--mono);font-size:.64rem;text-transform:uppercase;
    letter-spacing:.11em;color:var(--muted);}
  .diaghint{font-size:.78rem;color:var(--muted);margin-top:.4rem;line-height:1.5;opacity:.9;}
  .diagbox .diagbody{padding:.2rem 1rem .9rem;display:flex;flex-direction:column;gap:.3rem;}
  .diagbox .diagbody .ansmeta{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;}
  /* troubleshooting trace (flag) — turns, tool-call chips, funnel, failures */
  .diagtrace{margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--hair-soft);display:flex;flex-direction:column;gap:.55rem;}
  .dgrow{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;}
  .dglbl{flex:0 0 3.6rem;font-family:var(--mono);font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
  .dglbl.bad{color:var(--gap);}
  .dgfunnel{font-family:var(--mono);font-size:.72rem;color:var(--muted);line-height:1.5;}
  .dgfunnel .ok{color:var(--verified);} .dgfunnel .bad{color:var(--gap);}
  .dgchips{display:flex;flex-wrap:wrap;gap:.35rem;}
  .dgchip{font-family:var(--mono);font-size:.62rem;color:var(--muted);background:var(--hair-soft);
    border-radius:6px;padding:.14rem .45rem;} .dgchip b{color:var(--ink);font-weight:700;}
  .dgchip.warn{background:rgba(178,106,30,.14);color:var(--gap);} .dgchip.warn b{color:var(--gap);}
  .dgturns{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.28rem;flex:1 1 100%;}
  .dgturns li{font-family:var(--mono);font-size:.68rem;color:var(--muted);line-height:1.45;
    padding-left:.6rem;border-left:2px solid var(--hair);}
  .dgt-a{font-weight:700;text-transform:uppercase;font-size:.58rem;letter-spacing:.04em;padding:.05rem .3rem;border-radius:4px;}
  .dgt-a.search{color:var(--gold);background:rgba(var(--gold-rgb),.1);}
  .dgt-a.answer{color:var(--verified);background:rgba(19,122,84,.12);}
  .dgt-q{color:var(--ink);} .dgt-v{opacity:.8;} .dgt-r{opacity:.85;}
  .dgt-a.answer + .dgt-r .ok{color:var(--verified);}
  .dgt-f{color:var(--gap);font-size:.58rem;text-transform:uppercase;letter-spacing:.03em;}
  .dgfails{margin:0;padding:0 0 0 1rem;font-family:var(--mono);font-size:.66rem;color:var(--gap);line-height:1.5;flex:1 1 100%;}

  /* audience switch — a two-segment control that reads as "who the answer is FOR", distinct from
     the effort dial next to it (words, not a slider). */
  .audsel{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.55rem 0 0;}
  .audsel .lbl{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
  .audsel .seg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden;}
  .audsel .segbtn{font-family:var(--mono);font-size:.72rem;letter-spacing:.02em;cursor:pointer;border:0;
    background:transparent;color:var(--muted);padding:.24rem .8rem;transition:.12s;}
  .audsel .segbtn[aria-pressed="true"]{background:var(--gold);color:var(--on-accent);}
  .audsel .segbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .audsel .ahint{flex-basis:100%;font-family:var(--mono);font-size:.63rem;color:var(--muted);opacity:.85;}
  /* Mode switch — Quick Q&A ⇄ Specialist Panel (one segmented control, shared look in both views) */
  .modeswitch{display:none;justify-content:center;margin:.15rem 0 1.15rem;}
  .modeswitch.on{display:flex;}
  /* engaging sub-line under the heading (answer-style modes) */
  .hsub{text-align:center;margin:-.35rem 0 1rem;color:var(--muted);font-size:.9rem;max-width:38rem;
        margin-left:auto;margin-right:auto;line-height:1.4;}
  body.chatting .hsub,body.triage-live .hsub{display:none;}
  /* compact answer-style switch — right-aligned in the control bar, distinct from the top mode tabs */
  .ctlbar .dmodesel{margin:0 0 0 auto;}
  .dmodesel .lbl{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
  .modeseg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden;background:var(--panel2);}
  .modeseg .mbtn{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;cursor:pointer;border:0;white-space:nowrap;
    background:transparent;color:var(--muted);padding:.34rem 1.05rem;transition:.12s;display:inline-flex;align-items:center;gap:.35rem;}
  .modeseg .mbtn[aria-selected="true"]{background:var(--gold);color:var(--on-accent);}
  .modeseg .mbtn:hover:not([aria-selected="true"]){color:var(--ink);}
  .modeseg .mbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  /* therapy-modality toggle (Modern Medicine | Alternative) */
  .modsel{margin-left:.4rem;}
  .modsel .modbtn{font-family:var(--mono);font-size:.7rem;letter-spacing:.03em;cursor:pointer;border:0;white-space:nowrap;
    background:transparent;color:var(--muted);padding:.32rem .95rem;transition:.12s;display:inline-flex;align-items:center;gap:.32rem;}
  .modsel .modbtn.on{background:var(--gold);color:var(--on-accent);}
  .modsel .modbtn:hover:not(.on){color:var(--ink);}
  .modsel .modbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  body.altmode .modsel{border-color:rgba(var(--gold-rgb),.6);}
  /* audience badge on a saved session (row + detail) */
  .audbadge{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.03em;
    border:1px solid var(--hair);border-radius:999px;padding:.05rem .5rem;vertical-align:middle;margin-left:.4rem;color:var(--muted);}
  .audbadge.patient{color:var(--gold);border-color:var(--gold);}
  /* audience tabs at the top of Past Sessions (Clinician | Patient) */
  .sessions .stabs{display:flex;gap:.2rem;padding:0 .9rem;border-bottom:1px solid var(--hair);flex:none;}
  .sessions .stab{font-family:var(--mono);font-size:.7rem;letter-spacing:.02em;cursor:pointer;border:0;
    background:transparent;color:var(--muted);padding:.55rem .8rem;border-bottom:2px solid transparent;
    margin-bottom:-1px;transition:.12s;}
  .sessions .stab:hover{color:var(--ink);}
  .sessions .stab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold);}
  .sessions .stab:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* image/PDF/DICOM attachments (vision) */
  button.attach{flex:none;width:44px;height:44px;border-radius:50%;cursor:pointer;background:transparent;
    border:1px solid var(--hair);color:var(--muted);display:grid;place-items:center;transition:.12s;}
  button.attach:hover{border-color:var(--gold);color:var(--gold);}
  button.attach svg{width:20px;height:20px;}
  .attns{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding-left:.15rem;}
  .attns .chip{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--mono);font-size:.72rem;
    color:var(--ink);background:var(--panel);border:1px solid var(--hair);border-radius:9px;padding:.3rem .55rem;}
  .attns .chip .x{cursor:pointer;color:var(--muted);border:none;background:none;font-size:1rem;line-height:1;padding:0;}
  .attns .chip .x:hover{color:var(--gap);}
  .attns .consent{display:flex;align-items:flex-start;gap:.5rem;font-size:.74rem;color:var(--muted);
    width:100%;line-height:1.4;margin-top:.1rem;}
  .attns .consent input{accent-color:var(--gold);margin-top:.15rem;flex:none;}
  .attns .consent{align-items:center;white-space:nowrap;}
  .consent-q{color:var(--muted);opacity:.7;font-size:.7rem;cursor:help;}

  /* identity gate (name + email at landing) */
  .idmodal[hidden]{display:none;}
  .idmodal{position:fixed;inset:0;z-index:70;background:rgba(4,10,20,.82);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:1.2rem;
    /* minmax(0,1fr): an implicit `auto` track sizes to the card's max-content (25rem) and overflows a
       phone viewport — the card was clipped on the right at 390px. */
    grid-template-columns:minmax(0,1fr);overflow-y:auto;}
  .idcard{background:var(--panel);border:1px solid var(--hair);border-radius:16px;padding:1.7rem 1.5rem;
    max-width:25rem;width:100%;box-sizing:border-box;box-shadow:0 24px 70px -34px #000;}
  .idcard img,.idcard .idlogo{height:74px;width:auto;display:block;margin:0 auto .6rem;}
  .idcard h2{font-family:var(--serif);font-size:1.35rem;text-align:center;margin:0 0 .3rem;}
  .idcard p{color:var(--muted);font-size:.84rem;text-align:center;margin:0 0 1.2rem;line-height:1.5;}
  .idcard input{width:100%;background:var(--panel2);border:1px solid var(--hair);border-radius:10px;
    color:var(--ink);font:inherit;font-size:.94rem;padding:.62rem .8rem;margin-bottom:.6rem;outline:none;}
  .idcard input:focus{border-color:rgba(var(--gold-rgb),.55);box-shadow:0 0 0 2px rgba(var(--gold-rgb),.12);}

  /* The decision scene: a clinician with a glowing assistant at their shoulder. Evidence streams in
     and is absorbed; a bright answer card lands with a green check and a small burst; the clinician
     lights up. Self-contained SVG+CSS, 6s cycle, always in
     motion (the assistant breathes, the trace runs); theme colors via vars. */
  .bedside{display:block;width:100%;max-width:300px;margin:1.6rem auto 0;overflow:visible;}
  .bedside .bs-dr circle,.bedside .bs-dr path{fill:var(--muted);opacity:.65;}
  .bedside .bs-dr .bs-steth{fill:none;stroke:var(--panel);stroke-width:1.5;stroke-linecap:round;opacity:.95;}
  .bedside .bs-dr-on circle,.bedside .bs-dr-on path{fill:var(--gold);opacity:1;}

  .bedside .bs-orb-star{fill:var(--gold);opacity:.9;transform-box:fill-box;transform-origin:center;animation:bsSpin 9s linear infinite;}
  .bedside .bs-orb-core{fill:#fff;opacity:.95;}
  .bedside .bs-chip rect{fill:var(--panel);stroke:var(--gold);stroke-width:1.2;}
  .bedside .bs-chip text{fill:var(--gold);font-family:var(--mono);font-size:6.5px;font-weight:700;letter-spacing:.08em;}
  .bedside .bs-chip{opacity:0;}
  .bedside .bs-ch0{animation:bsCh0 6s ease-in-out infinite;} .bedside .bs-ch1{animation:bsCh1 6s ease-in-out infinite;} .bedside .bs-ch2{animation:bsCh2 6s ease-in-out infinite;}
  .bedside .bs-card{opacity:0;transform-box:fill-box;transform-origin:center;animation:bsCard 6s ease-in-out infinite;}
  .bedside .bs-cardbg{fill:var(--panel);stroke:var(--gold);stroke-width:1.2;}
  .bedside .bs-okc{fill:var(--verified);} .bedside .bs-okp{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .bedside .bs-l0{fill:var(--gold);} .bedside .bs-l1,.bedside .bs-l2{fill:var(--muted);opacity:.4;}
  .bedside .bs-spark line{stroke:var(--gold);stroke-width:2;stroke-linecap:round;}
  .bedside .bs-spark{opacity:0;transform-box:fill-box;transform-origin:center;animation:bsSpark 6s ease-out infinite;}
  @keyframes bsOn{0%,54%{opacity:0}60%{opacity:1}92%{opacity:1}98%,100%{opacity:0}}
  @keyframes bsBob{from{transform:translateY(-2px)}to{transform:translateY(2px)}}
  @keyframes bsBreathe{from{transform:scale(1)}to{transform:scale(1.3)}}
  @keyframes bsGlowUp{0%,44%{opacity:.16}52%{opacity:.5}60%{opacity:.16}100%{opacity:.16}}
  @keyframes bsSpin{to{transform:rotate(360deg)}}
  /* chips: fly from the right to the assistant (152,40) and shrink into it; staggered */

  /* grounded chart (inline SVG) — framed as a figure with a caption + legend */

  /* Specialist Panel — a MODE of the same shell as Q&A, not a separate overlay. body[data-mode] swaps the

    border-radius:999px;padding:.18rem .55rem;background:var(--panel);}
  .panelbody>.panelwrap,.panellanding{max-width:760px;margin:0 auto;}
  .panelsub{font-size:.9rem;color:var(--muted);line-height:1.6;margin:.2rem 0 1.5rem;}
  .panelq{width:100%;box-sizing:border-box;resize:none;overflow-y:auto;min-height:3.4rem;font:inherit;font-size:1rem;line-height:1.55;
    color:var(--ink);background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:.8rem .95rem;}
  .panelq:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.12);}
  .rosterhead{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;margin-bottom:.7rem;}
  .rosterhead .rh-h{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
  .rosterhead .rh-n{font-size:.78rem;color:var(--muted);}
  .rostergrid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));}
  .panelbtn.danger{border-color:var(--hair);color:var(--muted);}
  .panelbtn.danger:hover{background:#c0392b;border-color:#c0392b;color:#fff;}
  .spec-ev-l li.ev-hl{background:rgba(var(--gold-rgb),.14);border-radius:6px;transition:background .3s;}
  .panelstatus{max-width:760px;margin:2rem auto;text-align:center;color:var(--muted);font-size:.95rem;line-height:1.6;}
  .panelstatus .spin,.psynthstat .spin{display:inline-block;margin-right:.5rem;animation:spin 1.1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* live per-specialist progress + trace during a streamed panel run */
  .pphase{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;margin:.9rem 0 .1rem;
    font-family:var(--mono);font-size:.7rem;color:var(--muted);}
  .pphase .pph{padding:.2rem .6rem;border:1px solid var(--hair);border-radius:999px;
    background:var(--panel2);white-space:nowrap;}
  .pphase .pph.on{color:var(--gold);border-color:rgba(var(--gold-rgb),.55);}
  .pphase .pph.past{color:var(--verified);}
  .pphase .pph-sep{color:var(--muted);opacity:.6;}
  .prows{display:flex;flex-direction:column;gap:.5rem;margin:1.2rem 0;}
  .prow{border:1px solid var(--hair);border-radius:10px;background:var(--panel2);overflow:hidden;}
  .prow-h{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;}
  .prow-dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--hair);flex:none;}
  .prow.run{border-color:rgba(var(--gold-rgb),.5);}
  .prow.run .prow-dot{background:var(--gold);animation:pulse 1.1s ease-in-out infinite;}
  .prow.done{border-left:3px solid var(--verified);}
  .prow.done .prow-dot{background:var(--verified);}
  .prow.err{border-left:3px solid var(--muted);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .prow-name{font-weight:600;color:var(--ink);font-size:.92rem;}
  .prow-st{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--muted);}
  .prow.done .prow-st{color:var(--verified);}
  .prow-el{font-family:var(--mono);font-size:.68rem;color:var(--muted);white-space:nowrap;
    font-variant-numeric:tabular-nums;}
  .pphase .pph-elapsed{margin-left:auto;font-variant-numeric:tabular-nums;}
  .pnet{margin:.5rem 0 0;font-family:var(--mono);font-size:.72rem;color:var(--gap);}
  .prow-trace{padding:0 .8rem;max-height:0;overflow-y:auto;transition:max-height .2s ease;}
  .prow-trace:not(:empty){max-height:180px;padding:.1rem .8rem .6rem 1.5rem;border-top:1px solid var(--hair);}
  .prow-trace .tstep{font-size:.76rem;}
  .psynthstat{color:var(--muted);font-size:.9rem;margin-top:.7rem;}
  .pstop{margin-left:.7rem;font-family:var(--mono);font-size:.68rem;font-weight:640;cursor:pointer;
    border:1px solid var(--hair);background:var(--panel2);color:var(--ink);border-radius:8px;padding:.25rem .6rem;}
  .pstop:hover{border-color:#c0392b;color:#c0392b;}
  .presolved{margin:.5rem 0 .3rem;font-size:.82rem;color:var(--muted);}
  .presolved .tq{color:var(--ink);font-style:italic;}
  /* multi-turn panel conversation */
  .panelconv .panelturns{display:flex;flex-direction:column;gap:1.6rem;}
  .panelconv-pane{max-width:none;}   /* in the sessions pane the conference fills the detail column */
  .panelconv-pane .panelturn{border-top:none;padding-top:.4rem;}
  .panelturn{border-top:1px solid var(--hair);padding-top:1.2rem;}
  .panelturn:first-child{border-top:none;padding-top:0;}
  .panelturn.live{border-top:1px dashed var(--hair);}
  .panelq-echo{font-size:1rem;color:var(--ink);line-height:1.5;margin-bottom:1rem;}
  .panelq-echo .pqt{font-family:var(--mono);font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);
    border:1px solid rgba(var(--gold-rgb),.4);border-radius:999px;padding:.08rem .45rem;margin-right:.5rem;vertical-align:middle;}
  .panelfollow{margin-top:1.8rem;border-top:1px solid var(--hair);padding-top:1.2rem;position:sticky;bottom:0;background:var(--bg);}
  .pf-row{display:flex;align-items:flex-end;gap:.6rem;}
  .pf-row .panelq{min-height:2.8rem;}
  .pf-go{flex:none;width:2.8rem;height:2.8rem;}
  .pf-actions{margin-top:.7rem;}
  /* confidence read: three dimensions, each = [name · level · gloss] then a rationale below it */
  .rconf{margin-top:.95rem;padding-top:.75rem;border-top:1px solid var(--hair);}
  .rconf-h{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.6rem;}
  .rconf-item{padding:.5rem 0;border-top:1px solid var(--hair-soft);}
  .rconf-item:first-of-type{border-top:0;padding-top:0;}
  .rconf-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
  .rconf-dim{font-size:.84rem;font-weight:660;color:var(--ink);}
  .rconf-lvl{font-family:var(--mono);font-size:.62rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;border-radius:999px;padding:.1rem .5rem;}
  .rconf-lvl.lv-high{color:var(--verified);background:rgba(19,122,84,.12);}
  .rconf-lvl.lv-moderate{color:var(--gap);background:rgba(178,106,30,.13);}
  .rconf-lvl.lv-low{color:#c0392b;background:rgba(192,57,43,.12);}
  .rconf-lvl.lv-unknown{color:var(--muted);background:var(--hair-soft);}
  :root[data-theme="dark"] .rconf-lvl.lv-low{color:#e88;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rconf-lvl.lv-low{color:#e88;}}
  .rconf-gloss{font-size:.74rem;color:var(--muted);font-style:italic;}
  .rconf-why{font-size:.82rem;color:var(--muted);line-height:1.55;margin-top:.3rem;}
  .answer.md .ref{color:var(--gold);font-weight:640;cursor:pointer;font-size:.68em;padding:0 .06em;vertical-align:super;}
  /* color highlights are OFF by default — a <mark> reads as plain text until the reader toggles
     them on (adds .hl-on to the answer). */
  .answer.md mark.hl{color:inherit;background:transparent;border-radius:0;padding:0;
    box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  .answer.md.hl-on mark.hl{border-radius:3px;padding:.04em .18em;}
  .answer.md.hl-on .hl-f{background:rgba(var(--hl-f),.24);}
  .answer.md.hl-on .hl-r{background:rgba(var(--hl-r),.26);}
  .answer.md.hl-on .hl-k{background:rgba(var(--hl-k),.26);}
  .hltoggle.on{color:var(--gold);border-color:var(--gold);}
  .hllegend{display:flex;flex-wrap:wrap;gap:.9rem;margin:-.4rem 0 1.3rem;font-size:.72rem;color:var(--muted);}
  .hllegend[hidden]{display:none;}   /* author display:flex would otherwise beat the [hidden] UA rule */
  .hllegend span{display:inline-flex;align-items:center;gap:.35rem;}
  .hllegend i{width:.72rem;height:.72rem;border-radius:3px;display:inline-block;}
  .hllegend .lf{background:rgba(var(--hl-f),.95);} .hllegend .lr{background:rgba(var(--hl-r),.95);}
  .hllegend .lk{background:rgba(var(--hl-k),.95);}
  /* evidence dossier — a left-highlighted box (matches the strengthen/plain/video boxes); collapsed
     by default, the summary (header + hint + Show/Hide pill) is the disclosure control. */
  .evblock{margin:0;border:1px solid var(--hair);border-left:3px solid var(--gold);border-radius:12px;
    background:var(--panel2);overflow:hidden;}
  .evblock>summary{list-style:none;cursor:pointer;padding:.85rem 1rem;transition:background .15s;}
  .evblock>summary::-webkit-details-marker{display:none;}
  .evblock>summary:hover{background:rgba(var(--gold-rgb),.05);}
  .evhead{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);
    font-weight:680;margin:0;padding:0;display:flex;align-items:center;gap:.55rem;}
  .evhint{font-size:.8rem;color:var(--muted);margin-top:.45rem;line-height:1.5;}
  /* explicit clickable pill so it's obvious the evidence section expands */
  .evtoggle{margin-left:auto;font-family:var(--mono);font-size:.6rem;letter-spacing:.04em;white-space:nowrap;
    color:var(--on-accent);background:var(--gold);border-radius:12px;padding:.2rem .62rem;text-transform:none;}
  .evtoggle::after{content:"Show ▸";}
  .evblock[open] .evtoggle::after{content:"Hide ▾";}
  .evblock>summary:hover .evtoggle{background:var(--gold-strong);}
  .evbody{padding:.2rem 1rem 1rem;}
  .fnum{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:1.4rem;height:1.4rem;
    border-radius:8px;background:var(--gold);color:var(--on-accent);font-family:var(--mono);font-size:.72rem;
    font-weight:700;margin-top:.05rem;}
  .claim.flash{outline:2px solid var(--gold);outline-offset:2px;}

  /* answer-actions group — a uniform set of add-on boxes (briefing video · explain · strengthen),
     rendered once per conversation. The group owns the spacing so the boxes read as one unit. */
  .addons{margin:1.3rem 0 .3rem;display:flex;flex-direction:column;gap:.65rem;}
  .addons > *{margin:0 !important;}
  /* per-answer box: the Evidence dossier + "add more sources", grouped so they read as one unit */
  .ansbox{margin:1.15rem 0 .2rem;display:flex;flex-direction:column;gap:.55rem;}
  .ansbox > *{margin:0 !important;}
  /* answer-video add-on */
  .vid{margin:.2rem 0 1.4rem;padding:.85rem 1rem;border:1px solid var(--hair);border-left:3px solid var(--gold);border-radius:12px;background:var(--panel2);}
  .vid .vbtn{font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.03em;cursor:pointer;
    border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:9px;padding:.55rem .9rem;}
  .vid .vbtn:hover{background:var(--gold);color:var(--on-accent);}
  .vid .vbtn:disabled{opacity:.55;cursor:default;}
  .vid .vhint{font-size:.76rem;color:var(--muted);margin-top:.55rem;}
  .vid video{width:100%;max-width:640px;border-radius:12px;margin-top:.75rem;display:block;}

  /* plain-language (layman) explanation */
  .plain{margin:.2rem 0 1.4rem;padding:.85rem 1rem;border:1px solid var(--hair);border-left:3px solid var(--verified);
    border-radius:12px;background:var(--panel2);}
  .plain .vbtn{font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.03em;cursor:pointer;
    border:1px solid var(--verified);color:var(--verified);background:transparent;border-radius:9px;padding:.55rem .9rem;}
  .plain .vbtn:hover{background:var(--verified);color:#0A1F16;}
  .plain .vbtn:disabled{opacity:.55;cursor:default;}
  .plain .plain-hint{font-size:.76rem;color:var(--muted);margin-top:.55rem;}
  .plain .plain-h{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;
    color:var(--verified);margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem;}
  /* collapsible variant: .plain-d is a <details>, .plain-h its <summary> */
  details.plain-d>summary.plain-h{list-style:none;cursor:pointer;margin-bottom:0;}
  details.plain-d>summary.plain-h::-webkit-details-marker{display:none;}
  details.plain-d>summary.plain-h::after{content:"▸";margin-left:auto;font-size:.7rem;color:var(--muted);transition:transform .18s;}
  details.plain-d[open]>summary.plain-h::after{transform:rotate(90deg);}
  details.plain-d[open]>summary.plain-h{margin-bottom:.7rem;}
  details.plain-d>summary.plain-h:hover{color:#7FD3AE;}
  /* ↻ Regenerate control on the rendered visuals block — right-aligned, before the disclosure ▸ */
  .plain .plain-h .vzregen{margin-left:auto;font-family:var(--mono);font-size:.62rem;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;
    border:1px solid var(--hair);border-radius:999px;padding:.16rem .55rem;cursor:pointer;
    transition:color .15s,border-color .15s;}
  .plain .plain-h .vzregen:hover{color:var(--verified);border-color:var(--verified);}
  .plain .plain-h .vzregen:disabled{opacity:.55;cursor:default;}
  .visuals-d .vzregen-note{font-size:.76rem;color:var(--muted);margin:0 0 .55rem;}
  .plain .plain-b{font-size:.98rem;line-height:1.66;color:var(--ink);}
  /* markdown inside the plain-language body — tighter than the hero answer */
  .plain .plain-b.md .mdp{margin:.55rem 0;} .plain .plain-b.md .mdp:first-child{margin-top:0;}
  .plain .plain-b.md .mdl{margin:.5rem 0 .5rem 1.1rem;} .plain .plain-b.md .mdh{font-size:.82rem;margin:.7rem 0 .35rem;}
  .plain .plain-b.md strong{color:var(--ink);font-weight:640;}

  /* self-healing corpus — fill-the-gaps panel */
  .gapfix{margin:1.4rem 0 .4rem;padding:.85rem 1rem;border:1px solid var(--hair);border-left:3px solid var(--gold);
    border-radius:12px;background:var(--panel2);}
  .gapfix.soft{border-left-color:var(--hair);background:transparent;opacity:.86;}
  .gapfix.soft .gapfix-h{color:var(--muted);}
  .gapfix .vbtn{font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.03em;cursor:pointer;
    border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:9px;padding:.55rem .9rem;margin-top:.2rem;}
  .gapfix .vbtn:hover{background:var(--gold);color:var(--on-accent);} .gapfix .vbtn:disabled{opacity:.55;cursor:default;}
  .gapfix-h{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:.4rem;}
  .gapfix-hint{font-size:.8rem;color:var(--muted);margin-bottom:.7rem;line-height:1.5;}
  .gapfix-sum{font-size:.92rem;color:var(--ink);margin:.1rem 0 .8rem;line-height:1.55;}
  .gaplbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:.3rem 0 .55rem;}
  .gaplbl2{margin-top:1.1rem;border-top:1px solid var(--hair);padding-top:.9rem;}
  .gapjobs{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.9rem;}
  .gapjob{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .7rem;border:1px solid var(--hair);
    border-radius:10px;background:var(--panel);cursor:pointer;transition:border-color .15s;}
  .gapjob:hover{border-color:rgba(var(--gold-rgb),.4);}
  .gapjob input{margin-top:.25rem;flex:none;accent-color:var(--gold);width:1rem;height:1rem;}
  .gapj-body{display:flex;flex-direction:column;gap:.25rem;min-width:0;}
  .gapj-top{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;}
  .gapj-top b{font-family:var(--mono);font-size:.72rem;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;}
  .gapj-q{font-size:.9rem;color:var(--ink);line-height:1.4;}
  .gapj-meta{display:flex;gap:.5rem;flex-wrap:wrap;font-size:.7rem;color:var(--muted);}
  .gapj-kind,.gapj-qual,.gapj-lim{background:var(--panel2);border:1px solid var(--hair);border-radius:6px;padding:.08rem .4rem;}
  .gapj-why{font-size:.78rem;color:var(--muted);line-height:1.45;}
  .gapstatus{display:block;font-size:.8rem;color:var(--muted);margin-top:.6rem;line-height:1.5;}
  .gapstatus a{color:var(--gold);}
  .gapprog{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:.4rem;}
  .gaprecs{margin:.2rem 0 0;padding-left:1.1rem;font-size:.86rem;color:var(--ink);line-height:1.5;}
  .gaprecs li{margin-bottom:.4rem;} .gapr-why{display:block;font-size:.76rem;color:var(--muted);}

  /* conversation thread */
  .threadbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:0 0 1.1rem;padding-bottom:.7rem;border-bottom:1px solid var(--hair);}
  .threadlbl{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
  .turn{margin:0 0 1.6rem;}
  .turn + .turn{padding-top:1.6rem;border-top:1px solid var(--hair);}
  .turn-q{display:flex;gap:.6rem;align-items:flex-start;margin:0 0 1rem;}
  .turn-qmark{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:1.7rem;height:1.7rem;
    border-radius:8px;background:var(--gold);color:var(--on-accent);font-family:var(--mono);font-size:.68rem;font-weight:700;margin-top:.1rem;}
  .turn-qtext{font-family:var(--serif,Georgia,serif);font-size:1.18rem;line-height:1.4;color:var(--ink);font-weight:500;letter-spacing:-.01em;}
  .turnstatus{margin-top:1.2rem;}
  /* ChatGPT-style conversation: once a thread is active, the composer docks to the BOTTOM and the
     thread (each turn is question-first) scrolls above it. Empty/landing state is unchanged. */
  body.chatting #heading,
  body.triage-live #heading{display:none;}
  /* Docked composer at the bottom — for the Q&A thread AND the Guided (triage) clarifying conversation,
     so both read like a chat with the input pinned below the messages. */
  body.chatting #ask,
  body.triage-live #ask{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;
    max-width:44rem;margin:0;z-index:40;background:var(--bg);border-top:1px solid var(--hair);
    padding:.7rem 1.15rem calc(.7rem + env(safe-area-inset-bottom,0px));}
  body.chatting #out{padding-bottom:9rem;}   /* JS keeps this in sync with the composer's real height */
  body.triage-live #triagebody{padding-bottom:9rem;}
  /* the disclaimer footer is a landing element — hide it whenever the composer is docked (Q&A thread or
     Guided chat), else it renders mid-screen above the fixed composer. Per-answer footnotes still show. */
  body.chatting #pagefoot,
  body.triage-live #pagefoot{display:none;}
  /* suggested follow-ups */
  .suggest{margin:.6rem 0 .4rem;padding:1rem 1.15rem;border:1px solid var(--hair);border-radius:14px;background:var(--panel2);}
  .suggest-h{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin-bottom:.7rem;}
  .suggest-loading{font-size:.82rem;color:var(--muted);}
  /* "Where next" — the ONE diverging-paths block: follow-up chips (primary) + lens hops (subordinate
     dashed-rule row). The slim transform row above it is deliberately quieter than both. */
  .wn-lens{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.85rem;padding-top:.75rem;
    border-top:1px dashed var(--hair);}
  .wn-lenslbl{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);}
  .hopchip.mini{font-size:.74rem;padding:.3rem .7rem;opacity:.92;}
  .xformrow{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;margin:1rem 0 .3rem;}
  .xformrow .xlbl{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);}
  .xbtn{font-family:var(--mono);font-size:.74rem;cursor:pointer;background:transparent;
    border:1px solid var(--hair);border-radius:999px;padding:.32rem .75rem;color:var(--muted);}
  .xbtn:hover{color:var(--ink);border-color:var(--gold);}
  .xbtn:disabled{opacity:.55;cursor:default;}
  .xhint{font-size:.76rem;color:var(--muted);}
  .xitem.expanded{display:block;flex-basis:100%;border:1px solid var(--hair);border-radius:12px;
    padding:.8rem .95rem;margin-top:.35rem;}
  .xitem.expanded video{display:block;max-width:100%;border-radius:8px;margin:.55rem 0;}
  .xformrow>details.plain-d{flex-basis:100%;}
  /* real-world patient case marker — the noesis circle in warm orange */
  .rpdot{color:#f28c2e;font-size:.9em;text-shadow:0 0 6px rgba(242,140,46,.45);}
  .sact.rp-on{color:#f28c2e;border-color:#f28c2e;}
  /* ◉ Pulse full page */
  .pulsepage{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:1rem 1.4rem 3rem;}
  /* 🎙 voice intake — mic lives in the composer, guided mode only */
  body:not([data-mode="triage"]):not(.voice-anywhere) #voicebtn{display:none !important;}
  #voicebtn.on{color:var(--gold);}
  #voicebtn.listening{color:var(--gap);animation:vpulse 1.15s ease-in-out infinite;}
  #voicebtn.speaking{color:var(--gold);animation:vpulse 1.8s ease-in-out infinite;}
  @keyframes vpulse{50%{opacity:.4;}}
  @media (prefers-reduced-motion: reduce){ #voicebtn.listening,#voicebtn.speaking{animation:none;} }
  /* ✦ All Terms — the accumulating vocabulary web (same full-page frame as Pulse) */
  .termspage{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:1rem 1.4rem 3rem;}

  .mstat{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.02em;}

  .copybtn:hover{color:var(--gold);border-color:rgba(var(--gold-rgb),.6);}

  /* signature: the evidence dossier entry */

    animation:rise .38s cubic-bezier(.2,.7,.2,1) both;transition:border-color .15s;}
  .claim::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:.55;}

  .cquote::before{content:"\201C";color:var(--gold);}.cquote::after{content:"\201D";color:var(--gold);}

  .sessions .sback{font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;

  .sessions .sback:hover{border-color:var(--gold);color:var(--gold);}
  .sessions .stitle{font-family:var(--serif);font-size:1.1rem;color:var(--ink);}
  .sessions .ssearchrow{padding:.55rem 1.2rem 0;}
  .sessions .ssearch{width:100%;display:block;background:var(--panel2);border:1px solid var(--hair);border-radius:9px;

  .sessions .ssearch:focus{border-color:rgba(var(--gold-rgb),.5);box-shadow:0 0 0 2px rgba(var(--gold-rgb),.12);}
  .sessions .ssearch::placeholder{color:var(--muted);}
  .sessions .sbody{flex:1;display:flex;min-height:0;}

  .sessions .sdrag{flex:none;width:8px;cursor:col-resize;background:transparent;position:relative;}
  .sessions .sdrag::before{content:"";position:absolute;inset:0 3px;border-radius:2px;background:var(--hair);}
  .sessions .sdrag:hover::before,.sessions .sdrag.drag::before{background:var(--gold);}
  /* RIGHT detail — base surface */
  .sessions .sdetail{flex:1;min-width:0;overflow-y:auto;padding:1.5rem 1.9rem;background:var(--bg);}
  .sessions .sdetail .summary:first-child{margin-top:0;}
  .sessions .sqhead{border-bottom:1px solid var(--hair);padding-bottom:.9rem;margin-bottom:1.2rem;}
  .sessions .sqhead .qq{font-family:var(--serif);font-size:1.3rem;line-height:1.35;color:var(--ink);letter-spacing:-.01em;}
  .sessions .sqhead .qm{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:.5rem;display:flex;gap:.7rem;flex-wrap:wrap;}
  .sessions .sqhead .qm b{color:var(--gold);font-weight:600;}
  .sessions .srow{display:block;width:100%;text-align:left;border:none;background:transparent;cursor:pointer;
    border-radius:9px;padding:.7rem .75rem;margin-bottom:.2rem;border-left:2px solid transparent;}
  .sessions .srow:hover{background:var(--panel);}
  .sessions .srow[aria-current="true"]{background:var(--panel);border-left-color:var(--gold);}
  .sessions .srow .sq{color:var(--ink);font-size:.86rem;line-height:1.45;}   /* full text, no truncation */
  .sessions .srow .sm{font-family:var(--mono);font-size:.62rem;letter-spacing:.02em;color:var(--muted);
    margin-top:.4rem;display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;}
  .sessions .srow .sg{color:var(--verified);} .sessions .srow .swho{color:var(--gold);}
  .sessions .srow .skind{font-family:var(--mono);font-size:.56rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--gold);border:1px solid rgba(var(--gold-rgb),.4);border-radius:999px;padding:.05rem .4rem;vertical-align:middle;}
  .sessions .splaceholder{color:var(--muted);font-size:.9rem;margin-top:2.5rem;text-align:center;}
  .sessions .sempty{color:var(--muted);padding:1rem;font-size:.85rem;}
  /* ---- Historical Cases (list + detail + doctor rubric) ---- */
  .sessions .scluster{font-family:var(--mono);font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;
    color:var(--gold);padding:.7rem .5rem .25rem;border-top:1px solid var(--hair);margin-top:.3rem;}
  .sessions .scluster:first-child{border-top:none;margin-top:0;}
  .sessions .caserow.on{background:var(--panel);border-left-color:var(--gold);}
  .sessions .caserow .cstate,.sessions .caserow .cverdict{font-family:var(--mono);font-size:.56rem;text-transform:uppercase;
    letter-spacing:.06em;border-radius:999px;padding:.05rem .4rem;border:1px solid var(--hair);}
  .cstate-ok{color:var(--verified);border-color:rgba(127,211,174,.4)!important;}
  .cstate-none{color:var(--muted);}
  .cv-accept{color:var(--verified);border-color:rgba(127,211,174,.5)!important;}
  .cv-revise{color:var(--gold);border-color:rgba(var(--gold-rgb),.5)!important;}
  .cv-reject{color:#e0777a;border-color:rgba(224,119,122,.5)!important;}
  .casedetail{max-width:52rem;}
  .casedetail .ccluster{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);}
  .casedetail .ctitle{font-family:var(--serif);font-size:1.5rem;line-height:1.25;color:var(--ink);margin:.3rem 0 .7rem;text-wrap:balance;}
  .casedetail .cblurb{font-size:.96rem;line-height:1.7;color:var(--ink);opacity:.9;}
  .casedetail .cqa{margin:1.1rem 0;padding:.8rem .9rem;background:var(--panel2);border:1px solid var(--hair);border-radius:10px;}
  .casedetail .cqa-h{font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.35rem;}
  .casedetail .cq{font-family:var(--serif);font-size:1.06rem;line-height:1.5;color:var(--ink);}
  .casedetail .cref{margin:.4rem 0 1.2rem;border:1px solid var(--hair);border-radius:10px;background:var(--bg);}
  .casedetail .cref>summary{cursor:pointer;font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;
    color:var(--verified);padding:.5rem .7rem;list-style:none;} .casedetail .cref>summary::-webkit-details-marker{display:none;}
  .casedetail .cref-b{padding:0 .7rem .7rem;font-size:.9rem;line-height:1.6;color:var(--ink);}
  .casedetail .csec-h{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--verified);
    margin:1.4rem 0 .5rem;padding-top:.7rem;border-top:1px solid var(--hair);display:flex;gap:.5rem;align-items:center;}
  .casedetail .cempty{color:var(--muted);font-size:.9rem;padding:.6rem .1rem;font-style:italic;}
  .casedetail .cmeta{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-top:.6rem;}
  .casedetail .cmeta .sg{color:var(--verified);}
  .casedetail .ccites{margin:.6rem 0;} .casedetail .ccites>summary{cursor:pointer;font-family:var(--mono);font-size:.62rem;color:var(--muted);}
  .casedetail .ccite{font-size:.82rem;line-height:1.5;margin:.4rem 0;padding-left:.6rem;border-left:2px solid var(--hair);}
  .casedetail .ccs{color:var(--gold);font-weight:600;display:block;} .casedetail .ccq{color:var(--ink);opacity:.85;}
  /* doctor rubric */
  .rubric{margin:1rem 0 1.5rem;padding:.9rem 1rem;border:1px solid var(--hair);border-radius:12px;background:var(--panel2);}
  .rbrow{display:flex;align-items:center;gap:.7rem;margin:.4rem 0;}
  .rbrow .rblbl{flex:0 0 8.5rem;font-size:.82rem;color:var(--ink);}
  .rbscale,.rbverdict{display:inline-flex;gap:.3rem;}
  .rbn,.rbv{font-family:var(--mono);font-size:.72rem;border:1px solid var(--hair);background:var(--bg);color:var(--muted);
    border-radius:7px;padding:.2rem .5rem;cursor:pointer;transition:all .12s;}
  .rbn{width:1.9rem;text-align:center;} .rbn:hover,.rbv:hover{border-color:var(--verified);color:var(--ink);}
  .rbn.on{background:var(--verified);color:#0A1F16;border-color:var(--verified);font-weight:700;}
  .rbv.on{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700;}
  .rbrev{width:100%;margin:.6rem 0 .4rem;padding:.4rem .55rem;background:var(--bg);border:1px solid var(--hair);border-radius:8px;
    color:var(--ink);font:inherit;font-size:.85rem;box-sizing:border-box;}
  .rbnotes{width:100%;padding:.45rem .55rem;background:var(--bg);border:1px solid var(--hair);border-radius:8px;color:var(--ink);
    font:inherit;font-size:.85rem;line-height:1.5;resize:vertical;box-sizing:border-box;}
  .rbfoot{display:flex;align-items:center;gap:.8rem;margin-top:.6rem;}
  .rbsave{font-family:var(--mono);font-size:.74rem;font-weight:600;letter-spacing:.03em;cursor:pointer;background:var(--verified);
    color:#0A1F16;border:none;border-radius:8px;padding:.4rem .8rem;} .rbsave:disabled{opacity:.55;cursor:default;}
  .rbmsg{font-family:var(--mono);font-size:.68rem;color:var(--muted);}
  /* Case Board header generate control */
  #caseboard .shead #cbsub{font-family:var(--mono);font-size:.6rem;color:var(--muted);letter-spacing:.02em;}
  #caseboard .shead .cbgen{margin-left:auto;display:inline-flex;align-items:center;gap:.6rem;}
  #caseboard .shead .cbgen[hidden]{display:none;}
  #caseboard .shead .cbgenmsg{font-family:var(--mono);font-size:.66rem;color:var(--muted);}
  @media (max-width:640px){ #caseboard .shead #cbsub{display:none;} }
  /* Case Board era toggle (Historical / Recent) */
  #caseboard .cbera{display:inline-flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden;margin-right:.7rem;}
  #caseboard .cbtab{font-family:var(--mono);font-size:.66rem;letter-spacing:.03em;background:transparent;color:var(--muted);
    border:none;padding:.3rem .7rem;cursor:pointer;transition:all .12s;}
  #caseboard .cbtab.on{background:var(--verified);color:#0A1F16;font-weight:700;}
  #caseboard .cbtab:not(.on):hover{color:var(--ink);}
  #caseboard .ssearchrow{display:flex;align-items:center;gap:.2rem;flex-wrap:wrap;}
  /* Active Cases: anonymous board rows + the publish picker */
  #caseboard .acrow .sq{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  #caseboard .ackind{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--hair);border-radius:999px;padding:.08rem .45rem;}
  .acnote{font-family:var(--sans);font-size:.82rem;color:var(--muted);margin:.4rem 0 1rem;line-height:1.45;}
  .acpick{max-width:52rem;}
  .acpick h2{font-family:var(--sans);font-size:1.15rem;font-weight:700;margin:0 0 .3rem;}
  .acpick .acbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.6rem 0;}
  .acpick .acacct{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-family:var(--sans);font-size:.84rem;font-weight:600;margin:.4rem 0;}
  .acpick .acacct select{flex:1 1 14rem;min-width:0;max-width:100%;min-height:40px;padding:.35rem .6rem;border:1px solid var(--hair);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;font-size:16px;}
  .acpick .acbar input[type=search]{flex:1 1 12rem;min-width:0;min-height:40px;padding:.4rem .7rem;border:1px solid var(--hair);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;font-size:16px;}
  .acpick .acbar .histbtn{margin-left:0;min-height:40px;}
  .acpick .aclist{border:1px solid var(--hair);border-radius:10px;overflow:hidden;max-height:52vh;overflow-y:auto;}
  .acpick .acitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:start;padding:.55rem .7rem;border-bottom:1px solid var(--hair);background:var(--panel);}
  .acpick .acitem:last-child{border-bottom:0;}
  .acpick .acitem input{width:20px;height:20px;margin-top:.15rem;accent-color:var(--gold);}
  .acpick .acitem .acq{font-family:var(--sans);font-size:.88rem;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .acpick .acitem .acm{font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-top:.2rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;}
  .acpick .acitem .acon{color:var(--verified-ink,var(--ink));background:var(--verified);border-radius:999px;padding:.05rem .45rem;font-weight:700;}
  .acpick .acitem .acun{font:inherit;font-family:var(--mono);font-size:.62rem;background:transparent;border:1px solid var(--hair);border-radius:6px;color:var(--muted);padding:.3rem .5rem;min-height:32px;cursor:pointer;}

  .acpick .acconfirm input{width:20px;height:20px;flex:none;margin-top:.1rem;accent-color:var(--gold);}
  .acpick .acmsg{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:.5rem;min-height:1.2em;}
  .acpick .acgo{font:inherit;font-family:var(--sans);font-weight:700;font-size:.9rem;min-height:42px;padding:.5rem 1rem;border:0;border-radius:9px;background:var(--gold);color:#fff;cursor:pointer;}
  /* anonymous case view is read-only: no explain / visuals / feedback actions on a copy */
  .acdetail .copybtn{display:none;}
  .acpick .acgo:disabled{opacity:.45;cursor:default;}
  .acdetail .achead{display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center;font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-bottom:.6rem;}
  .acdetail .achead .acun{font:inherit;font-family:var(--mono);font-size:.62rem;background:transparent;border:1px solid var(--hair);border-radius:6px;color:var(--muted);padding:.3rem .5rem;min-height:32px;cursor:pointer;margin-left:auto;}
  @media (max-width:560px){ .acpick .acbar .histbtn,.acpick .acgo{width:100%;} .acpick .aclist{max-height:none;} }
  @media (max-width:640px){

    .sessions[data-view="detail"] .stitle{display:none;}
  }

  .answer.md .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.75rem 0 1.05rem;}

window.__chartQA = (()=>{
  const res=[];
  document.querySelectorAll('svg.chart').forEach((svg,si)=>{
    const vb=svg.viewBox.baseVal; const texts=[...svg.querySelectorAll('text')];
    const boxes=texts.map(tx=>{const b=tx.getBBox();return {t:tx.textContent.trim().slice(0,40),x:b.x,y:b.y,w:b.width,h:b.height};});
    const outside=boxes.filter(b=>b.x< -0.5||b.y< -0.5||b.x+b.w>vb.width+0.5||b.y+b.h>vb.height+0.5);
    const overlaps=[];
    for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++){const a=boxes[i],b=boxes[j];
      const ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x), oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);
      if(ox>1&&oy>1) overlaps.push([a.t,b.t,Math.round(ox),Math.round(oy)]);}
    res.push({svg:si,texts:texts.length,outside,overlaps,width:svg.getBoundingClientRect().width});
  });
  return {docScrollW:document.documentElement.scrollWidth,innerWidth,charts:res};
})();</script></body></html>
