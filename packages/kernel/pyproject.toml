[project]
name = "noesis-kernel"
version = "0.0.0"
description = "Noesis domain-agnostic kernel"
requires-python = ">=3.13"
# Deps added per phase (P1 ingestion, P2 retrieval, ...). Kept minimal on purpose.
dependencies = []

[project.optional-dependencies]
# The Postgres retrieval backend (pgvector + tsvector). Optional so the offline
# kernel + tests need no DB driver; installed to run PostgresRetrievalSource.
postgres = ["asyncpg>=0.30", "pgvector>=0.3"]
s3 = ["boto3>=1.34"]
# Real providers + API. All lazy-imported; only needed in record/live mode or to
# serve the app. Tests run offline on cassettes/fakes without these.
# tiktoken: precise pre-embed token clamp (embeddings.py) — without it the char-cap fallback
# can still exceed the 8192-token embed limit on dense text and 400 the whole batch.
serve = ["anthropic>=0.40", "openai>=1.40", "tiktoken>=0.7", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.30"]

[project.entry-points."noesis.verticals"]
# Verticals register here (in THEIR pyproject), e.g.:
#   medical = "noesis_vertical_medical:manifest"
# The kernel discovers all installed verticals via this entry-point group.
# A deployment activates exactly ONE (single-vertical-per-deployment, O3).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noesis_kernel"]
