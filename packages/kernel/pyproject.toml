[project]
name = "noesis-kernel"
version = "0.0.0"
description = "Noesis domain-agnostic kernel"
requires-python = ">=3.13"
# Deps added per phase (P1 ingestion, P2 retrieval, ...). Kept minimal on purpose.
dependencies = []

[project.entry-points."noesis.verticals"]
# Verticals register here (in THEIR pyproject), e.g.:
#   regulatory = "noesis_vertical_regulatory:manifest"
# The kernel discovers all installed verticals via this entry-point group.
# A deployment activates exactly ONE (single-vertical-per-deployment, O3).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noesis_kernel"]
