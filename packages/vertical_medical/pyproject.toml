[project]
name = "noesis-vertical-medical"
version = "0.0.0"
description = "Noesis medical / biomedical vertical (ClinicalTrials.gov + evidence hierarchy)"
requires-python = ">=3.13"
dependencies = ["noesis-kernel"]

[project.entry-points."noesis.verticals"]
medical = "noesis_vertical_medical:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already bundles everything under the package dir, INCLUDING data/*.json
# fixtures — do NOT add a force-include for data/ (it double-adds the files and fails a
# clean wheel build: "A second file is being added to the wheel archive at the same path").
packages = ["noesis_vertical_medical"]
