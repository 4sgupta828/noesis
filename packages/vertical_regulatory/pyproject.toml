[project]
name = "noesis-vertical-regulatory"
version = "0.0.0"
description = "Noesis regulatory-commissions vertical (reference implementation)"
requires-python = ">=3.13"
dependencies = ["noesis-kernel"]

[project.entry-points."noesis.verticals"]
regulatory = "noesis_vertical_regulatory:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noesis_vertical_regulatory"]
