[build]
builder = "dockerfile"
dockerfilePath = "deploy/Dockerfile"

[deploy]
startCommand = "bash deploy/start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# 2 replicas for concurrent-request headroom (single worker/event-loop per replica; long research
# requests no longer starve each other). Safe: the corpus gap-processor claims jobs atomically, so the
# replicas SHARE the drain (no duplicate ingestion); sessions/corpus are DB-backed and shared.
numReplicas = 2
# DON'T sever in-flight answers on deploy (the "Couldn't reach the research service" root cause):
# a long streamed answer runs for minutes; without drain, replacing containers kills the stream.
# overlapSeconds keeps the OLD deployment serving after the new one is healthy; drainingSeconds
# gives existing connections time to finish after SIGTERM (uvicorn's graceful shutdown then lets
# open SSE responses complete instead of resetting them).
overlapSeconds = 60
drainingSeconds = 300
